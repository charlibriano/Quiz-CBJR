<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Charlie Brown Jr</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JCN94Y3P0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1JCN94Y3P0');
    </script>
    <style>
        /* Variáveis CSS para facilitar a manutenção */
        :root {
            --cor-amarelo-cbjr: #f1c40f;
            --cor-preto-principal: black;
            --cor-verde-correto: #2ecc71;
            --cor-vermelho-incorreto: #e74c3c;
            --cor-fundo-transparente: rgba(0, 0, 0, 0.2);
            --cor-texto-claro: white;
            --cor-texto-escuro: black;
            /* --cor-borda-quote: #d8c938; REMOVIDO */
            /* --cor-fundo-quote: #fcf4a3; REMOVIDO */
            /* --cor-texto-quote: #222; REMOVIDO */

            --cor-fundo-audio-player-com-cor: rgba(0, 0, 0, 0.2);
            --cor-verde-vibrante: #1ed760; /* Usado no Spotify, mais vibrante */
        }

        @font-face {
            font-family: 'Elektrix';
            src: url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/Elektrix-Bold.woff2') format('woff2'),
                url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/Elektrix-Bold.woff') format('woff'),
                url('https://cdn.jsdelivr.net/gh/charlibriano/Quiz-CBJR/Elektrix%20Bold.ttf') format('truetype');
            font-weight: bold;
            font-display: swap;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 3px 3px 15px var(--cor-preto-principal);
            }
            50% {
                transform: scale(1.08);
                text-shadow: 3px 3px 25px var(--cor-amarelo-cbjr);
            }
            100% {
                transform: scale(1);
                text-shadow: 3px 3px 15px var(--cor-preto-principal);
            }
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--cor-preto-principal);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            background-attachment: scroll;
            color: var(--cor-texto-claro);
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-bottom: 180px; /* Ajustado para dar mais espaço ao player */
            transition: background-image 1s ease-in-out;
        }

        header h1 {
            font-family: 'Elektrix', sans-serif;
            font-size: 2.5em;
            color: var(--cor-amarelo-cbjr);
            text-shadow: 3px 3px 15px var(--cor-preto-principal);
            padding: 25px 40px;
            border-radius: 20px;
            display: inline-block;
            animation: pulse 2.5s infinite;
            line-height: 1.2;
            margin-top: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: var(--cor-fundo-transparente);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .quiz-info-bottom {
            display: flex;
            justify-content: center; /* Centraliza horizontalmente */
            flex-wrap: wrap; /* Permite que os itens quebrem linha */
            gap: 10px; /* Espaçamento entre os itens */
            font-size: 1.1em; /* Um pouco maior para destaque */
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-top: 20px; /* Margem superior para separar da pergunta */
            padding-top: 10px; /* Padding interno */
            border-top: 1px solid rgba(255, 255, 255, 0.2); /* Linha divisória sutil */
            width: 100%; /* Ocupa a largura total */
        }
        .quiz-info-bottom p {
            margin: 0; /* Remove margens padrão dos parágrafos */
            padding: 0 5px; /* Pequeno padding para separar os textos */
        }
        @media (max-width: 480px) {
            .quiz-info-bottom {
                font-size: 0.9em;
                gap: 5px;
                margin-top: 15px;
            }
        }
        
        .question {
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            width: 100%;
        }

        .question.fade-out {
            opacity: 0;
        }

        .question h3 {
            font-size: 1.8em;
            font-family: 'Elektrix', sans-serif;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .answers-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            justify-items: center;
        }

        .question button {
            padding: 15px 10px;
            font-size: 1.2em;
            border-radius: 10px;
            border: none;
            background-color: var(--cor-amarelo-cbjr);
            color: var(--cor-texto-escuro);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            white-space: normal;
            word-wrap: break-word;
        }

        .question button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .question button.correct {
            background-color: var(--cor-verde-correto);
        }

        .question button.incorrect {
            background-color: var(--cor-vermelho-incorreto);
        }
        .question button .feedback-icon { /* Estilo para o ícone de feedback */
            margin-left: 8px; /* Espaçamento do texto */
            font-size: 1.2em;
        }

        /* Estilo para a caixa de curiosidade */
        .curiosity-box {
            background-color: rgba(0, 0, 0, 0.4);
            color: var(--cor-texto-claro);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.95em;
            line-height: 1.4;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            opacity: 0; /* Começa transparente para a transição */
            transition: opacity 0.5s ease-in-out; /* Transição de opacidade */
            pointer-events: none; /* Não bloqueia cliques quando invisível */
        }
        .curiosity-box.show { /* Classe para mostrar a curiosidade */
            opacity: 1;
            pointer-events: all; /* Permite cliques quando visível */
        }
        .curiosity-box strong {
            color: var(--cor-amarelo-cbjr);
            font-family: 'Elektrix', sans-serif;
            font-size: 1.1em;
            display: block; /* Garante que "Curiosidade:" fique em sua própria linha */
            margin-bottom: 5px;
        }


        #restart-btn, #start-btn {
            padding: 15px 30px;
            margin-top: 20px; /* Mantenha para espaçamento dentro do container */
            background-color: var(--cor-amarelo-cbjr);
            color: var(--cor-texto-escuro);
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            transition: transform 0.2s ease;
        }

        #restart-btn:hover, #start-btn:hover {
            transform: scale(1.05);
        }

        /* --- PLAYER ATUALIZADO E CORRIGIDO --- */
        #audio-player-wrapper {
            position: fixed;
            bottom: 20px; /* Elevado 20px do rodapé */
            left: 50%;
            transform: translateX(-50%);
            max-width: 500px;
            width: 95%;
            padding: 15px 20px;
            background: var(--cor-fundo-audio-player-com-cor);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.9);
            z-index: 999;
            display: flex;
            flex-direction: column; /* Organiza o conteúdo verticalmente */
            justify-content: center;
            align-items: center;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-left-radius: 15px; /* Contorno inferior */
            border-bottom-right-radius: 15px; /* Contorno inferior */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            min-height: 100px; /* Reduzida a altura mínima para caber melhor */
            flex-wrap: wrap;
        }

        .player-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        #current-song {
            color: var(--cor-verde-vibrante);
            font-size: 1em;
            font-weight: bold;
            text-shadow: none;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        #audio {
            display: none;
        }

        .progress-bar-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 3px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            cursor: pointer;
            margin-top: 0;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--cor-verde-vibrante);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .time-display {
            color: var(--cor-verde-vibrante);
            font-size: 0.85em;
            width: 100%;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
        }

        .audio-main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-top: 5px;
        }

        .audio-control-btn {
            background-color: transparent; /* Torna o fundo transparente para a maioria dos botões */
            border: none;
            border-radius: 0; /* Remove border-radius padrão. Será aplicado apenas ao large-button */
            
            display: flex; /* Mantém flexbox para centralização do SVG */
            align-items: center;
            justify-content: center;
            padding: 0;
            
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            box-shadow: none;
            
            width: 35px; /* Diminuído para 35px */
            height: 35px; /* Diminuído para 35px */
            flex-shrink: 0;
        }

        /* Esconde o SVG não ativo dentro do botão de repeat e mute */
        /* Controlado via JS agora */
        #repeat-btn #repeat-all-svg { display: block; } /* Default */
        #repeat-btn #repeat-one-svg { display: none; } /* Default */
        #mute-btn #volume-svg { display: block; } /* Default */
        #mute-btn #mute-svg { display: none; } /* Default */


        .audio-control-btn svg {
            /* Estilo para os SVGs DENTRO dos botões */
            width: 100%; /* Faz o SVG preencher todo o espaço do botão transparente */
            height: 100%;
            fill: #b3b3b3;
            transition: fill 0.3s ease, transform 0.2s ease;
        }
        /* Cor padrão para os elementos internos dos SVGs complexos (repeat e shuffle) */
        /* Estes são os defaults baseados nos SVGs que você forneceu */
        #repeat-btn svg .repeat-outer-circle { fill: #344E5D; }
        #repeat-btn svg .repeat-arrow-1, #repeat-btn svg .repeat-arrow-2 { fill: white; }
        #repeat-btn #repeat-one-svg .repeat-one-circle { fill: #b3b3b3; }
        #repeat-btn #repeat-one-svg .repeat-one-number, #repeat-btn #repeat-one-svg .repeat-one-arrows { fill: white; }

        /* SHUFFLE: Cores quando INATIVO (o estado padrão) */
        #shuffle-btn svg .shuffle-main-circle { fill: #b3b3b3; }
        #shuffle-btn svg path:not(.shuffle-main-circle), #shuffle-btn svg polyline {
            stroke: #535353;
            fill: none;
        }


        .audio-control-btn:hover {
            background-color: transparent;
            transform: none;
        }

        .audio-control-btn:hover svg {
            fill: #ffffff;
            transform: scale(1.15);
        }
        #repeat-btn:not(.active):hover svg .repeat-outer-circle {
            fill: #ffffff;
        }
        #repeat-btn:not(.active):hover svg .repeat-arrow-1,
        #repeat-btn:not(.active):hover svg .repeat-arrow-2 {
            fill: black;
        }
        #shuffle-btn:not(.active):hover svg .shuffle-main-circle {
            fill: #ffffff;
        }
        #shuffle-btn:not(.active):hover svg path,
        #shuffle-btn:not(.active):hover svg polyline {
            stroke: black;
        }
        #repeat-btn:not(.active):hover #repeat-one-svg .repeat-one-circle { fill: #ffffff; }
        #repeat-btn:not(.active):hover #repeat-one-svg .repeat-one-number, #repeat-btn:not(.active):hover #repeat-one-svg .repeat-one-arrows { fill: black; }


        .audio-control-btn:active {
            transform: none;
        }
        .audio-control-btn:active svg {
            transform: scale(0.95);
        }

        .audio-control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .audio-control-btn:disabled svg {
            fill: #666666;
            transform: none;
        }

        /* Estilo EXCLUSIVO para o botão grande (Play/Pause) */
        .audio-control-btn.large-button {
            background-color: #ffffff;
            border-radius: 50%;
            
            width: 55px;
            height: 55px;
            
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .audio-control-btn.large-button svg {
            width: 50%;
            height: 50%;
            fill: var(--cor-preto-principal);
            transform: none;
        }

        .audio-control-btn.large-button:hover {
            transform: scale(1.05);
            background-color: #eeeeee;
        }
        .audio-control-btn.large-button:hover svg {
            fill: var(--cor-preto-principal);
            transform: none;
        }
        .audio-control-btn.large-button:active {
            transform: scale(0.97);
        }

        /* Cor verde para ícones ativos (repeat e shuffle) */
        #repeat-btn.active svg .repeat-outer-circle,
        #shuffle-btn.active svg .shuffle-main-circle {
            fill: var(--cor-verde-vibrante) !important;
        }
        #repeat-btn.active svg .repeat-arrow-1,
        #repeat-btn.active svg .repeat-arrow-2 {
            fill: white !important;
        }
        #shuffle-btn.active svg path, #shuffle-btn.active svg polyline {
            stroke: white !important;
            fill: none !important;
        }
        #repeat-btn.active #repeat-one-svg .repeat-one-circle { fill: var(--cor-verde-vibrante) !important; }
        #repeat-btn.active #repeat-one-svg .repeat-one-number, #repeat-btn.active #repeat-one-svg .repeat-one-arrows { fill: white !important; }

        /* Ícone de volume (normal ou mudo) sempre verde */
        #volume-svg path, #mute-svg path {
            fill: var(--cor-verde-vibrante) !important;
        }


        .audio-volume-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 80%;
            max-width: 350px;
            margin-top: 8px;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #535353;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--cor-verde-vibrante);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            margin-top: -6px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--cor-verde-vibrante);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #volume-slider:hover::-webkit-slider-thumb,
        #volume-slider:hover::-moz-range-thumb {
            background: var(--cor-verde-vibrante); /* Mantém verde no hover */
            transform: scale(1.1);
        }
        #volume-slider:active::-webkit-slider-thumb,
        #volume-slider:active::-moz-range-thumb {
            transform: scale(0.9);
        }

        #volume-value {
            color: var(--cor-verde-vibrante);
            font-size: 0.8em;
            width: 35px;
            text-align: right;
            flex-shrink: 0;
        }

        /* REMOVIDO: CÓDIGO DA CAIXA DE FRASES NO TOPO */

        /* Estilo para a mensagem de nível */
        #level-up-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--cor-verde-correto);
            color: var(--cor-texto-claro);
            padding: 25px 40px;
            border-radius: 15px;
            font-family: 'Elektrix', sans-serif;
            font-size: 2em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: all;
        }
        #level-up-message.show {
            opacity: 1;
        }
        #level-up-message button {
            padding: 12px 25px;
            font-size: 1.2em;
            background-color: var(--cor-amarelo-cbjr);
            color: var(--cor-texto-escuro);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #level-up-message button:hover {
            transform: scale(1.05);
        }

        /* Estilo para cobrir o quiz e desabilitar cliques */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1500;
            display: none;
            pointer-events: all;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
                padding: 15px 20px;
            }

            .container {
                padding: 20px;
                margin: 0 10px 40px 10px;
            }

            .question h3 {
                font-size: 1.4em;
            }
            
            /* Mantém o grid 2x2 para telas menores, ajustando o tamanho da fonte dos botões */
            .question button {
                height: auto;
                padding: 12px 10px;
                font-size: 0.9em;
            }

            /* Ajustes responsiveis para o player */
            #audio-player-wrapper {
                /* Reduzir o padding vertical para compactar mais */
                padding: 8px 15px; /* Reduzido de 12px para 8px verticalmente */
                border-top-left-radius: 12px;
                border-top-right-radius: 12px;
                border-bottom-left-radius: 12px;
                border-bottom-right-radius: 12px;
                min-height: 75px; /* Reduzida a altura mínima para 75px */
                bottom: 15px; /* Elevado um pouco mais para mobile */
            }
            .player-content {
                /* Reduzir o gap para compactar mais os elementos internos */
                gap: 5px; /* Mantido em 5px */
            }
            #current-song {
                font-size: 0.9em;
            }
            .progress-container {
                height: 3px;
            }
            .time-display {
                font-size: 0.75em;
            }
            .audio-main-controls {
                gap: 15px;
            }
            .audio-control-btn {
                width: 35px;
                height: 35px;
            }
            .audio-control-btn svg {
                width: 100%;
                height: 100%;
            }
            .audio-control-btn.large-button {
                width: 50px;
                height: 50px;
            }
            .audio-control-btn.large-button svg {
                width: 50%;
                height: 50%;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5em;
                padding: 10px 15px;
            }

            .question button {
                font-size: 0.85em;
                padding: 10px 8px;
            }

            #start-btn, #restart-btn {
                font-size: 1.2em;
                padding: 10px 20px;
            }

            /* Ajustes responsiveis para o player */
            #audio-player-wrapper {
                /* Reduzir o padding vertical para compactar mais */
                padding: 6px 12px; /* Reduzido de 8px para 6px verticalmente */
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
                border-bottom-left-radius: 10px;
                border-bottom-right-radius: 10px;
                min-height: 65px; /* Reduzida a altura mínima para 65px */
                bottom: 10px; /* Elevado um pouco mais para mobile */
            }
            .player-content {
                /* Reduzir o gap para compactar mais os elementos internos */
                gap: 2px; /* Reduzido de 3px para 2px */
            }
            #current-song {
                font-size: 0.8em;
            }
            .progress-container {
                height: 3px;
            }
            .time-display {
                font-size: 0.7em;
            }
            .audio-main-controls {
                gap: 10px;
            }
            .audio-control-btn {
                width: 30px;
                height: 30px;
            }
            .audio-control-btn svg {
                width: 100%;
                height: 100%;
            }
            .audio-control-btn.large-button {
                width: 45px;
                height: 45px;
            }
            .audio-control-btn.large-button svg {
                width: 45%;
                height: 45%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Quiz: <br><br> Charlie <br><br> Brown Jr</h1>
    </header>

    <div class="container">
        <button id="start-btn" onclick="startQuiz()">Iniciar Quiz</button>
        
        <div id="quiz">
        </div>

        <div id="quiz-info-bottom" class="quiz-info-bottom">
            <p id="progress-text"></p>
            <p id="score-text"></p>
            <p id="level-text"></p>
        </div>

        <p id="medal"></p>
        <button id="restart-btn" onclick="restartQuiz()" style="display:none;">Reiniciar Quiz</button>
    </div>

    <div id="level-up-message" style="display:none;"></div>

    <div id="overlay" style="display:none;"></div>
    
    <div id="audio-player-wrapper">
        <audio id="audio"></audio>    
        
        <div class="player-content">
            <p id="current-song"></p>
            <div class="progress-bar-area">
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span> / <span id="total-duration">0:00</span>
                </div>
            </div>

            <div class="audio-main-controls">
                <button id="repeat-btn" class="audio-control-btn" title="Repetir Playlist">
                    <svg id="repeat-all-svg" viewBox="0 0 473.677 473.677" fill="currentColor">

        ];

        function preloadImages(urls, callback) {
            let loaded = 0;
            const images = [];
            urls.forEach((url, index) => {
                images[index] = new Image();
                images[index].src = url;
                images[index].onload = () => {
                    loaded++;
                    if (loaded === urls.length) {
                        callback();
                    }
                };
                images[index].onerror = () => {
                    console.warn(`Erro ao carregar imagem: ${url}. Verifique o caminho ou permissões.`);
                    loaded++;
                    if (loaded === urls.length) {
                        callback();
                    }
                };
            });
        }

        window.onload = () => {
            preloadImages(backgroundImages, () => {
                document.body.style.backgroundImage = `url("${backgroundImages[0]}")`;
                changeBackgroundImageInterval();
            });
            // REMOVIDO: shuffleQuotes(quotes);
            // REMOVIDO: changeQuote();

            // Inicializar o ícone de volume corretamente ao carregar
            const volumeSvg = document.getElementById('volume-svg');
            const muteSvg = document.getElementById('mute-svg');

        function changeBackgroundImageInterval() {
            setInterval(() => {
                currentBackgroundIndex = (currentBackgroundIndex + 1) % backgroundImages.length;
                document.body.style.backgroundImage = `url("${backgroundImages[currentBackgroundIndex]}")`;
            }, 10000);
        }

                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                playlist = data;

                if (playlist.length > 0) {

        // FUNÇÕES DO PLAYER
        function playSong() {
            audio.play()
                .then(() => {
                    playPauseBtn.querySelector('svg path').setAttribute('d', 'M6 18h4V6H6v12zm8 0h4V6h-4v12z'); // Ícone de pause
                })
                .catch(e => {
                    console.warn('Erro ao tentar tocar música:', e.name, e.message);
                    if (e.name === "NotAllowedError" && audio.paused) {
                        playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
                        currentSongText.textContent = `MÚSICA: ${playlist[currentIndex] ? playlist[currentIndex].title : 'N/A'} (Clique ▶️ para tocar)`;
                    } else {
                        console.error('Erro de reprodução inesperado:', e);
                        currentSongText.textContent = `MÚSICA: ${playlist[currentIndex] ? playlist[currentIndex].title : 'Erro ao tocar'}`;
                        playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
                    }
                });
        }

        function pauseSong() {
            audio.pause();
            playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
        }

        function togglePlayPause() {
            if (audio.paused) {
                playSong();
            } else {
                pauseSong();
            }
        }

        // Função auxiliar para formatar o tempo (segundos para MM:SS)
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function playNextSong() {
            if (playlist.length === 0) return;
            if (isShuffling) {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * playlist.length);
                } while (nextIndex === currentIndex && playlist.length > 1); // Evita a mesma música se houver mais de uma
                currentIndex = nextIndex;
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            loadSong();
            playSong();
        }

        function playPrevSong() {
            if (playlist.length === 0) return;
            if (isShuffling) {
                let prevIndex;
                do {
                    prevIndex = Math.floor(Math.random() * playlist.length);
                } while (prevIndex === currentIndex && playlist.length > 1);
                prevIndex = Math.floor(Math.random() * playlist.length); // Shuffle para anterior também é aleatório
                currentIndex = prevIndex;
            } else {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            }
            loadSong();
            playSong();
        }

                playlist = [...originalPlaylist]; // Restaura a playlist original (linear)
                // Encontra a música atual na playlist original restaurada para manter a posição após desativar o shuffle
                const currentSongUrl = audio.src;

        // Função para lidar com o fim da música, considerando os modos de repetição e shuffle
        function handleSongEnd() {
            if (playlist.length === 0) return;

            if (repeatMode === 2) { // Repeat one song
                playSong(); // Apenas reinicia a atual
            } else if (isShuffling) { // Shuffle (avançar para próxima aleatória)
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * playlist.length);
                } while (nextIndex === currentIndex && playlist.length > 1); // Evita a mesma música se houver mais de uma
                currentIndex = nextIndex;
                loadSong();
                playSong();
            } else if (repeatMode === 1) { // Repeat playlist (linear, loop)
                currentIndex = (currentIndex + 1) % playlist.length;
                loadSong();
                playSong();
            } else { // No repeat, no shuffle (linear, para no final)
                currentIndex = (currentIndex + 1);
                if (currentIndex < playlist.length) {
                    loadSong();
                    playSong();
                } else {
                    audio.pause();
                    playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
                    currentSongText.textContent = 'Fim da playlist';
                    currentIndex = 0; // Reseta para o início da playlist
                    loadSong(); // Carrega a primeira música sem tocar
                }
            }
        }
        // FIM DAS FUNÇÕES DO PLAYER INTERATIVO

        function loadSong() {
            if (!playlist.length) {
                currentSongText.textContent = 'MÚSICA: N/A (Playlist vazia ou erro)';
                playPauseBtn.disabled = true;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                repeatBtn.disabled = true;
                shuffleBtn.disabled = true;
                muteBtn.disabled = true;
                volumeSlider.disabled = true;
                return;
            }
            const song = playlist[currentIndex];
            currentSongText.textContent = `MÚSICA: ${song.title}`;
            audio.src = song.url;
            
            // Habilita os botões se houver playlist
            playPauseBtn.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            repeatBtn.disabled = false;
            shuffleBtn.disabled = false;
            muteBtn.disabled = false;
            volumeSlider.disabled = false;

            // Garante que o volume inicial seja aplicado ao carregar a página
            audio.volume = volumeSlider.value;
            volumeValueSpan.textContent = `${Math.round(volumeSlider.value * 100)}%`;

            // Resetar o tempo e carregar a duração total
            currentTimeSpan.textContent = '0:00';
            totalDurationSpan.textContent = '0:00';    
            audio.onloadedmetadata = () => {
                if (!isNaN(audio.duration) && audio.duration > 0) {
                    totalDurationSpan.textContent = formatTime(audio.duration);
                }
            };
            audio.oncanplaythrough = () => {
                // Tenta tocar a música assim que estiver pronta, se não estiver pausada
                if (!audio.paused) { // Se não estiver pausado (ou seja, deveria estar tocando)
                    playSong();
                } else {
                    // Se o áudio está pausado (ex: autoplay bloqueado, ou usuário pausou manualmente)
                    // Garante que o ícone de play esteja visível
                    playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
                    currentSongText.textContent = `MÚSICA: ${song.title}`; // Garante o nome da música
                }
            };
            audio.onerror = (e) => {
                console.error("Erro ao carregar áudio:", e);
                currentSongText.textContent = `MÚSICA: Erro ao carregar ${song.title}`;
                playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
            };
        }

        audio.addEventListener('ended', handleSongEnd); // Usa a nova função para lidar com o fim da música

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // REMOVIDO: function changeQuote() { ... }


        function startQuiz() {
            startBtn.style.display = 'none';
            currentLevel = 0;
            currentQuestionIndexInLevel = 0;
            score = 0;
            errorsInCurrentLevel = 0; // Resetar erros ao iniciar um novo quiz
            quizPaused = false;
            isProcessingAnswer = false;
            quiz.style.pointerEvents = 'all';

            // Garante que a curiosidade box esteja escondida no início de um novo quiz
            curiosityBox.style.display = 'none';
            curiosityBox.classList.remove('show');

            loadLevel(true); // Adicione um parâmetro `isStartOfQuiz` para `loadLevel`
            
            if (playlist.length > 0) {
                if (!audio.src || audio.src === window.location.href || currentSongText.textContent.includes('N/A') || audio.readyState === 0) {
                    currentIndex = Math.floor(Math.random() * playlist.length);
                    loadSong();
                }
            } else {
                console.warn('Não foi possível iniciar a música: playlist vazia.');
                currentSongText.textContent = 'MÚSICA: Não disponível (Erro na playlist)';
            }
        }

        // Modifique a função loadLevel para aceitar um parâmetro `isStartOfQuiz`
        function loadLevel(isStartOfQuiz = false) {
            // Esconde a curiosidade box ao carregar um novo nível/pergunta
            curiosityBox.style.display = 'none';
            curiosityBox.classList.remove('show');

            if (currentLevel >= questionsByLevel.length) {
                endGame(true); // Vencedor
                return;
            }

            errorsInCurrentLevel = 0; // <--- RESETAR ERROS PARA O NOVO NÍVEL
            currentQuestionIndexInLevel = 0;
            currentLevelQuestions = [...questionsByLevel[currentLevel]];
            shuffleArray(currentLevelQuestions);
            
            // NOVO: Chama showLevelUpMessage() apenas se não for o início do quiz e houver níveis seguintes
            // E currentLevel é o nível para o QUAL estamos indo, então se for > 0, significa que não é o primeiro nível do jogo.
            if (!isStartOfQuiz && currentLevel > 0) {
                    showLevelUpMessage();
            } else {
                // Se for o início do quiz (currentLevel === 0) ou se for o primeiro nível a ser carregado,
                // já mostra a primeira pergunta diretamente.
                showQuestion();
                updateQuizInfo();
                isProcessingAnswer = false; // Garante que esteja pronto para a próxima interação
                quiz.style.pointerEvents = 'all'; // Reabilita a interação com o quiz
            }
        }

        function showLevelUpMessage() {
            quizPaused = true;
            isProcessingAnswer = true; // Impede cliques enquanto a mensagem estiver ativa
            quiz.style.pointerEvents = 'none';
            mainOverlay.style.display = 'block';
            
            levelUpMessage.innerHTML = `
                <div>Nível ${currentLevel + 1}! Mandou bem!</div>
                <button onclick="continueQuiz()">Continuar</button>

            levelUpMessage.style.backgroundColor = 'var(--cor-verde-correto)';
            levelUpMessage.style.display = 'flex';
            levelUpMessage.classList.add('show');

        function continueQuiz() {
            levelUpMessage.classList.remove('show');
            setTimeout(() => {
                levelUpMessage.style.display = 'none';
                mainOverlay.style.display = 'none';
                quizPaused = false;
                isProcessingAnswer = false; // Reabilita o processamento após o clique
                quiz.style.pointerEvents = 'all'; // Reabilita a interação
                
                // Após o "Continuar", re-exibe a primeira pergunta do nível recém-carregado
                showQuestion();
                updateQuizInfo();
            }, 500); // tempo da transição de desaparecimento da mensagem
        }

        function updateQuizInfo() {
            scoreText.textContent = `Acertos: ${score}`;
            levelText.textContent = `Nível: ${currentLevel + 1}`;
            if (currentLevelQuestions.length > 0) {
                progressText.textContent = `Pergunta: ${currentQuestionIndexInLevel + 1}/${currentLevelQuestions.length}`;
            } else {
                progressText.textContent = `Pergunta: 0/0`;
            }
            // ADICIONA INFORMAÇÃO DE ERROS NO NÍVEL SE HOUVER
            if (errorsInCurrentLevel > 0) {
                levelText.textContent += ` (Erros: ${errorsInCurrentLevel})`;
            }
        }

        function showQuestion() {
            if (quizPaused) return;

            // Esconde a curiosidade box quando uma nova pergunta é exibida
            curiosityBox.style.display = 'none';
            curiosityBox.classList.remove('show');

            // Verifica se todas as perguntas do nível atual foram respondidas
            if (currentQuestionIndexInLevel >= currentLevelQuestions.length) {
                currentLevel++; // Incrementa o nível.
                loadLevel(); // Tenta carregar o próximo nível ou encerra o jogo.
                return;
            }
            
            isProcessingAnswer = true;
            quiz.style.pointerEvents = 'none';

            const questionElement = document.createElement('div');
            questionElement.classList.add('question');
            
            const questionData = currentLevelQuestions[currentQuestionIndexInLevel];
            const shuffledAnswers = [...questionData.respostas];
            shuffleArray(shuffledAnswers);

            questionElement.innerHTML = `
                <h3>${questionData.pergunta}</h3>
                <div class="answers-container">
                    ${shuffledAnswers.map(resposta => `
                        <button class="answer-button" data-answer="${resposta}" data-correct="${questionData.correta}">${resposta}</button>
                    `).join('')}
                </div>
            `;

            const currentQuizContent = quiz.querySelector('.question');
            if (currentQuizContent) {
                currentQuizContent.classList.add('fade-out');
                setTimeout(() => {
                    quiz.innerHTML = '';
                    quiz.appendChild(questionElement);
                    updateQuizInfo();
                    isProcessingAnswer = false;
                    quiz.style.pointerEvents = 'all';
                }, 500);
            } else {
                quiz.innerHTML = '';
                quiz.appendChild(questionElement);
                updateQuizInfo();
                isProcessingAnswer = false;
                quiz.style.pointerEvents = 'all';
            }
        }

        function handleQuizClick(event) {
            if (quizPaused || isProcessingAnswer) {
                event.stopPropagation();
                return;
            }

            const clickedButton = event.target.closest('.answer-button');
            if (clickedButton) {
                const answer = clickedButton.dataset.answer;
                const correta = clickedButton.dataset.correct;
                checkAnswer(clickedButton, answer, correta);
            }
        }

        function checkAnswer(clickedButton, answer, correta) {
            if (quizPaused || isProcessingAnswer) return;

            isProcessingAnswer = true; // Bloqueia novos cliques
            quiz.style.pointerEvents = 'none'; // Desabilita interação com o quiz

            const buttons = quiz.querySelectorAll('.answer-button');
            buttons.forEach(button => {
                button.disabled = true; // Desabilita todos os botões para evitar múltiplos cliques
            });

            const questionData = currentLevelQuestions[currentQuestionIndexInLevel];

            if (answer === correta) {
                clickedButton.classList.add('correct');
                clickedButton.innerHTML += ' <span class="feedback-icon">✅</span>';
                score++;
                updateQuizInfo();
                showCuriosity(questionData.curiosidade, true);

                setTimeout(() => {
                    curiosityBox.classList.remove('show');
                    setTimeout(() => {
                        currentQuestionIndexInLevel++;
                        showQuestion();
                    }, 500);
                }, 4000);
            } else {
                clickedButton.classList.add('incorrect');
                clickedButton.innerHTML += ' <span class="feedback-icon">❌</span>';
                errorsInCurrentLevel++; // <--- INCREMENTA O CONTADOR DE ERROS NO NÍVEL
                updateQuizInfo();
                showCuriosity(questionData.curiosidade, false);

                if (errorsInCurrentLevel >= 2) { // <--- SE 2 OU MAIS ERROS NO NÍVEL ATUAL
                    setTimeout(() => {
                        curiosityBox.classList.remove('show');
                        setTimeout(() => {
                            endGame(false, true); // Chama endGame indicando que falhou o nível
                        }, 500);

                } else {

                    setTimeout(() => {
                        curiosityBox.classList.remove('show');
                        setTimeout(() => {
                            currentQuestionIndexInLevel++;
                            showQuestion();
                        }, 500);
                    }, 4000);
                }
            }
        }

        function showCuriosity(curiosity, isCorrect) {

        // MODIFICADO: Adicionado parâmetro `failedLevel` para diferenciar o tipo de derrota

                score = 0;
                errorsInCurrentLevel = 0; // <--- RESETAR ERROS AO REINICIAR O QUIZ
                scoreText.textContent = '';
                progressText.textContent = '';
                levelText.textContent = '';
                medalText.textContent = '';
                restartBtn.style.display = 'none';
                levelUpMessage.style.display = 'none';
                mainOverlay.style.display = 'none';
                quizPaused = false;
                isProcessingAnswer = false;
                quiz.style.pointerEvents = 'all';

                quiz.innerHTML = '';
                
                startQuiz();
                
            }, 500);
        }
    </script>
</body>
</html>
