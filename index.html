<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Charlie Brown Jr</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JCN94Y3P0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1JCN94Y3P0');
    </script>
    <style>
        /* Variáveis CSS para facilitar a manutenção */
        :root {
            --cor-amarelo-cbjr: #f1c40f;
            --cor-preto-principal: #343434;
            --cor-verde-correto: #2ecc71;
            --cor-vermelho-incorreto: #e74c3c;
            /* Mais transparência para a caixa de mensagem principal */
            --cor-fundo-transparente: rgba(0, 0, 0, 0.3);
            --cor-texto-claro: white;
            --cor-texto-escuro: black;

            --cor-fundo-audio-player-com-cor: rgba(0, 0, 0, 0.3); /* Já é 0.3 */
            --cor-verde-vibrante: #1ed760; /* Usado no Spotify, mais vibrante */

            /* Cores para o cronômetro circular (mantidas para funcionalidade interna, mas invisíveis) */
            --cor-timer-fundo-circulo: rgba(255, 255, 255, 0.1);
            --cor-timer-progresso: #f1c40f; /* Amarelo do CBJR */
            --cor-timer-progresso-perigo: #e74c3c; /* Vermelho quando o tempo está acabando */
            --cor-timer-texto: #f1c40f;

            /* NOVO: Cores para a barra de progresso de níveis */
            --cor-progresso-fundo: rgba(255, 255, 255, 0.15);
            --cor-progresso-preenchimento: var(--cor-amarelo-cbjr);
        }

        @font-face {
            font-family: 'Elektrix';
            src: url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/Elektrix-Bold.woff2') format('woff2'),
                url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/Elektrix-Bold.woff') format('woff'),
                url('https://cdn.jsdelivr.net/gh/charlibriano/Quiz-CBJR/Elektrix%20Bold.ttf') format('truetype');
            font-weight: bold;
            font-display: swap;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 3px 3px 15px var(--cor-preto-principal);
            }
            50% {
                transform: scale(1.08);
                text-shadow: 3px 3px 25px var(--cor-amarelo-cbjr);
            }
            100% {
                transform: scale(1);
                text-shadow: 3px 3px 15px var(--cor-preto-principal);
            }
        }

        /* Keyframes para o brilho */
        @keyframes glow-correct {
            0% { box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 20px var(--cor-verde-correto); }
            100% { box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); }
        }

        @keyframes glow-incorrect {
            0% { box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 20px var(--cor-vermelho-incorreto); }
            100% { box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); }
        }

        /* NOVO: Keyframes para transição de entrada das respostas (DURAÇÃO AUMENTADA) */
        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px); /* Levemente mais para baixo */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* NOVO: Keyframes para o efeito de tremor */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--cor-preto-principal);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; /* Mantido como 'cover' para preencher a tela */
            background-attachment: fixed;
            color: var(--cor-texto-claro);
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-bottom: 180px;
            transition: background-image 1s ease-in-out; /* Mantido para transição suave */
            overflow-x: hidden; /* Garante que não haverá scroll horizontal indesejado */
        }

        /* Media query para telas menores: 'cover' ainda é geralmente o melhor para preencher */
        @media (max-width: 768px) {
            body {
                background-size: cover;
            }
        }


        header h1 {
            font-family: 'Elektrix', sans-serif;
            font-size: 2.5em;
            color: var(--cor-amarelo-cbjr);
            text-shadow: 3px 3px 15px var(--cor-preto-principal);
            padding: 25px 40px;
            border-radius: 20px;
            display: inline-block;
            animation: pulse 2.5s infinite;
            line-height: 1.2;
            margin-top: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            /* AGORA USA a variável centralizada */
            background-color: var(--cor-fundo-transparente);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* NOVO: Estilo para a barra de progresso de níveis */
        #level-progress-bar-container {
            width: 90%;
            height: 12px;
            background-color: var(--cor-progresso-fundo);
            border-radius: 6px;
            margin-top: 25px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        #level-progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--cor-progresso-preenchimento);
            border-radius: 6px;
            /* Transição ajustada para mais suavidade */
            transition: all 0.6s ease-in-out;
        }

        #level-progress-bar-text {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cor-texto-escuro); /* Texto escuro para contraste com o amarelo */
            font-size: 0.7em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.3);
            mix-blend-mode: overlay; /* Ajuste para melhor leitura sobre o preenchimento */
        }


        .quiz-info-bottom {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            font-size: 1.1em; /* Removido para manter a consistência da fonte padrão, mas pode ser mantido se for intencional */
        }
        .quiz-info-bottom p {
            margin: 0;
            padding: 0 5px;
        }
        @media (max-width: 480px) {
            .quiz-info-bottom {
                font-size: 0.9em;
                gap: 5px;
                margin-top: 15px;
            }
        }

        .question {
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            width: 100%;
        }

        .question.fade-out {
            opacity: 0;
        }

        .question h3 {
            font-size: 1.8em;
            font-family: 'Elektrix', sans-serif;
            margin-bottom: 25px;
            line-height: 1.4;
            /* NOVO: Brilho na fonte para destaque */
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.7),
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 15px var(--cor-amarelo-cbjr);
        }

        /* NOVO: Classe para aplicar o efeito de tremor */
        .question h3.shake {
            animation: shake 0.2s 3; /* Dura 0.2s e repete 3 vezes */
        }


        /* REMOVENDO CRONÔMETRO VISUAL */
        .timer-display {
            display: none;
        }

        /* NOVO: Container para respostas e curiosidade lado a lado */
        .question-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
        }

        @media (min-width: 769px) {
            .question-content {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* Ajustes para o answers-container para nova estrutura */
        .answers-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-grow: 1;
            min-width: 50%;
            width: auto;
        }

        .question button {
            padding: 15px 10px;
            font-size: 1.2em;
            border-radius: 10px;
            border: none;
            background-color: var(--cor-preto-principal);
            color: var(--cor-texto-claro);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;

            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            white-space: normal;
            word-wrap: break-word;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            position: relative; /* Para posicionar o atalho de teclado */

            /* NOVO: Estilos iniciais para a animação de entrada das respostas */
            opacity: 0;
            transform: translateY(30px); /* Move mais para baixo para um slide mais visível */
        }

        /* DURAÇÃO AUMENTADA AQUI */
        .question button.show {
            animation: fadeInSlideUp 0.8s ease-out forwards;
        }

        /* Estilo para o atalho de teclado */
        .question button .keyboard-shortcut {
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 0.7em;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        .question button:hover:not(:disabled) {
            transform: scale(1.05);
            background-color: rgba(255, 255, 255, 0.1);
        }

        .question button.correct {
            background-color: var(--cor-verde-correto);
        }

        .question button.incorrect {
            background-color: var(--cor-vermelho-incorreto);
        }

        /* Estilos de brilho aplicados via JS */
        .answer-button.glow-correct {
            animation: glow-correct 1.5s ease-out forwards;
        }

        .answer-button.glow-incorrect {
            animation: glow-incorrect 1.5s ease-out forwards;
        }


        .question button .feedback-icon {
            margin-left: 8px;
            color: white;
            font-size: 1.2em;
        }

        /* Antiga curiosity-box - agora estará oculta, o conteúdo vai para curiosity-sidebar-box */
        .curiosity-box {
            display: none;
        }

        /* NOVO: Estilo para a caixa de curiosidade ao lado */
        .curiosity-sidebar-box {
            /* AGORA USA a variável centralizada */
            background-color: var(--cor-fundo-transparente);
            color: var(--cor-texto-claro);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.5;
            text-align: center;
            flex-basis: 35%;
            max-width: 40%;
            min-width: 250px;
            box-sizing: border-box;
            opacity: 0; /* Controlado por JS para fade-in/out */
            /* Transição ajustada para a curiosidade: apenas opacidade e sem transform */
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            align-self: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;

            margin-top: 20px;
            margin-bottom: 0;

            /* REMOVIDO: Estilos iniciais para a animação de entrada da curiosidade (transform) */
            /* transform: translateX(30px); */
        }

        @media (min-width: 769px) {
            .curiosity-sidebar-box {
                margin-top: 0;
                text-align: left;
                align-self: flex-start;
            }
        }

        /* DURAÇÃO RESTAURADA e ANIMAÇÃO REMOVIDA */
        .curiosity-sidebar-box.show {
            opacity: 1;
            pointer-events: all;
            /* REMOVIDO: Aplica a animação fadeInSlideLeft */
            /* animation: fadeInSlideLeft 0.8s ease-out forwards; */
            /* REMOVIDO: Pequeno atraso para a animação ficar mais suave */
            /* animation-delay: 0.2s; */
        }

        .curiosity-sidebar-box strong {
            color: var(--cor-amarelo-cbjr);
            font-family: 'Elektrix', sans-serif;
            font-size: 1.1em;
            display: block;
            margin-bottom: 8px;
        }

        /* NOVO: Estilo para a mensagem de combo */
        #combo-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(241, 196, 15, 0.8); /* Amarelo do CBJR */
            color: var(--cor-preto-principal);
            padding: 15px 30px;
            border-radius: 10px;
            font-family: 'Elektrix', sans-serif;
            font-size: 2.2em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            z-index: 2500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            white-space: nowrap; /* Para evitar quebras de linha */
            display: none; /* Inicia oculto */
        }

        #combo-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
            display: block;
        }

        /* NOVO: Estilo para o pop-up de conquista */
        #achievement-popup {
            position: fixed;
            top: 20%; /* Perto do topo */
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--cor-verde-correto); /* Verde de acerto */
            color: var(--cor-texto-claro);
            padding: 15px 25px;
            border-radius: 10px;
            font-family: 'Elektrix', sans-serif;
            font-size: 1.5em;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            display: none; /* Inicia oculto */
            animation: fadeInOut 3s forwards; /* Animação de fade in e out */
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -30px); } /* Começa acima e transparente */
            20% { opacity: 1; transform: translate(-50%, 0); } /* Sube e aparece */
            80% { opacity: 1; transform: translate(-50%, 0); } /* Permanece */
            100% { opacity: 0; transform: translate(-50%, -30px); } /* Desce e desaparece */
        }
        #achievement-popup.show {
            display: block;
        }

        /* NOVO: Estilos para a tela de conquistas */
        #achievements-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Fundo escuro com mais opacidade */
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* Para rolagem se houver muitas conquistas */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none; /* Inicia desativado */
        }
        #achievements-screen.show {
            opacity: 1;
            pointer-events: all;
        }
        #achievements-screen h2 {
            font-family: 'Elektrix', sans-serif;
            color: var(--cor-amarelo-cbjr);
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 3px 3px 15px var(--cor-preto-principal);
        }
        #achievements-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
        }
        .achievement-card {
            background-color: var(--cor-fundo-transparente);
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px; /* Garante altura mínima para alinhamento */
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .achievement-card.unlocked {
            border: 2px solid var(--cor-verde-vibrante);
            background-color: rgba(30, 215, 96, 0.2); /* Verde mais suave */
        }
        .achievement-card h3 {
            font-family: 'Elektrix', sans-serif;
            color: var(--cor-texto-claro);
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: none; /* Remove brilho padrão */
        }
        .achievement-card p {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            flex-grow: 1; /* Faz o parágrafo ocupar o espaço restante */
        }
        .achievement-card .status {
            font-size: 0.8em;
            font-weight: bold;
            color: var(--cor-amarelo-cbjr);
            text-align: right;
        }
        .achievement-card.unlocked .status {
            color: var(--cor-verde-vibrante);
        }
        /* Botão de fechar da tela de conquistas */
        #close-achievements-btn {
            padding: 12px 25px;
            font-size: 1.2em;
            background-color: var(--cor-preto-principal);
            color: var(--cor-texto-claro);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            text-shadow: 0 0 8px rgba(255,255,255,0.8);
            margin-top: 20px;
        }
        #close-achievements-btn:hover {
            transform: scale(1.05);
            background-color: #4a4a4a;
        }

        /* Responsividade para a tela de conquistas - AJUSTADO PARA EVITAR SCROLL */
        @media (max-width: 600px) {
            #achievements-screen {
                padding: 10px; /* Reduz padding geral para telas muito pequenas */
                /* overflow-y: auto; -- Removido para garantir que o container não force scroll */
                justify-content: flex-start; /* Alinha o conteúdo ao topo */
            }
            #achievements-screen h2 {
                font-size: 1.5em; /* Fonte ainda menor para o título */
                margin-bottom: 15px; /* Margem reduzida */
            }
            #achievements-list {
                grid-template-columns: repeat(2, 1fr); /* DUAS COLUNAS para celulares */
                width: 100%; /* Ocupa toda a largura disponível */
                gap: 8px; /* Espaçamento menor entre os cards */
                padding: 0 5px; /* Pequeno padding lateral para não colar nas bordas */
            }
            .achievement-card {
                padding: 10px; /* Reduz padding do card ainda mais */
                min-height: 90px; /* Altura mínima para tentar caber o conteúdo */
            }
            .achievement-card h3 {
                font-size: 0.9em; /* Reduz fonte do título do card */
                margin-bottom: 5px; /* Margem reduzida */
                line-height: 1.1; /* Ajusta line-height para caber mais texto */
            }
            .achievement-card p {
                font-size: 0.7em; /* Reduz fonte do texto do card ainda mais */
                margin-bottom: 8px; /* Margem inferior reduzida */
                line-height: 1.3;
            }
            .achievement-card .status {
                font-size: 0.6em; /* Reduz fonte do status */
            }
            #close-achievements-btn {
                font-size: 1em; /* Reduz fonte do botão */
                padding: 8px 15px; /* Reduz padding do botão */
                margin-top: 15px; /* Reduz margem superior */
            }
        }

        #restart-btn {
            padding: 15px 30px;
            margin-top: 20px;
            background-color: var(--cor-preto-principal);
            color: var(--cor-texto-claro);
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        /* Os botões start-btn e achievements-btn não estão mais no container principal HTML, mas sim na overlay da intro message */
        /* Mas podemos manter o estilo base para botões da overlay para consistência, ou criar um estilo específico para eles lá se quiser */
        #level-up-message .message-buttons button {
            padding: 15px 30px;
            margin-top: 20px;
            background-color: var(--cor-preto-principal);
            color: var(--cor-texto-claro);
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        #restart-btn:hover, #level-up-message .message-buttons button:hover {
            transform: scale(1.05);
            background-color: #4a4a4a;
        }

        /* REMOVENDO POP-UP DE PONTUAÇÃO VISUAL */
        #points-popup {
            display: none !important; /* Força a remoção do display */
            visibility: hidden !important; /* Garante que não é visível */
            opacity: 0 !important; /* Garante que não é visível */
        }

        /* --- PLAYER ATUALIZADO E CORRIGIDO --- */
        #audio-player-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 250px; /* Reduzido de 500px para 250px (metade) */
            width: 90%; /* Ajustado para 90% para mobile */
            padding: 10px 15px; /* Reduzido o padding */
            background: var(--cor-fundo-audio-player-com-cor);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.9);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            min-height: 80px; /* Reduzido min-height */
            flex-wrap: wrap;
        }

        .player-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 8px; /* Reduzido o gap */
        }

        #current-song {
            color: var(--cor-verde-vibrante);
            font-size: 0.9em; /* Reduzido */
            font-weight: bold;
            text-shadow: none;
            margin-bottom: 2px; /* Reduzido */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        #audio {
            display: none;
        }

        .progress-bar-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 2px; /* Reduzido */
        }

        .progress-container {
            width: 100%;
            height: 3px; /* Reduzido */
            background-color: #535353;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .progress-bar {

        function preloadImages(urls, callback) {
            let loaded = 0;
            const images = [];
            urls.forEach((url, index) => {
                images[index] = new Image();
                images[index].src = url;
                images[index].onload = () => {
                    loaded++;
                    if (loaded === urls.length) {
                        callback();
                    }
                };
                images[index].onerror = () => {
                    console.warn(`Erro ao carregar imagem: ${url}. Verifique o caminho ou permissões.`);
                    loaded++;
                    if (loaded === urls.length) {
                        callback();
                    }
                };
            });
        }

        function changeBackgroundImageInterval() {
            setInterval(() => {
                currentBackgroundIndex = (currentBackgroundIndex + 1) % backgroundImages.length;
                document.body.style.backgroundImage = `url("${backgroundImages[currentBackgroundIndex]}")`;
            }, 10000);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // --- Funções do Player de Áudio ---
        function loadSong() {
            if (!playerState.playlist.length) {
                elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
                Object.values(elements).forEach(el => {
                    if (el && el.id && (el.id.includes('btn') || el.id.includes('slider'))) {
                        el.disabled = true;
                    }
                });
                return;
            }
            const song = playerState.playlist[playerState.currentIndex];
            elements.currentSongText.textContent = `${song.title}`;
            elements.audio.src = song.url;

            elements.playPauseBtn.disabled = false;
            elements.prevBtn.disabled = false;
            elements.nextBtn.disabled = false;
            elements.repeatBtn.disabled = false;
            elements.shuffleBtn.disabled = false;
            elements.muteBtn.disabled = false;
            elements.volumeSlider.disabled = false;

            elements.audio.volume = playerState.previousVolume;
            elements.volumeSlider.value = playerState.previousVolume;
            elements.volumeValueSpan.textContent = `${Math.round(elements.volumeSlider.value * 100)}%`;

            elements.currentTimeSpan.textContent = '0:00';
            elements.totalDurationSpan.textContent = '0:00';
            elements.audio.onloadedmetadata = () => {
                if (!isNaN(elements.audio.duration) && elements.audio.duration > 0) {
                    elements.totalDurationSpan.textContent = formatTime(elements.audio.duration);
                }
            };
            elements.audio.oncanplaythrough = () => {
                if (elements.audio.paused) {
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
                }
                elements.currentSongText.textContent = `${song.title}`;
            };
            elements.audio.onerror = (e) => {
                console.error("Erro ao carregar áudio:", e);
                elements.currentSongText.textContent = `Erro ao carregar ${song.title}`;
                elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
            };
        }

                .catch(e => {
                    console.warn('Erro ao tentar tocar música:', e.name, e.message);
                    if (e.name === "NotAllowedError" && elements.audio.paused) {
                        elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');

        }

        function pauseSong() {
            elements.audio.pause();
            elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
        }

        function togglePlayPause() {
            if (elements.audio.paused) {
                playSong();
            } else {
                pauseSong();
            }
        }

        function playNextSong() {
            if (playerState.playlist.length === 0) return;
            if (playerState.repeatMode === 2) {
                elements.audio.currentTime = 0;
                playSong();
            } else if (playerState.isShuffling) {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * playerState.playlist.length);
                } while (nextIndex === playerState.currentIndex && playerState.playlist.length > 1);
                playerState.currentIndex = nextIndex;
            } else {
                playerState.currentIndex = (playerState.currentIndex + 1) % playerState.playlist.length;
            }
            loadSong();
            playSong();
        }

        function playPrevSong() {
            if (playerState.playlist.length === 0) return;
            if (elements.audio.currentTime > 3) {
                elements.audio.currentTime = 0;
                playSong();
            } else if (playerState.isShuffling) {
                let prevIndex;
                do {
                    prevIndex = Math.floor(Math.random() * playerState.playlist.length);
                } while (prevIndex === playerState.currentIndex && playerState.playlist.length > 1);
                playerState.currentIndex = prevIndex;
            } else {
                playerState.currentIndex = (playerState.currentIndex - 1 + playerState.playlist.length) % playerState.playlist.length;
            }
            loadSong();
            playSong();
        }

        function updateProgressBar() {
            const { duration, currentTime } = elements.audio;

            if (!isNaN(duration) && duration > 0) {
                const progressPercent = (currentTime / duration) * 100;
                elements.progressBar.style.width = `${progressPercent}%`;

                elements.currentTimeSpan.textContent = formatTime(currentTime);
                elements.totalDurationSpan.textContent = formatTime(duration);
            } else {
                elements.progressBar.style.width = '0%';
                elements.currentTimeSpan.textContent = '0:00';
                elements.totalDurationSpan.textContent = '0:00';
            }
        }

        function setProgressBar(e) {
            const width = elements.progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = elements.audio.duration;

            if (!isNaN(duration) && duration > 0) {
                elements.audio.currentTime = (clickX / width) * duration;
            }
        }

        function handleSongEnd() {
            if (playerState.playlist.length === 0) return;

            if (playerState.repeatMode === 2) {
                elements.audio.currentTime = 0; // Reinicia a música atual
                playSong();
            } else if (playerState.isShuffling) {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * playerState.playlist.length);
                } while (nextIndex === playerState.currentIndex && playerState.playlist.length > 1);
                playerState.currentIndex = nextIndex;
                loadSong();
                playSong();
            } else if (playerState.repeatMode === 1) { // Repetir playlist
                playerState.currentIndex = (playerState.currentIndex + 1) % playerState.playlist.length;
                loadSong();
                playSong();
            } else { // Sem repetição
                playerState.currentIndex = (playerState.currentIndex + 1);
                if (playerState.currentIndex < playerState.playlist.length) {
                    loadSong();
                    playSong();
                } else {
                    elements.audio.pause();
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
                    elements.currentSongText.textContent = 'Fim da playlist';
                    playerState.currentIndex = 0; // Volta para o início da playlist, mas não toca automaticamente
                    loadSong(); // Carrega a primeira música, mas permanece pausada
                }
            }
        }


        function setupPlayerEventListeners() {
            elements.playPauseBtn.addEventListener('click', togglePlayPause);
            elements.prevBtn.addEventListener('click', playPrevSong);
            elements.nextBtn.addEventListener('click', playNextSong);
            elements.audio.addEventListener('timeupdate', updateProgressBar);
            elements.progressContainer.addEventListener('click', setProgressBar);
            elements.audio.addEventListener('ended', handleSongEnd);

            elements.muteBtn.addEventListener('click', () => {
                if (elements.audio.muted) {
                    elements.audio.muted = false;
                    elements.volumeSvg.style.display = 'block';
                    elements.muteSvg.style.display = 'none';
                    elements.audio.volume = playerState.previousVolume;
                    elements.volumeSlider.value = playerState.previousVolume;
                    elements.volumeValueSpan.textContent = `${Math.round(playerState.previousVolume * 100)}%`;
                } else {
                    playerState.previousVolume = elements.audio.volume;
                    elements.audio.muted = true;
                    elements.volumeSvg.style.display = 'none';
                    elements.muteSvg.style.display = 'block';
                    elements.volumeSlider.value = 0;
                    elements.volumeValueSpan.textContent = '0%';
                }
            });

            elements.volumeSlider.addEventListener('input', () => {
                elements.audio.volume = elements.volumeSlider.value;
                elements.volumeValueSpan.textContent = `${Math.round(elements.volumeSlider.value * 100)}%`;

                if (elements.audio.volume === 0) {
                    elements.volumeSvg.style.display = 'none';
                    elements.muteSvg.style.display = 'block';
                    elements.audio.muted = true;
                } else {
                    elements.volumeSvg.style.display = 'block';
                    elements.muteSvg.style.display = 'none';
                    elements.audio.muted = false;
                    playerState.previousVolume = elements.audio.volume;
                }
            });

            elements.repeatBtn.addEventListener('click', () => {
                playerState.repeatMode = (playerState.repeatMode + 1) % 3;

                elements.repeatAllSvg.style.display = 'none';
                elements.repeatOneSvg.style.display = 'none';
                elements.repeatBtn.classList.remove('active');

                if (playerState.repeatMode === 1) {
                    elements.repeatBtn.classList.add('active');
                    elements.repeatBtn.title = 'Repetir Playlist (ativo)';
                    elements.repeatAllSvg.style.display = 'block';
                } else if (playerState.repeatMode === 2) {
                    elements.repeatBtn.classList.add('active');
                    elements.repeatBtn.title = 'Repetir Música Atual (ativo)';
                    elements.repeatOneSvg.style.display = 'block';
                } else {
                    elements.repeatBtn.title = 'Repetir Playlist (desativado)';
                    elements.repeatAllSvg.style.display = 'block';
                }
                console.log(`Modo de repetição: ${playerState.repeatMode}`);
            });

            elements.shuffleBtn.addEventListener('click', () => {
                playerState.isShuffling = !playerState.isShuffling;
                elements.shuffleBtn.classList.toggle('active', playerState.isShuffling);

                if (playerState.isShuffling) {
                    playerState.playlist = [...playerState.originalPlaylist];
                    shuffleArray(playerState.playlist);
                } else {
                    playerState.playlist = [...playerState.originalPlaylist];
                    const currentSongUrl = elements.audio.src;
                    const newIndex = playerState.playlist.findIndex(song => song.url === currentSongUrl);
                    if (newIndex !== -1) {
                        playerState.currentIndex = newIndex;
                    } else {
                        playerState.currentIndex = 0;
                    }
                }
                console.log(`Shuffle: ${playerState.isShuffling}`);
            });
        }

        // --- Funções do Quiz ---

        function startQuiz() {
            elements.levelUpMessage.classList.remove('show');
            
            setTimeout(() => {
                elements.levelUpMessage.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                elements.quiz.style.display = 'flex'; // Torna o quiz visível

                Object.assign(quizState, {
                    currentLevel: 0,
                    currentQuestionIndexInLevel: 0,
                    score: 0,
                    errorsInCurrentLevel: 0,
                    quizPaused: false,
                    isProcessingAnswer: false,
                    scoreAtLevelStart: 0, // Reseta ao iniciar o quiz
                    consecutiveCorrectAnswers: 0 // NOVO: Reseta combo ao iniciar o quiz
                });
                elements.quiz.style.pointerEvents = 'all';

                elements.scoreText.textContent = `Pontos: ${quizState.score}`;
                elements.highScoreText.textContent = `Recorde: ${quizState.highScore}`; // Exibe o recorde ao iniciar
                updateLevelProgressBar(); // Garante que a barra de progresso do nível seja zerada

                if (playerState.playlist.length > 0) {
                    if (!elements.audio.src || elements.audio.src === window.location.href || elements.audio.readyState === 0) {
                        playerState.currentIndex = Math.floor(Math.random() * playerState.playlist.length);
                        loadSong();
                    }
                    playSong();
                } else {
                    console.warn('Playlist está vazia! Verifique o arquivo playlist.json.');
                    elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
                }
                loadLevel(true); // Inicia o primeiro nível do quiz
            }, 500); // Aguarda a transição de saída da mensagem
        }

        function loadLevel(isStartOfQuiz = false) {
            const oldCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (oldCuriositySidebar) {
                oldCuriositySidebar.classList.remove('show');
                oldCuriositySidebar.innerHTML = '';
            }

            if (quizState.currentLevel >= questionsByLevel.length) {
                endGame(true);
                return;
            }

            // NOVO: Verifica conquistas de nível completado (usa achievements.ID.unlocked)
            if (quizState.currentLevel === 1) { // Após completar o nível 1 (que é o 0 na contagem)
                unlockAchievement("first_level_completed");
            }
            if (quizState.currentLevel === 3) { // Após completar o nível 3 (que é o 2 na contagem)
                unlockAchievement("level_3_completed");
            }
            if (quizState.currentLevel === 5) { // Após completar o nível 5 (que é o 4 na contagem)
                unlockAchievement("level_5_completed");
            }


            const errorsToReport = quizState.errorsInCurrentLevel;
            quizState.errorsInCurrentLevel = 0;
            quizState.scoreAtLevelStart = quizState.score; // Salva a pontuação atual ao iniciar um novo nível

            // NOVO: Reseta o combo ao avançar para um novo nível (se não for o início do quiz)
            if (!isStartOfQuiz) {
                quizState.consecutiveCorrectAnswers = 0;
            }

            quizState.currentQuestionIndexInLevel = 0;
            quizState.currentLevelQuestions = [...questionsByLevel[quizState.currentLevel].perguntas];
            shuffleArray(quizState.currentLevelQuestions);

            if (!isStartOfQuiz && quizState.currentLevel > 0) {
                showLevelUpMessage(errorsToReport);
            } else {
                showQuestion();
                updateQuizInfo();
                updateLevelProgressBar(); // Atualiza a barra de progresso no início do nível
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';
            }
        }

        function showLevelUpMessage(errorsInPreviousLevel = 0) {
            quizState.quizPaused = true;
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';
            elements.mainOverlay.style.display = 'block';

            clearInterval(timerInterval);

            // Selecionar uma frase aleatória do array global de frases
            const randomFraseIndex = Math.floor(Math.random() * allChoraoPhrases.length);
            const fraseChorao = allChoraoPhrases[randomFraseIndex];

            let mainLevelMessage = '';
            // A cor de fundo da levelUpMessage AGORA USA a variável centralizada
            elements.levelUpMessage.style.backgroundColor = 'var(--cor-fundo-transparente)';


            if (errorsInPreviousLevel === 0) {
                mainLevelMessage = `<div>No passo a <br><br> passo eu chego <br><br> lá!</div>`;
            } else if (errorsInPreviousLevel === 1) {
                mainLevelMessage = `<div style="font-family: 'Elektrix', sans-serif; color: var(--cor-amarelo-cbjr); font-size: 1.1em;">Errou 1 heim mané! Pra ser CBJR tem que ficar mais esperto.</div>`;
            } else if (errorsInPreviousLevel > 1) {
                mainLevelMessage = `<div style="font-family: 'Elektrix', sans-serif; color: var(--cor-amarelo-cbjr); font-size: 1.1em;">Você cometeu alguns erros (${errorsInPreviousLevel}) neste nível, mas avançou!</div>`;
            }

            elements.levelUpMessage.innerHTML = `
                ${mainLevelMessage}
                <div style="font-size: 0.7em; margin-top: 15px; font-family: Arial, sans-serif; opacity: 0.9;">Você avançou para o Nível ${quizState.currentLevel + 1}!</div>
                <div style="font-size: 0.7em; margin-top: 5px; font-family: Arial, sans-serif; opacity: 0.9;">"${fraseChorao}"</div>
                <div class="message-buttons" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                    <button onclick="continueQuiz()">Avançar</button>
                </div>
            `;

            elements.levelUpMessage.style.display = 'flex';
            elements.levelUpMessage.classList.add('show');
        }

        function continueQuiz() {
            elements.levelUpMessage.classList.remove('show');
            setTimeout(() => {
                elements.levelUpMessage.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                quizState.quizPaused = false;
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';

                showQuestion();
                updateQuizInfo();
                updateLevelProgressBar(); // Atualiza a barra de progresso após avançar
            }, 500);
        }

        function updateQuizInfo() {
            elements.scoreText.textContent = `Pontos: ${quizState.score}`;
            elements.levelText.textContent = `Nível: ${quizState.currentLevel + 1}/${quizState.totalLevels}`;
            if (quizState.currentLevelQuestions.length > 0) {
                elements.progressText.textContent = `Pergunta: ${quizState.currentQuestionIndexInLevel + 1}/${quizState.currentLevelQuestions.length}`;
            } else {
                elements.progressText.textContent = `Pergunta: 0/0`;
            }
            elements.highScoreText.textContent = `Recorde: ${quizState.highScore}`; // Atualiza o recorde
        }

        // NOVO: Função para atualizar a barra de progresso de níveis
        function updateLevelProgressBar() {
            const progress = (quizState.currentLevel / quizState.totalLevels) * 100;
            elements.levelProgressBarFill.style.width = `${progress}%`;
            elements.levelProgressBarText.textContent = `Nível ${quizState.currentLevel}/${quizState.totalLevels}`;
            if (quizState.currentLevel === 0) {
                elements.levelProgressBarText.textContent = `Comece a Jornada!`;
            } else if (quizState.currentLevel === quizState.totalLevels) {
                elements.levelProgressBarText.textContent = `Fim da Jornada!`;
            }
        }

        // NOVO: Função para mostrar a mensagem de combo e aplicar bônus de pontos
        function showComboMessage(combo) {
            let message = '';
            let bonusPoints = 0;

            if (COMBO_BONUS.hasOwnProperty(combo)) {
                message = `${achievements[`combo_${combo}x`].name}! ${combo}x acertos!`;
                bonusPoints = COMBO_BONUS[combo];
                unlockAchievement(`combo_${combo}x`); // Desbloqueia a conquista de combo
            } else if (combo > 10 && combo % 5 === 0) {
                message = `Incrível! ${combo}x acertos!`;
                bonusPoints = 10; // Bônus de 10 pontos para cada 5 acertos após 10x
            }

            if (message) {
                quizState.score += bonusPoints; // Aplica os pontos de bônus
                elements.scoreText.textContent = `Pontos: ${quizState.score}`; // Atualiza o placar imediatamente
                elements.comboMessage.textContent = `${message} (+${bonusPoints} pts)`; // Exibe pontos no combo
                elements.comboMessage.classList.add('show');
                setTimeout(() => {
                    elements.comboMessage.classList.remove('show');
                }, 1500); // Mostra por 1.5 segundos
            }
        }

        // NOVO: Função para mostrar o pop-up de conquista
        function showAchievementPopup(achievementName) {
            elements.achievementPopup.textContent = `Conquista: ${achievementName} Desbloqueada!`;
            elements.achievementPopup.classList.add('show');
            // Garante que o pop-up esteja na frente da overlay se ela estiver ativa
            elements.achievementPopup.style.zIndex = Math.max(elements.achievementPopup.style.zIndex, elements.mainOverlay.style.zIndex + 1);

            setTimeout(() => {
                elements.achievementPopup.classList.remove('show');
                elements.achievementPopup.style.display = 'none'; // Esconde completamente após a animação
            }, 3000); // Exibe por 3 segundos
        }

        // NOVO: Função para desbloquear conquista
        function unlockAchievement(achievementId) {
            // Verifica se a conquista já está desbloqueada no objeto 'achievements'
            if (achievements[achievementId] && !achievements[achievementId].unlocked) {
                achievements[achievementId].unlocked = true; // Marca como desbloqueada na definição global
                quizState.unlockedAchievements[achievementId] = true; // Sincroniza com o estado do quiz
                localStorage.setItem('cobjr_quiz_achievements', JSON.stringify(quizState.unlockedAchievements));
                showAchievementPopup(achievements[achievementId].name);
                console.log(`Conquista desbloqueada: ${achievements[achievementId].name}`);
            }
        }

        // NOVO: Função para carregar conquistas do localStorage
        function loadAchievements() {
            const storedAchievements = localStorage.getItem('cobjr_quiz_achievements');
            if (storedAchievements) {
                const parsedAchievements = JSON.parse(storedAchievements);
                // Itera sobre as conquistas definidas e atualiza o estado `unlocked` com base no localStorage
                for (const id in achievements) {
                    if (parsedAchievements.hasOwnProperty(id)) {
                        achievements[id].unlocked = parsedAchievements[id];
                        quizState.unlockedAchievements[id] = parsedAchievements[id]; // Mantém quizState sincronizado
                    } else {
                        // Se uma conquista no 'achievements' não está no localStorage, inicializa como false
                        achievements[id].unlocked = false;
                        quizState.unlockedAchievements[id] = false;
                    }
                }
            } else {
                // Se não há dados no localStorage, inicializa todas como bloqueadas
                for (const id in achievements) {
                    achievements[id].unlocked = false;
                    quizState.unlockedAchievements[id] = false;
                }
            }
        }


        // NOVO: Função para exibir a tela de conquistas
        function showAchievementsScreen() {

            elements.mainOverlay.style.display = 'block';
            elements.levelUpMessage.classList.remove('show'); // Esconde a mensagem de introdução se estiver visível
            elements.levelUpMessage.style.display = 'none'; // Esconde completamente a mensagem de introdução

            for (const id in achievements) {
                const achievement = achievements[id];
                const isUnlocked = achievement.unlocked; // Usa o estado 'unlocked' da definição de conquista

                    card.classList.add('unlocked');

                    <p>${achievement.description}</p>

                elements.achievementsList.appendChild(card);

            elements.achievementsScreen.style.display = 'flex';

        // NOVO: Função para fechar a tela de conquistas
        function closeAchievementsScreen() {
            elements.achievementsScreen.classList.remove('show');
            setTimeout(() => {
                elements.achievementsScreen.style.display = 'none';
                showIntroMessage(); // Volta para a tela de introdução
            }, 500);
        }

        function showQuestion() {
            if (quizState.quizPaused) return;

            const oldCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (oldCuriositySidebar) {
                oldCuriositySidebar.classList.remove('show');
                oldCuriositySidebar.innerHTML = '';
            }

            if (quizState.currentQuestionIndexInLevel >= quizState.currentLevelQuestions.length) {
                quizState.currentLevel++;
                loadLevel();
                return;
            }

            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';

            const questionElement = document.createElement('div');
            questionElement.classList.add('question');

            const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
            const shuffledAnswers = [...questionData.respostas];
            shuffleArray(shuffledAnswers);

            questionElement.innerHTML = `
                <h3 id="current-question-text">${questionData.pergunta}</h3> <div class="question-content">
                    <div class="answers-container">
                        ${shuffledAnswers.map((resposta, index) => `
                            <button class="answer-button" data-answer="${resposta}" data-correct="${questionData.correta}">
                                <span class="keyboard-shortcut">${index + 1}</span>${resposta}
                            </button>
                        `).join('')}
                    </div>
                    <div class="curiosity-sidebar-box">
                    </div>
                </div>
            `;

            // Garante que o quiz container esteja visível antes de adicionar as questões
            elements.quiz.style.display = 'flex'; // Certifica que o display é flex para que os elementos internos funcionem

            const currentQuizContent = elements.quiz.querySelector('.question');
            if (currentQuizContent) {
                currentQuizContent.classList.add('fade-out');
                setTimeout(() => {
                    elements.quiz.innerHTML = '';
                    elements.quiz.appendChild(questionElement);
                    // Aplica a classe 'show' para iniciar a animação das respostas
                    questionElement.querySelectorAll('.answer-button').forEach((button, i) => {
                        // Atraso AUMENTADO para cada botão aparecer sequencialmente
                        setTimeout(() => {
                            button.classList.add('show');
                        }, i * 100);
                    });
                    updateQuizInfo();
                    quizState.isProcessingAnswer = false;
                    elements.quiz.style.pointerEvents = 'all';
                    startTimer(); // O timer continua rodando em segundo plano
                }, 500);
            } else {
                elements.quiz.innerHTML = '';
                elements.quiz.appendChild(questionElement);
                // Aplica a classe 'show' para iniciar a animação das respostas
                questionElement.querySelectorAll('.answer-button').forEach((button, i) => {
                    // Atraso AUMENTADO para cada botão aparecer sequencialmente
                    setTimeout(() => {
                        button.classList.add('show');
                    }, i * 100);
                });
                updateQuizInfo();
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';
                startTimer(); // O timer continua rodando em segundo plano
            }
        }

        function handleQuizClick(event) {
            // Verifica se o clique veio do botão "Conquistas" ou "Iniciar Quiz" na mensagem de introdução
            if (event.target.id === 'show-achievements-button') {
                showAchievementsScreen();
                return;
            }
            if (event.target.id === 'start-quiz-button') {
                startQuiz();
                return;
            }


            if (quizState.quizPaused || quizState.isProcessingAnswer) {
                event.stopPropagation();
                return;
            }

            const clickedButton = event.target.closest('.answer-button');
            if (clickedButton) {
                const answer = clickedButton.dataset.answer;
                const correta = clickedButton.dataset.correct;
                checkAnswer(clickedButton, answer, correta);
            }
        }

        // NOVO: Handler para teclas do teclado
        function handleKeyboardInput(event) {
            // Se a tela de conquistas está aberta, apenas permite fechar com 'Escape'
            if (elements.achievementsScreen.classList.contains('show')) {
                if (event.key === 'Escape') {
                    closeAchievementsScreen();
                }
                return;
            }


            if (quizState.quizPaused || quizState.isProcessingAnswer) return;

            // Teclas para respostas (1, 2, 3, 4)
            const numberKey = parseInt(event.key);
            if (!isNaN(numberKey) && numberKey >= 1 && numberKey <= 4) {
                const answerButtons = elements.quiz.querySelectorAll('.answer-button');
                if (answerButtons[numberKey - 1]) {
                    answerButtons[numberKey - 1].click();
                }
                return; // Impede que outras ações de teclado ocorram
            }

            // Teclas para controles do player de áudio
            switch (event.key.toLowerCase()) {
                case ' ': // Barra de espaço para Play/Pause
                    event.preventDefault(); // Evita rolagem da página
                    togglePlayPause();
                    break;
                case 'arrowleft': // Seta esquerda para música anterior
                    playPrevSong();
                    break;
                case 'arrowright': // Seta direita para próxima música
                    playNextSong();
                    break;
                case 'r': // 'R' para repetir
                    elements.repeatBtn.click();
                    break;
                case 'f': // 'F' para shuffle
                    elements.shuffleBtn.click();
                    break;
                case 'arrowup': // Seta para cima para aumentar volume
                    elements.audio.volume = Math.min(1, elements.audio.volume + 0.1);
                    elements.volumeSlider.value = elements.audio.volume;
                    elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;
                    elements.audio.muted = false; // Desmuta se aumentar o volume
                    elements.volumeSvg.style.display = 'block';
                    elements.muteSvg.style.display = 'none';
                    break;
                case 'arrowdown': // Seta para baixo para diminuir volume
                    elements.audio.volume = Math.max(0, elements.audio.volume - 0.1);
                    elements.volumeSlider.value = elements.audio.volume;
                    elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;
                    if (elements.audio.volume === 0) { // Muta se o volume for para zero
                        elements.audio.muted = true;
                        elements.volumeSvg.style.display = 'none';
                        elements.muteSvg.style.display = 'block';
                    }
                    break;
                case 'm': // 'M' para mudo
                    elements.muteBtn.click();
                    break;
            }
        }

        function showCuriosity(curiosity) {
            const curiositySidebarBox = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (curiositySidebarBox) {
                curiositySidebarBox.innerHTML = `<strong>Você Sabia?:</strong> ${curiosity}`;
                curiositySidebarBox.style.backgroundColor = 'var(--cor-fundo-transparente)';
                // Garante que a opacidade seja 0 antes de adicionar 'show' para a transição
                curiositySidebarBox.style.opacity = 0;
                // Adiciona a classe 'show' após um pequeno atraso para reativar a transição de opacidade
                setTimeout(() => {
                    curiositySidebarBox.classList.add('show');
                    curiositySidebarBox.style.opacity = 1; // Garante que a opacidade final seja 1
                }, 50); // Pequeno atraso para garantir que a transição de opacidade aconteça
            } else {
                console.warn("Elemento .curiosity-sidebar-box não encontrado para exibir a curiosidade.");
            }
        }

        function checkAnswer(clickedButton, answer, correta) {
            if (quizState.quizPaused || quizState.isProcessingAnswer) return;

            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';

            clearInterval(timerInterval);

            const timeTaken = (Date.now() - questionStartTime) / 1000;

            const buttons = elements.quiz.querySelectorAll('.answer-button');
            buttons.forEach(button => {
                button.disabled = true;
            });

            const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
            let pointsEarned = 0;

            if (answer.toLowerCase() === correta.toLowerCase()) { // Correção do bug de case-insensitive
                clickedButton.classList.add('correct', 'glow-correct');
                clickedButton.innerHTML += ' <span class="feedback-icon">✅</span>';

                pointsEarned = BASE_SCORE_PER_CORRECT;
                if (timeTaken <= BONUS_MAX_THRESHOLD) {
                    pointsEarned += BONUS_MAX;
                } else if (timeTaken <= BONUS_MEDIUM_THRESHOLD) {
                    pointsEarned += BONUS_MEDIUM;
                } else if (timeTaken <= TIME_PER_QUESTION) {
                    pointsEarned += BONUS_MIN;
                }

                quizState.score += pointsEarned;
                quizState.consecutiveCorrectAnswers++; // Incrementa o combo
                
                // NOVO: Chama showComboMessage para verificar e aplicar bônus de combo
                showComboMessage(quizState.consecutiveCorrectAnswers);
                
                updateQuizInfo();
                showCuriosity(questionData.curiosidade);

                setTimeout(() => {
                    clickedButton.classList.remove('glow-correct');
                    quizState.currentQuestionIndexInLevel++;
                    showQuestion();
                }, 4000);
            } else {
                clickedButton.classList.add('incorrect', 'glow-incorrect');
                clickedButton.innerHTML += ' <span class="feedback-icon">❌</span>';

                const questionTextElement = document.getElementById('current-question-text'); // Pega o elemento H3
                if (questionTextElement) {
                    questionTextElement.classList.add('shake'); // Adiciona a classe shake
                    questionTextElement.addEventListener('animationend', () => {
                        questionTextElement.classList.remove('shake'); // Remove a classe após a animação
                    }, { once: true }); // Ouve o evento apenas uma vez
                }

                quizState.errorsInCurrentLevel++;
                quizState.consecutiveCorrectAnswers = 0; // Reseta o combo ao errar
                updateQuizInfo();
                showCuriosity(`Tempo esgotado! A resposta correta era: "${questionData.correta}". ${questionData.curiosidade}`);

                if (quizState.errorsInCurrentLevel >= 2) {
                    setTimeout(() => {
                        clickedButton.classList.remove('glow-incorrect');
                        endGame(false, true);
                    }, 4000);
                } else {
                    setTimeout(() => {
                        clickedButton.classList.remove('glow-incorrect');
                        quizState.currentQuestionIndexInLevel++;
                        showQuestion();
                    }, 4000);
                }
            }
        }

        function endGame(isWinner, failedLevel = false) {
            quizState.quizPaused = true;
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';
            elements.mainOverlay.style.display = 'block';

            clearInterval(timerInterval);

            elements.quiz.innerHTML = '';

            const currentCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (currentCuriositySidebar) {
                currentCuriositySidebar.classList.remove('show');
                currentCuriositySidebar.innerHTML = '';
            }

            quizState.totalQuestions = questionsByLevel.reduce((acc, levelData) => acc + levelData.perguntas.length, 0);

            let messageHtml = '';
            let bgColor = 'var(--cor-fundo-transparente)'; // Padrão transparente

            // NOVO: Verifica conquista de novo recorde
            const oldHighScore = parseInt(localStorage.getItem('cobjr_quiz_highscore') || '0');
            if (quizState.score > oldHighScore) {
                quizState.highScore = quizState.score;
                localStorage.setItem('cobjr_quiz_highscore', quizState.highScore);
                unlockAchievement("new_high_score"); // Desbloqueia a conquista de recorde
            }

            // NOVO: Desbloqueia conquista de completar todos os níveis
            if (isWinner && quizState.currentLevel === quizState.totalLevels) { // A condição aqui é '===' para garantir que o último nível foi alcançado
                unlockAchievement("all_levels_completed");
            }
            updateLevelProgressBar(); // Atualiza barra de progresso para 100% ou 0% dependendo do fim de jogo

            if (isWinner) {
                let medalTitle = "";
                const maxPossibleScore = quizState.totalQuestions * (BASE_SCORE_PER_CORRECT + BONUS_MAX);

                if (quizState.score === maxPossibleScore) {
                    medalTitle = "Mestre Chorão! 🎸🏆";
                } else if (quizState.score >= maxPossibleScore * 0.75) {
                    medalTitle = "Fã Conhecedor! 🧠✨";
                } else if (quizState.score >= maxPossibleScore * 0.5) {
                    medalTitle = "Fã Iniciado! 🤘";
                } else {
                    medalTitle = "Skate na Mão! 😉";
                }

                messageHtml = `
                    <div>${medalTitle}</div>
                    <div style="font-size: 0.8em; margin-top: 10px; font-family: Arial, sans-serif;">Você fez ${quizState.score} pontos!</div>
                    <div style="font-size: 0.8em; margin-top: 5px; font-family: Arial, sans-serif;">Seu recorde é: ${quizState.highScore} pontos!</div> <div class="message-buttons" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                        <button onclick="restartQuiz()">Jogar Novamente</button>
                    </div>
                `;
            } else {
                if (failedLevel) {
                    messageHtml = `
                        <div>Você errou demais neste nível.</div>
                        <div style="font-size: 0.8em; margin-top: 10px; font-family: Arial, sans-serif;">Tente novamente para dominar o Nível ${quizState.currentLevel + 1}!</div>
                        <div style="font-size: 0.8em; margin-top: 5px; font-family: Arial, sans-serif;">Seu recorde é: ${quizState.highScore} pontos!</div> <div class="message-buttons" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                            <button onclick="retryLevel()">Tentar Nível Novamente</button>
                            <button onclick="restartQuiz()">Reiniciar Quiz (Do Início)</button>
                        </div>
                    `;
                    bgColor = 'rgba(231, 76, 60, 0.7)'; /* Vermelho um pouco transparente para erro */
                } else {
                    messageHtml = `
                        <div>Oops! Quase lá!</div>
                        <div style="font-size: 0.8em; margin-top: 10px; font-family: Arial, sans-serif;">Você fez ${quizState.score} pontos.</div>
                        <div style="font-size: 0.8em; margin-top: 5px; font-family: Arial, sans-serif;">Seu recorde é: ${quizState.highScore} pontos!</div> <div class="message-buttons" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                            <button onclick="restartQuiz()">Reiniciar Quiz (Do Início)</button>
                        </div>
                    `;
                    bgColor = 'rgba(231, 76, 60, 0.7)'; /* Vermelho um pouco transparente para erro */
                }
            }
            elements.levelUpMessage.innerHTML = messageHtml;
            elements.levelUpMessage.style.backgroundColor = bgColor; // Aplica a cor de fundo (transparente ou erro transparente)
            elements.levelUpMessage.style.display = 'flex';
            elements.levelUpMessage.classList.add('show');
        }

        function retryLevel() {
            elements.levelUpMessage.classList.remove('show');
            setTimeout(() => {
                elements.levelUpMessage.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                quizState.quizPaused = false;
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';

                // NOVO: Reseta a pontuação para o valor que tinha ao INICIAR o nível
                quizState.score = quizState.scoreAtLevelStart;
                quizState.errorsInCurrentLevel = 0;
                quizState.consecutiveCorrectAnswers = 0; // NOVO: Reseta combo ao tentar o nível novamente
                quizState.currentQuestionIndexInLevel = 0;
                quizState.currentLevelQuestions = [...questionsByLevel[quizState.currentLevel].perguntas];
                shuffleArray(quizState.currentLevelQuestions);
                showQuestion();
                updateQuizInfo();
                updateLevelProgressBar();
            }, 500);
        }

        function restartQuiz() {
            elements.levelUpMessage.classList.remove('show');
            setTimeout(() => {
                Object.assign(quizState, {
                    currentLevel: 0,
                    currentQuestionIndexInLevel: 0,
                    score: 0,
                    errorsInCurrentLevel: 0,
                    quizPaused: false,
                    isProcessingAnswer: false,
                    scoreAtLevelStart: 0, // Reseta ao reiniciar o quiz completo
                    consecutiveCorrectAnswers: 0 // NOVO: Reseta combo ao reiniciar o quiz completo
                });
                clearInterval(timerInterval);
                elements.scoreText.textContent = `Pontos: ${quizState.score}`;
                elements.progressText.textContent = '';
                elements.levelText.textContent = '';
                elements.medalText.textContent = '';
                elements.restartBtn.style.display = 'none';
                elements.levelUpMessage.style.display = 'none';
                elements.pointsPopup.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                elements.quiz.style.pointerEvents = 'all';
                elements.quiz.style.display = 'none'; // Garante que o quiz fique oculto no restart completo

                // NOVO: Carrega o recorde ao reiniciar o quiz
                quizState.highScore = parseInt(localStorage.getItem('cobjr_quiz_highscore') || '0');
                elements.highScoreText.textContent = `Recorde: ${quizState.highScore}`;
                updateLevelProgressBar(); // Reseta a barra de progresso

                elements.quiz.innerHTML = '';
                const currentCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
                if (currentCuriositySidebar) {
                    currentCuriositySidebar.classList.remove('show');
                    currentCuriositySidebar.innerHTML = '';
                }
                showIntroMessage(); // Chama a mensagem de introdução novamente para reiniciar o ciclo
            }, 500);
        }

        function startTimer() {
            clearInterval(timerInterval);
            questionStartTime = Date.now();

            let timeLeft = TIME_PER_QUESTION;
            timerInterval = setInterval(() => {
                timeLeft--;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimerEnd();
                }
            }, 1000);
        }

        function handleTimerEnd() {
            if (quizState.isProcessingAnswer) return;
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';

            clearInterval(timerInterval);

            const questionTextElement = document.getElementById('current-question-text'); // Pega o elemento H3
            if (questionTextElement) {
                questionTextElement.classList.add('shake'); // Adiciona a classe shake
                questionTextElement.addEventListener('animationend', () => {
                    questionTextElement.classList.remove('shake'); // Remove a classe após a animação
                }, { once: true }); // Ouve o evento apenas uma vez
            }

            quizState.errorsInCurrentLevel++;
            quizState.consecutiveCorrectAnswers = 0; // Reseta o combo ao tempo esgotar
            updateQuizInfo();

            const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
            // No time-out, apenas desabilitar botões
            const buttons = elements.quiz.querySelectorAll('.answer-button');
            buttons.forEach(button => {
                button.disabled = true; // Desabilita todos os botões
            });

            showCuriosity(`Tempo esgotado! A resposta correta era: "${questionData.correta}". ${questionData.curiosidade}`);

            setTimeout(() => {
                if (quizState.errorsInCurrentLevel >= 2) {
                    endGame(false, true);
                } else {
                    quizState.currentQuestionIndexInLevel++;
                    showQuestion();
                }
            }, 4000);
        }

        // --- Inicialização ao Carregar a Página ---
        // Array com todas as frases do Chorão para serem sorteadas aleatoriamente
        const allChoraoPhrases = [
            "Não busco a perfeição em ninguém, não quero que busquem isso em mim.",
            "Quem é de verdade sabe quem é de mentira.",
            "Eles querem que você se sinta mal, pois assim eles se sentem bem.",
            "Eu me flagrei pensando em você em você em tudo o que eu queria te dizer...",
            "Não tão complicado demais, mas nem tão simples assim.",
            "Se eu não puder fazer você ser a pessoa mais feliz, eu chego mais perto disso possível.",
            "A arte maior é o jeito de cada um... vivo pra ser feliz, não vivo pra ser comum."
            // Adicione mais frases aqui se desejar
        ];


        window.onload = () => {
            loadAchievements(); // Carrega conquistas salvas ao iniciar
            // NOVO: Carrega o recorde do localStorage ao carregar a página
            quizState.highScore = parseInt(localStorage.getItem('cobjr_quiz_highscore') || '0');
            elements.highScoreText.textContent = `Recorde: ${quizState.highScore}`;

            preloadImages(backgroundImages, () => {
                document.body.style.backgroundImage = `url("${backgroundImages[0]}")`;
                changeBackgroundImageInterval();
            });

            elements.quiz.addEventListener('click', handleQuizClick);
            document.addEventListener('keydown', handleKeyboardInput); // Adiciona o listener de teclado
            
            setupPlayerEventListeners();

            elements.audio.volume = playerState.previousVolume;
            elements.volumeSlider.value = playerState.previousVolume; // Usa o volume existente
            elements.volumeValueSpan.textContent = `${Math.round(elements.volumeSlider.value * 100)}%`;

            // Mantenha a lógica de mute/unmute baseada no volume inicial ou estado salvo
            if (elements.audio.volume === 0 || elements.audio.muted) {
                elements.volumeSvg.style.display = 'none';
                elements.muteSvg.style.display = 'block';
                elements.audio.muted = true;
            } else {
                elements.volumeSvg.style.display = 'block';
                elements.muteSvg.style.display = 'none';
                elements.audio.muted = false;
            }


            quizState.totalQuestions = questionsByLevel.reduce((acc, levelData) => acc + levelData.perguntas.length, 0);

            fetch('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/playlist.json')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    playerState.playlist = data;
                    playerState.originalPlaylist = [...data];
                    if (playerState.playlist.length > 0) {
                        playerState.currentIndex = Math.floor(Math.random() * playerState.playlist.length);
                        loadSong();
                        elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
                    } else {
                        console.warn('Playlist está vazia! Verifique o arquivo playlist.json.');
                        elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
                        elements.playPauseBtn.disabled = true;
                        elements.prevBtn.disabled = true;
                        elements.nextBtn.disabled = true;
                        elements.repeatBtn.disabled = true;
                        elements.shuffleBtn.disabled = true;
                        elements.muteBtn.disabled = true;
                        elements.volumeSlider.disabled = true;
                    }
                    showIntroMessage(); // CHAMA A MENSAGEM DE BOAS-VINDAS AQUI AO CARREGAR
                    updateLevelProgressBar(); // Inicializa a barra de progresso de níveis
                })
                .catch(error => {
                    console.error('Erro ao carregar playlist:', error);
                    elements.currentSongText.textContent = `Erro ao carregar a playlist. Tente novamente mais tarde.`;
                    elements.playPauseBtn.disabled = true;
                    elements.prevBtn.disabled = true;
                    elements.nextBtn.disabled = true;
                    elements.repeatBtn.disabled = true;
                    elements.shuffleBtn.disabled = true;
                    elements.muteBtn.disabled = true;
                    elements.volumeSlider.disabled = true;
                    showIntroMessage(); // Ainda mostra a intro message mesmo que a playlist falhe
                    updateLevelProgressBar(); // Inicializa a barra de progresso de níveis mesmo com erro na playlist
                });
        };
    </script>
</body>
</html>
