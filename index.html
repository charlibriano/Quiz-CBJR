    function preloadImages(urls, callback) {
        let loaded = 0;
        const images = [];
        urls.forEach((url, index) => {
            images[index] = new Image();
            images[index].src = url;
            images[index].onload = () => {
                loaded++;
                if (loaded === urls.length) {
                    callback();
                }
            };
            images[index].onerror = () => {
                console.warn(`Erro ao carregar imagem: ${url}. Ignorando.`);
                loaded++;
                if (loaded === urls.length) {
                    callback();
                }
            };
        });
    }

    function changeBackgroundImageInterval() {

    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // NOVO: Função para normalizar texto (agora bem mais robusta para títulos de músicas)
    function normalizeText(text) {
        if (!text) return '';

        let normalized = text.normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "") // Remove diacríticos (acentos)
            .toLowerCase()
            .trim();

        // 1. Remover tudo entre parênteses ou colchetes, incluindo eles mesmos.
        // Ex: (Doze Mais Um), (Part. Charlie Brown Jr), (Tour Cedo ou Tarde Ao Vivo)
        normalized = normalized.replace(/[\(\[].*?[\)\]]/g, ' ');

        // 2. Remover termos de colaboração e nomes de artistas/bandas conhecidas no contexto CBJR.
        // Use \b para limites de palavra e \s* para espaços opcionais.
        normalized = normalized.replace(/\b(feat|ft|part)\.?\s*[\w\s.]+/g, ''); // Remove "feat.", "ft.", "part." e o que vier depois (artista)
        normalized = normalized.replace(/\b(e|com)\s+(vanessa da mata|negrali|nx zero|marcelo nova|chorao)\b/g, ''); // Specific artist names
        
        // 3. Remover o nome da banda e variações comuns.
        normalized = normalized.replace(/\b(charlie brown jr|cbjr)\b\s*[-–.]?/g, '');

        // 4. Remover prefixos de projetos/eventos comuns no início ou em qualquer lugar.
        normalized = normalized.replace(/\s*(estudio coca-cola zero|acustico mtv|ao vivo|unplugged|oficial)\s*[:–—\s]?/g, '');
        
        // 5. Substituir travessões, dois pontos e outros separadores comuns por um espaço simples.
        normalized = normalized.replace(/[-–—:]/g, ' ');

        // 6. Remover símbolos específicos ou convertê-los, e tratar números por extenso.
        normalized = normalized.replace(/\+/g, ' mais '); // Converte '+' para ' mais '
        normalized = normalized.replace(/\bdoze\b/g, '12'); // Converte 'doze' para '12'
        normalized = normalized.replace(/\buma\b/g, '1'); // Converte 'uma' para '1' (caso "Uma Criança...")
        normalized = normalized.replace(/\bai ai ai\b/g, 'ai ai ai'); // Para garantir que "ai ai ai" não seja afetado por outras regras se houver ambiguidade

        // 7. Remover qualquer pontuação restante que não seja letra, número ou espaço.
        normalized = normalized.replace(/[^a-z0-9\s]/g, '');

        // 8. Substituir múltiplos espaços por um único espaço.
        normalized = normalized.replace(/\s+/g, ' ');

        // Remover espaços extras no início e fim após todas as substituições.
        normalized = normalized.trim();

        return normalized;
    }

    // --- Funções do Player de Áudio ---
    function loadSong(song = null) {
        let currentSongData;

        if (song) {
            // Se uma música específica foi passada (usada no modo bônus)
            currentSongData = song;
        } else if (playerState.playlist.length > 0) {
            // Caso contrário, carrega da playlist normal
            currentSongData = playerState.playlist[playerState.currentIndex];
        } else {
            elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
            elements.playPauseBtn.disabled = true;
            elements.prevBtn.disabled = true;
            elements.nextBtn.disabled = true;
            elements.repeatBtn.disabled = true;
            elements.shuffleBtn.disabled = true;
            elements.muteBtn.disabled = true;
            elements.volumeSlider.disabled = true;
            return;
        }

        elements.audio.src = currentSongData.url;

        elements.playPauseBtn.disabled = false;
        elements.prevBtn.disabled = false;
        elements.nextBtn.disabled = false;
        elements.repeatBtn.disabled = false;
        elements.shuffleBtn.disabled = false;
        elements.muteBtn.disabled = false;
        elements.volumeSlider.disabled = false;

        elements.audio.volume = playerState.previousVolume;
        elements.volumeSlider.value = playerState.previousVolume;
        elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;

        // NOVO: Controla a visibilidade do tempo da música no modo bônus

            elements.currentTimeSpan.textContent = '0:00';
            elements.totalDurationSpan.textContent = ''; // Esconde duração total
        } else {
            elements.currentTimeSpan.textContent = '0:00';
            elements.totalDurationSpan.textContent = '0:00';
        }

        elements.audio.onloadedmetadata = () => {
            if (!isNaN(elements.audio.duration) && elements.audio.duration > 0) {
                if (!bonusGameState.isBonusActive) { // Sólo muestra duración total si no está en el bonus
                    elements.totalDurationSpan.textContent = formatTime(elements.audio.duration);
                }
            }
        };
        elements.audio.oncanplaythrough = () => {
            if (elements.audio.paused) {
                elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
            }
            
            // Limpar conteúdo e resetar estilos para medição e exibição
            elements.currentSongText.innerHTML = '';
            elements.currentSongText.classList.remove('should-marquee');

            let displayText = currentSongData.title;
            // NOVO: Se o modo bônus está ativo, não mostra o título da música no player
            if (bonusGameState.isBonusActive) {
                displayText = 'Adivinhe a Música...'; // Ou algo como '???', 'Nome Secreto'
            }

            // Criar um span temporário para medir a largura real do texto
            const tempSpan = document.createElement('span');
            tempSpan.style.visibility = 'hidden';
            tempSpan.style.position = 'absolute';
            tempSpan.style.whiteSpace = 'nowrap';
            // Para garantir que a medição seja com o mesmo estilo
            tempSpan.style.fontSize = window.getComputedStyle(elements.currentSongText).fontSize;
            tempSpan.style.fontWeight = window.getComputedStyle(elements.currentSongText).fontWeight;
            tempSpan.textContent = displayText; // Usar o displayText
            document.body.appendChild(tempSpan); // Adiciona ao body para medir

            const textWidth = tempSpan.offsetWidth; // Largura real do texto
            document.body.removeChild(tempSpan); // Remove o span temporário

            // Largura visível do elemento P#current-song (o container)
            const containerWidth = elements.currentSongText.offsetWidth;

            if (textWidth > containerWidth) {
                // Texto é longo, configurar marquee
                const marqueeSpan = document.createElement('span');
                // Duplica o texto para el loop contínuo. Adiciona um espaço extra entre as cópias
                marqueeSpan.textContent = displayText + ' \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 ' + displayText;
                elements.currentSongText.appendChild(marqueeSpan);

                // Força um reflow após adicionar o texto duplicado para medir corretamente o marqueeSpan
                void marqueeSpan.offsetWidth;

                // A distância que o texto precisa percorrer é a largura de uma única cópia do texto
                const scrollDistance = -textWidth;
                marqueeSpan.style.setProperty('--marquee-distance', `${scrollDistance}px`);

                const speed = 25; // pixels por segundo
                const duration = textWidth / speed; // Tempo em segundos para rolar uma cópia inteira

                marqueeSpan.style.animation = `marquee-text ${duration}s linear infinite`;
                
                elements.currentSongText.classList.add('should-marquee');
                elements.currentSongText.style.textAlign = 'left';

            } else {
                // Texto es corto, sólo exhibe centralizado
                elements.currentSongText.textContent = displayText; // Usar o displayText
                elements.currentSongText.style.textAlign = 'center';
            }
        };
        elements.audio.onerror = (e) => {
            console.error("Erro ao carregar áudio:", e);
            elements.currentSongText.textContent = `Erro ao carregar ${currentSongData.title}`;
            elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
            if (bonusGameState.isBonusActive) { // Se estiver no modo bônus, esconde o título mesmo com erro de autoplay
                elements.currentSongText.textContent = 'Erro ao carregar (Tente novamente)';
            }
        };
    }

    function playSong() {

            .then(() => {
                elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M6 18h4V6H6v12zm8 0h4V6h-4v12z');

            .catch(e => {
                console.warn('Erro ao tentar tocar música:', e.name, e.message);
                if (e.name === "NotAllowedError" && elements.audio.paused) {
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');

                    console.error('Erro de reprodução inesperado:', e);

    function togglePlayPause() {
        if (elements.audio.paused) {
            playSong();
        } else {
            pauseSong();
        }
    }

    function playNextSong() {
        if (playerState.playlist.length === 0) return;
        if (playerState.repeatMode === 2) {
            elements.audio.currentTime = 0;
            playSong();
        } else if (playerState.isShuffling) {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * playerState.playlist.length);
            } while (nextIndex === playerState.currentIndex && playerState.playlist.length > 1);
            playerState.currentIndex = nextIndex;
        } else {
            playerState.currentIndex = (playerState.currentIndex + 1) % playerState.playlist.length;
        }
        loadSong();
        playSong();
    }

    function playPrevSong() {
        if (playerState.playlist.length === 0) return;
        if (elements.audio.currentTime > 3) {
            elements.audio.currentTime = 0;
            playSong();
        } else if (playerState.isShuffling) {
            let prevIndex;
            do {
                prevIndex = Math.floor(Math.random() * playerState.playlist.length);
            } while (prevIndex === playerState.currentIndex && playerState.playlist.length > 1);
            playerState.currentIndex = prevIndex;
        } else {
            playerState.currentIndex = (playerState.currentIndex - 1 + playerState.playlist.length) % playerState.playlist.length;
        }
        loadSong();
        playSong();
    }

    function updateProgressBar() {
        const { duration, currentTime } = elements.audio;

        if (!isNaN(duration) && duration > 0) {
            const progressPercent = (currentTime / duration) * 100;
            elements.progressBar.style.width = `${progressPercent}%`;

            elements.currentTimeSpan.textContent = formatTime(currentTime);
            // NOVO: Esconde a duração total se estiver no modo bônus
            if (!bonusGameState.isBonusActive) {
                elements.totalDurationSpan.textContent = formatTime(duration);
            }
        } else {
            elements.progressBar.style.width = '0%';
            elements.currentTimeSpan.textContent = '0:00';
            elements.totalDurationSpan.textContent = '0:00';
        }
    }

    function setProgressBar(e) {
        const width = elements.progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = elements.audio.duration;

        if (!isNaN(duration) && duration > 0) {
            elements.audio.currentTime = (clickX / width) * duration;
        }
    }

    function handleSongEnd() {
        if (playerState.playlist.length === 0) return;

        // NOVO: Se estiver no modo bônus e a música terminar, carrega a próxima
        if (bonusGameState.isBonusActive) {
            // A música deve tocar em loop no modo bônus, não ir para a próxima automaticamente
            elements.audio.currentTime = 0;
            playSong();
            return;
        }

        if (playerState.repeatMode === 2) {
            elements.audio.currentTime = 0;
            playSong();
        } else if (playerState.isShuffling) {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * playerState.playlist.length);
            } while (nextIndex === playerState.currentIndex && playerState.playlist.length > 1);
            playerState.currentIndex = nextIndex;
        } else {
            playerState.currentIndex = (playerState.currentIndex + 1) % playerState.playlist.length;
        }
        loadSong();
        playSong();
    }

    function setupPlayerEventListeners() {
        elements.playPauseBtn.addEventListener('click', togglePlayPause);
        elements.prevBtn.addEventListener('click', playPrevSong);
        elements.nextBtn.addEventListener('click', playNextSong);
        elements.audio.addEventListener('timeupdate', updateProgressBar);
        elements.progressContainer.addEventListener('click', setProgressBar);
        elements.audio.addEventListener('ended', handleSongEnd);

        elements.muteBtn.addEventListener('click', () => {
            if (elements.audio.muted) {
                elements.audio.muted = false;
                elements.volumeSvg.style.display = 'block';
                elements.muteSvg.style.display = 'none';
                elements.audio.volume = playerState.previousVolume;
                elements.volumeSlider.value = playerState.previousVolume;
                elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;
            } else {
                playerState.previousVolume = elements.audio.volume;
                elements.audio.muted = true;
                elements.volumeSvg.style.display = 'none';
                elements.muteSvg.style.display = 'block';
                elements.volumeSlider.value = 0;
                elements.volumeValueSpan.textContent = '0%';
            }
        });

        elements.volumeSlider.addEventListener('input', () => {
            elements.audio.volume = elements.volumeSlider.value;
            elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;

            if (elements.audio.volume === 0) {
                elements.volumeSvg.style.display = 'none';
                elements.muteSvg.style.display = 'block';
                elements.audio.muted = true;
            } else {
                elements.volumeSvg.style.display = 'block';
                elements.muteSvg.style.display = 'none';
                elements.audio.muted = false;
            }
        });

        elements.repeatBtn.addEventListener('click', () => {
            playerState.repeatMode = (playerState.repeatMode + 1) % 3;

            elements.repeatAllSvg.style.display = 'none';
            elements.repeatOneSvg.style.display = 'none';
            elements.repeatBtn.classList.remove('active');

            if (playerState.repeatMode === 1) {
                elements.repeatBtn.classList.add('active');
                elements.repeatBtn.title = 'Repetir Playlist (ativo)';
                elements.repeatAllSvg.style.display = 'block';
            } else if (playerState.repeatMode === 2) {
                elements.repeatBtn.classList.add('active');
                elements.repeatBtn.title = 'Repetir Música Atual (ativo)';
                elements.repeatOneSvg.style.display = 'block';
            } else {
                elements.repeatBtn.title = 'Repetir Playlist (desativado)';
                elements.repeatAllSvg.style.display = 'block';
            }
            console.log(`Modo de repetição: ${playerState.repeatMode}`);
        });

        elements.shuffleBtn.addEventListener('click', () => {
            playerState.isShuffling = !playerState.isShuffling;
            elements.shuffleBtn.classList.toggle('active', playerState.isShuffling);

            if (playerState.isShuffling) {
                playerState.playlist = [...playerState.originalPlaylist];
                shuffleArray(playerState.playlist);
            } else {
                playerState.playlist = [...playerState.originalPlaylist];
                const currentSongUrl = elements.audio.src;
                const newIndex = playerState.playlist.findIndex(song => song.url === currentSongUrl);
                if (newIndex !== -1) {
                    playerState.currentIndex = newIndex;
                } else {
                    playerState.currentIndex = 0;
                }
            }
            console.log(`Shuffle: ${playerState.isShuffling}`);
        });
    }

    // NOVO: Função para iniciar o nível secreto
    function startSecretLevel() {
        console.log("startSecretLevel: Iniciando o Nível Secreto.");
        elements.completionScreen.classList.remove('show', 'shake-animation');
        elements.completionScreen.addEventListener('transitionend', function handler() {

            elements.powerUpsContainer.style.display = 'flex';

            quizState.currentLevel = quizState.totalMainLevels; // Define o nível atual para o índice do nível secreto (que é o último da array questionsByLevel)
            quizState.isSecretLevelActive = true;
            quizState.errorsInCurrentLevel = 0; // Reseta erros para o nível secreto
            quizState.consecutiveCorrectAnswers = 0; // Reseta combo para o nível secreto

            loadLevel(true); // Carrega o nível secreto
        }, { once: true });
    }

    function loadLevel(isStartOfQuiz = false) {
        console.log(`loadLevel: Carregando Nível ${quizState.currentLevel + 1}, isStartOfQuiz: ${isStartOfQuiz}, Secret Level Active: ${quizState.isSecretLevelActive}`);
        
        const oldCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
        if (oldCuriositySidebar) {
            oldCuriositySidebar.classList.remove('show');
            oldCuriositySidebar.addEventListener('transitionend', function handler() {
                oldCuriositySidebar.innerHTML = '';
                oldCuriositySidebar.removeEventListener('transitionend', handler);
            }, { once: true });
        }

        // Lógica para quando o jogador completa os N níveis principais (antes do nível secreto)
        if (!quizState.isSecretLevelActive && quizState.currentLevel === quizState.totalMainLevels) {
            console.log("loadLevel: Todos os níveis principais completados. Desbloqueando conquista 'Mestre da Vibe' e exibindo tela de conclusão.");
            unlockAchievement("all_main_levels_completed");
            showCompletionScreen();
            return;
        }

        // Lógica para quando o jogador completa o Nível Secreto (se ele estiver ativo)
        if (quizState.isSecretLevelActive && quizState.currentQuestionIndexInLevel >= questionsByLevel[quizState.currentLevel].perguntas.length) {
            console.log("loadLevel: Nível Secreto completado. Finalizando jogo (vitória final).");
            unlockAchievement("secret_level_completed"); // Conquista para o nível secreto
            endGame(true); // Finaliza o jogo como vencedor (após o nível secreto)
            return;
        }
        
        // Verifica se não há más níveis para carregar (caso tenha chegado ao fim do quiz completamente)
        if (quizState.currentLevel >= quizState.totalLevels) {
                console.log("loadLevel: Todos os níveis (incluindo secreto) completados. Finalizando jogo (vitória final).");
                endGame(true); // Se passou por todos os níveis e o secreto
                return;
        }

        // --- Lógica de Recuperação de Vida ---
        // Recupera vida: APENAS SE Nível > 0 (não é o primeiro nível) E ZEROU ERROS NO NÍVEL ANTERIOR E NÃO ESTÁ COM VIDAS NO MÁXIMO
        const hasRecoveredLife = (quizState.currentLevel > 0 && quizState.errorsInCurrentLevel === 0 && quizState.lives < MAX_LIVES);
        if (hasRecoveredLife) {
            quizState.lives = Math.min(MAX_LIVES, quizState.lives + LIVES_RECOVER_PER_LEVEL);
            updateLivesDisplay();
            console.log(`loadLevel: Vidas recuperadas por ter acertado tudo no nível anterior! Novas vidas: ${quizState.lives}`);
        }

        const errorsInPreviousLevel = quizState.errorsInCurrentLevel; // Guarda para a mensagem de Level Up
        quizState.errorsInCurrentLevel = 0; // Resetar erros para o novo nível
        quizState.scoreAtLevelStart = quizState.score; // Salva a pontuação atual ao iniciar um novo nível
        // O combo NÃO é resetado ao mudar de nível, apenas ao errar ou reiniciar o quiz.

        quizState.currentQuestionIndexInLevel = 0; // Reinicia o índice da pergunta para o novo nível
        quizState.currentLevelQuestions = [...questionsByLevel[quizState.currentLevel].perguntas];
        shuffleArray(quizState.currentLevelQuestions);

        // Chamada original para mostrar a mensagem de level-up
        if (!isStartOfQuiz && quizState.currentLevel > 0 && !quizState.isSecretLevelActive) {
            console.log("loadLevel: Avançou para um novo nível. Mostrando mensagem de level-up.");
            showLevelUpMessage(errorsInPreviousLevel, hasRecoveredLife);
        } else if (isStartOfQuiz || quizState.isSecretLevelActive) {
            console.log("loadLevel: Carregando primeira pergunta do nível atual (início do quiz ou nível secreto).");
            showQuestion();
            updateQuizInfo();
        }
    }

    // Função original de showLevelUpMessage, reativada para sua funcionalidade inicial
    function showLevelUpMessage(errorsInPreviousLevel = 0, hasRecoveredLife = false) {
        console.log(`showLevelUpMessage: Exibindo mensagem de avanço de nível. Erros no nível anterior: ${errorsInPreviousLevel}. Recuperou vida: ${hasRecoveredLife}`);
        quizState.quizPaused = true; // Pausa o quiz
        quizState.isProcessingAnswer = true; // Bloqueia interações durante a mensagem
        elements.quiz.style.pointerEvents = 'none'; // Desabilita cliques no quiz
        showMainOverlay(); // Mostra overlay principal

        clearInterval(timerInterval); // Para qualquer timer de pergunta
        // >>> CORREÇÃO AQUI: Garante que o player principal está visível ao mostrar a mensagem de level-up <<<
        elements.audioPlayerWrapper.classList.remove('hidden-player');

        const currentLevelFraseChorao = questionsByLevel[quizState.currentLevel].fraseChorao;

        let livesFeedbackMessage = '';
        // Feedback de Vidas no Level Up: Lógica aprimorada
        if (quizState.currentLevel > 0) { // Aplicável apenas após o primeiro nível
            if (errorsInPreviousLevel === 0) { // Se o jogador não cometeu erros no nível anterior
                if (hasRecoveredLife) { // Se a lógica de recuperação foi ativada e adicionou vida
                    livesFeedbackMessage = `<p style="font-family: Arial, sans-serif; font-size: 0.9em; margin-top: 10px; color: var(--cor-verde-vibrante);">Perfeito! Você recuperou ${LIVES_RECOVER_PER_LEVEL} vida(s)! ❤️</p>`;
                } else { // Já estava com o máximo de vidas e não errou
                            livesFeedbackMessage = `
                                <p style="font-family: Arial, sans-serif; font-size: 0.9em; margin-top: 10px; color: var(--cor-verde-vibrante);">Vidas no máximo! Mandou bem demais! ❤️</p>`;
                }
            } else if (errorsInPreviousLevel === 1) {
                livesFeedbackMessage = `<p style="font-family: Arial, sans-serif; font-size: 0.9em; margin-top: 10px; color: var(--cor-amarelo-cbjr);">Errou 1 heim mané! Pra ser CBJR tem que ficar más esperto.</p>`;
            } else if (errorsInPreviousLevel > 1) {
                livesFeedbackMessage = `<p style="font-family: Arial, sans-serif; font-size: 0.9em; margin-top: 10px; color: var(--cor-amarelo-cbjr);">Você cometeu ${errorsInPreviousLevel} erros neste nível, mas avançou!</p>`;
            }
        }
        
        elements.levelUpMessage.innerHTML = `
            <div class="chorao-quote" style="margin-top: 0px; margin-bottom: 20px;">"${currentLevelFraseChorao}"</div>
            ${livesFeedbackMessage}
            <div class="message-buttons" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button id="continue-quiz-btn">Avançar</button>
            </div>
            `;

        elements.levelUpMessage.style.display = 'flex';
        elements.levelUpMessage.classList.add('show');

        // Adiciona listener para o botão "Avançar"
        document.getElementById('continue-quiz-btn').onclick = continueQuiz;
    }

    // A função continueQuiz() agora volta a carregar a pergunta diretamente
    function continueQuiz() {
        console.log("continueQuiz: Continuando o quiz após mensagem de level-up (frase do Chorão).");
        elements.levelUpMessage.classList.remove('show');
        elements.levelUpMessage.addEventListener('transitionend', function handler() {

    function updateQuizInfo() {
        elements.scoreText.textContent = `Pontos: ${quizState.score}`;
        let displayLevel = quizState.currentLevel + 1;
        let totalDisplayLevels = quizState.totalMainLevels; // Inicia com o total de níveis principais

        if (quizState.isSecretLevelActive) {
            displayLevel = "Secreto";
            totalDisplayLevels = quizState.totalMainLevels + 1; // Ajusta o total para incluir o secreto
            elements.levelText.textContent = `Nível: ${displayLevel}/${totalDisplayLevels}`;
        } else {
            elements.levelText.textContent = `Nível: ${displayLevel}/${totalDisplayLevels}`;
        }
        
        if (quizState.currentLevelQuestions.length > 0) {
            elements.progressText.textContent = `Pergunta: ${quizState.currentQuestionIndexInLevel + 1}/${quizState.currentLevelQuestions.length}`;
        } else {
            elements.progressText.textContent = `Pergunta: 0/0`;
        }
        elements.highScoreText.textContent = `Recorde: ${quizState.highScore}`;
        updateLivesDisplay(); // Chamar sempre para manter atualizado
        updatePowerUpCounts(); // Atualiza o display de power-ups
    }

    function updateLivesDisplay() {
        if (elements.livesCount) { // Verifica se o elemento existe
            elements.livesCount.textContent = quizState.lives;
            elements.livesCount.style.color = quizState.lives <= 1 ? 'var(--cor-vermelho-incorreto)' : 'var(--cor-vida)';
        }
    }
    
    function updatePowerUpCounts() {
        if (elements.fiftyFiftyCount) { // Verifica se o elemento existe
            elements.fiftyFiftyCount.textContent = quizState.fiftyFiftyCount;
            elements.fiftyFiftyBtn.disabled = quizState.fiftyFiftyCount === 0 || quizState.isProcessingAnswer || quizState.quizPaused;
        }
        if (elements.skipQuestionCount) { // Verifica se o elemento existe para o botão "Pular"
            elements.skipQuestionCount.textContent = quizState.skipQuestionCount;
            elements.skipQuestionBtn.disabled = quizState.skipQuestionCount === 0 || quizState.isProcessingAnswer || quizState.quizPaused;
        }
    }

    // Função para usar o 50/50
    function useFiftyFifty() {
        console.log("useFiftyFifty: Tentando usar 50/50.");
        // Só permite usar se não estiver processando uma resposta ou se já foi clicado.
        if (quizState.isProcessingAnswer || quizState.fiftyFiftyCount <= 0 || quizState.quizPaused) {
            console.log("Não é possível usar 50/50 agora. isProcessingAnswer:", quizState.isProcessingAnswer, "fiftyFiftyCount:", quizState.fiftyFiftyCount);
            return;
        }

        elements.fiftyFiftyBtn.disabled = true; // Desabilita o botão imediatamente

        unlockAchievement("used_50_50"); // Desbloqueia a conquista

        quizState.fiftyFiftyCount--; // Decrementa o contador
        updatePowerUpCounts(); // Atualiza o display

        const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
        const buttons = Array.from(elements.quiz.querySelectorAll('.answer-button'));
        const incorrectButtons = buttons.filter(btn => normalizeText(btn.dataset.answer) !== normalizeText(questionData.correta)); // Usar normalizeText

        shuffleArray(incorrectButtons);
        // Desabilita as duas primeiras respostas incorretas encontradas
        for (let i = 0; i < Math.min(2, incorrectButtons.length); i++) {
            incorrectButtons[i].disabled = true;
            incorrectButtons[i].style.opacity = '0.5';
            incorrectButtons[i].style.textDecoration = 'line-through';
        }
        console.log("useFiftyFifty: 50/50 aplicado. Duas respostas incorretas removidas.");
    }

    // NOVO: Função para pular pergunta
    function skipQuestion() {
        console.log("skipQuestion: Tentando usar Pular Pergunta.");
        if (quizState.isProcessingAnswer || quizState.skipQuestionCount <= 0 || quizState.quizPaused) {
            console.log("Não é possível pular pergunta agora. isProcessingAnswer:", quizState.isProcessingAnswer, "skipQuestionCount:", quizState.skipQuestionCount);
            return;
        }

        quizState.isProcessingAnswer = true; // Bloqueia interações enquanto a pergunta é pulada
        elements.quiz.style.pointerEvents = 'none'; // Desabilita o quiz

        unlockAchievement("used_skip"); // Desbloqueia a conquista

        quizState.skipQuestionCount--; // Decrementa o contador
        updatePowerUpCounts(); // Atualiza o display

        clearInterval(timerInterval); // Para o timer

        const currentQuestionTextElement = elements.quiz.querySelector('#current-question-text');
        if (currentQuestionTextElement) {
            currentQuestionTextElement.textContent = `Pergunta pulada!`;
            currentQuestionTextElement.style.color = 'gray';
        }

        const buttons = elements.quiz.querySelectorAll('.answer-button');
        buttons.forEach(button => button.disabled = true); // Desabilita botões

        setTimeout(() => {
            console.log("skipQuestion: Avançando para a próxima pergunta após pular.");
            quizState.currentQuestionIndexInLevel++; // Avança a pergunta
            showQuestion(); // Carrega a próxima pergunta, que resetará isProcessingAnswer
        }, 1000); // Curto delay para feedback visual
    }

    function showComboMessage(combo) {
        let message = '';
        let bonusPoints = 0;

        if (COMBO_BONUS.hasOwnProperty(combo)) {
            // Aqui o nome da conquista já é o nome do CD.
            message = `${achievements[`combo_${combo}x`].name} - ${combo} acertos seguidos!`;
            bonusPoints = COMBO_BONUS[combo];
            unlockAchievement(`combo_${combo}x`);
        } else if (combo > 10 && combo % 5 === 0) {
            message = `Incrível! ${combo}x acertos!`;
            bonusPoints = 10;
        }

        if (message) {
            quizState.comboPointsEarned += bonusPoints;
            quizState.score += bonusPoints;
            elements.scoreText.textContent = `Pontos: ${quizState.score}`;
            elements.comboMessage.textContent = `${message} (+${bonusPoints} pts)`;
            elements.comboMessage.classList.add('show');
            setTimeout(() => {
                elements.comboMessage.classList.remove('show');
            }, 1500);
        }

        if (combo > quizState.highestCombo) {
            quizState.highestCombo = combo;
        }
    }

    function showAchievementPopup(achievementName) {
        elements.achievementPopup.textContent = `Conquista: ${achievementName} Desbloqueada!`;
        elements.achievementPopup.classList.add('show');
        elements.achievementPopup.style.zIndex = Math.max(2500, elements.mainOverlay.style.zIndex + 1); // Garante que esteja acima da overlay

        elements.achievementPopup.addEventListener('animationend', function handler() {
            elements.achievementPopup.classList.remove('show');
            elements.achievementPopup.style.display = 'none';
            elements.achievementPopup.removeEventListener('animationend', handler);
        }, { once: true });
        elements.achievementPopup.style.display = 'block'; // Ativa o display para a animação começar
    }

    function unlockAchievement(achievementId) {
        if (achievements[achievementId] && !achievements[achievementId].unlocked) {
            achievements[achievementId].unlocked = true;
            quizState.unlockedAchievements[achievementId] = true;
            localStorage.setItem('cobjr_quiz_achievements', JSON.stringify(quizState.unlockedAchievements));
            showAchievementPopup(achievements[achievementId].name); // O nome da conquista já é o nome do CD
            console.log(`Conquista desbloqueada: ${achievements[achievementId].name}`);
        }
    }

    function loadAchievements() {
        const storedAchievements = localStorage.getItem('cobjr_quiz_achievements');
        if (storedAchievements) {
            const parsedAchievements = JSON.parse(storedAchievements);
            for (const id in achievements) {
                if (parsedAchievements.hasOwnProperty(id)) {
                    achievements[id].unlocked = parsedAchievements[id];
                    quizState.unlockedAchievements[id] = parsedAchievements[id];
                } else {
                    achievements[id].unlocked = false;
                    quizState.unlockedAchievements[id] = false;
                }
            }
        } else {
            for (const id in achievements) {
                achievements[id].unlocked = false;
                quizState.unlockedAchievements[id] = false;
            }
        }
    }

    // ALTERADO: showAchievementsScreen para adicionar listeners de clique aos cards dinamicamente
    function showAchievementsScreen() {
        console.log("showAchievementsScreen: Exibindo tela de conquistas.");
        // NOVO: Salva o local de onde a tela de conquistas foi aberta
        quizState.originScreen = 'intro'; // Define a origem padrão
        if (elements.quiz.style.display === 'flex') { // Se o quiz principal está visível
            quizState.originScreen = 'quiz';
        }

        quizState.quizPaused = true;
        elements.quiz.style.pointerEvents = 'none'; // Desabilita o quiz
        showMainOverlay(); // Mostra a overlay principal
        elements.levelUpMessage.style.display = 'none';
        elements.levelUpMessage.classList.remove('show');
        elements.welcomeScreen.style.display = 'none';
        elements.welcomeScreen.classList.remove('show');
        elements.rankingScreen.style.display = 'none';
        elements.rankingScreen.classList.remove('show');
        elements.completionScreen.style.display = 'none';
        elements.completionScreen.classList.remove('show', 'shake-animation');
        elements.bonusMusicScreen.style.display = 'none';
        elements.bonusMusicScreen.classList.remove('show');
        // NOVO: Esconde a tela de conquista do bônus
        elements.bonusAchievementScreen.style.display = 'none';
        elements.bonusAchievementScreen.classList.remove('show');
        
        // >>> CORREÇÃO AQUI: Garante que o player principal está visível ao entrar nesta tela <<<
        elements.audioPlayerWrapper.classList.remove('hidden-player');


        elements.achievementsScreen.style.display = 'flex';
        elements.achievementsScreen.classList.add('show');
        elements.achievementsList.innerHTML = '';

        // Crie um array temporário das conquistas para ordenar
        const sortedAchievementIds = Object.keys(achievements).sort((a, b) => {
            const cdA = achievementCdCovers[a];
            const cdB = achievementCdCovers[b];
            
            // Trata caso onde coverFile não existe ou cdNames não tem o mapeamento
            const nameA = cdNames[cdA] || achievements[a].name;
            const nameB = cdNames[cdB] || achievements[b].name;

            // Extrair o ano de lançamento para a ordenação
            const yearMatchA = nameA.match(/\((\d{4})\)/);
            const yearA = yearMatchA ? parseInt(yearMatchA[1]) : 9999;
            
            const yearMatchB = nameB.match(/\((\d{4})\)/);
            const yearB = yearMatchB ? parseInt(yearMatchB[1]) : 9999;

            // Se os anos são diferentes, ordene por ano
            if (yearA !== yearB) {
                return yearA - yearB;
            }
            // Se os anos são iguais, ordene alfabeticamente pelo nome da conquista
            return achievements[a].name.localeCompare(achievements[b].name);
        });

        sortedAchievementIds.forEach(id => {
            const achievement = achievements[id];
            const isUnlocked = achievement.unlocked;
            const card = document.createElement('div'); // AGORA É UM DIV
            card.classList.add('achievement-card');
            if (isUnlocked) {
                card.classList.add('unlocked');
            }
            card.dataset.achievementId = id; // Adiciona o data-id
            
            // NOVO: Adiciona o event listener via JS
            card.addEventListener('click', (event) => {
                event.stopPropagation(); // Evita que o clique se propague para a overlay
                showAchievementDetailPopup(id);
            });

            card.innerHTML = `
                <h3>
                    <span>${achievement.name}</span> <span class="achievement-icon">${isUnlocked ? '🏆' : '🔒'}</span>
                </h3>
                <p>${achievement.description}</p>
                <div class="status">${isUnlocked ? 'Desbloqueada' : 'Bloqueada'}</div>
            `;
            elements.achievementsList.appendChild(card);
        });

        // Re-atribuir listener para o botão "Voltar à Página Inicial"
        elements.closeAchievementsBtn.onclick = closeAchievementsScreen;
    }

    // RESTAURADO: showAchievementDetailPopup para controlar a exibição da capa
    function showAchievementDetailPopup(id) {
        const achievement = achievements[id];
        if (!achievement) return;

        // O nome da conquista já é o nome do CD, então usamos diretamente achievement.name
        elements.detailAchievementName.textContent = achievement.name;
        elements.detailAchievementDescription.textContent = achievement.description;
        
        // Lógica para exibir a capa do CD apenas se a conquista estiver desbloqueada
        const coverFileName = achievement.coverFile; // Pega o nome do arquivo da propriedade coverFile
        const coverUrl = `https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/${coverFileName}`;
        
        if (achievement.unlocked && coverFileName) { // AQUI: Verifica se está desbloqueada E se tem nome de arquivo de capa
            elements.detailAchievementCover.src = coverUrl;
            elements.detailAchievementCover.alt = `Capa do CD ${achievement.name}`; // Melhorar alt text
            elements.detailAchievementCdName.textContent = `CD: ${cdNames[coverFileName] || achievement.name}`; // Usa o nome da conquista como nome do CD
            elements.detailAchievementCdName.style.display = 'block';
            elements.detailAchievementCover.style.display = 'block';
        } else {
            elements.detailAchievementCover.style.display = 'none'; // Esconde a imagem
            elements.detailAchievementCover.src = ''; // Limpa a src para evitar quebras
            elements.detailAchievementCdName.textContent = 'Desbloqueie esta conquista para ver a capa!'; // Mensagem alternativa
            elements.detailAchievementCdName.style.display = 'block'; // Exibe a mensagem
        }

        elements.detailAchievementStatus.textContent = achievement.unlocked ? 'Desbloqueada' : 'Bloqueada';
        elements.detailAchievementStatus.classList.toggle('unlocked', achievement.unlocked);
        elements.detailAchievementStatus.classList.toggle('locked', !achievement.unlocked);

        // NOVO: Certifica-se que o pop-up esteja visível (display: flex) antes de adicionar a classe 'show' para transição
        elements.achievementDetailPopup.style.display = 'flex';
        elements.achievementDetailPopup.classList.add('show');
        showMainOverlay(); // Mostra a overlay principal
        quizState.quizPaused = true; // Pausa o quiz

        elements.closeAchievementDetailPopupBtn.onclick = closeAchievementDetailPopup;
    }

    function showQuestion() {
        console.log(`showQuestion: Exibindo Pergunta Nível ${quizState.currentLevel + 1}, Pergunta ${quizState.currentQuestionIndexInLevel + 1}. Vidas: ${quizState.lives}`);
        if (quizState.quizPaused) {
            console.log("showQuestion: Quiz pausado. Não avançando pergunta.");
            return;
        }

        const oldCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
        if (oldCuriositySidebar) {
            oldCuriositySidebar.classList.remove('show');
            oldCuriositySidebar.addEventListener('transitionend', function handler() {
                oldCuriositySidebar.innerHTML = '';
                oldCuriositySidebar.removeEventListener('transitionend', handler);
            }, { once: true });
        }

        // AQUI A VERIFICAÇÃO DE FIM DE NÍVEL DEVERIA ESTAR.
        // Se o currentQuestionIndexInLevel já está no final do array currentLevelQuestions,
        // significa que o nível atual já foi completado.
        // Essa lógica já existe em loadLevel(), então o showQuestion() não deveria ser chamado
        // se o nível já terminou.
        // Para garantir, vamos adicionar uma VERIFICAÇÃO AQUI, antes de renderizar a próxima pergunta,
        // que se certifique que ainda há perguntas no nível atual.
        if (quizState.currentQuestionIndexInLevel >= quizState.currentLevelQuestions.length) {
            console.log(`showQuestion: Todas as perguntas do Nível ${quizState.currentLevel + 1} foram respondidas.`);
            quizState.currentLevel++;
            loadLevel(); // Tenta carregar o próximo nível ou chama endGame
            return;
        }

        quizState.isProcessingAnswer = false;
        elements.quiz.style.pointerEvents = 'all'; // Reabilitar cliques no quiz container

        const questionElement = document.createElement('div');
        questionElement.classList.add('question');

        const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
        const shuffledAnswers = [...questionData.respostas];
        shuffleArray(shuffledAnswers);

        questionElement.innerHTML = `
            <h3 id="current-question-text">${questionData.pergunta}</h3>
            <div class="question-content">
                <div class="answers-container">
                    ${shuffledAnswers.map((resposta, index) => `
                        <button class="answer-button" data-answer="${resposta}" data-correct="${questionData.correta}">
                            <span class="keyboard-shortcut">${index + 1}</span>${resposta}
                        </button>
                    `).join('')}
                </div>
                <div class="curiosity-sidebar-box">
                </div>
            </div>
        `;

        const currentQuizContent = elements.quiz.querySelector('.question');
        if (currentQuizContent) {
            currentQuizContent.classList.add('fade-out');
            currentQuizContent.addEventListener('transitionend', function handler() {
                elements.quiz.innerHTML = '';
                elements.quiz.appendChild(questionElement);
                
                questionElement.querySelectorAll('.answer-button').forEach((button, i) => {
                    setTimeout(() => {
                        button.classList.add('show');
                    }, i * 100);
                });
                updateQuizInfo();
                startTimer();
                currentQuizContent.removeEventListener('transitionend', handler);
            }, { once: true });
        } else {
            elements.quiz.innerHTML = '';
            elements.quiz.appendChild(questionElement);
            questionElement.querySelectorAll('.answer-button').forEach((button, i) => {
                setTimeout(() => {
                    button.classList.add('show');
                }, i * 100);
            });
            updateQuizInfo();
            startTimer();
        }
    }

    function handleQuizClick(event) {
        // Ordem de prioridade: overlays > botões de power-up > botões de resposta
        
        // 1. Lidar com cliques em telas de overlay (conquistas, level-up/intro, completion-screen, ranking-screen, bonus-music-screen)
        if (elements.achievementsScreen.classList.contains('show')) {
            const clickedCard = event.target.closest('.achievement-card');
            const clickedCloseBtn = event.target.closest('#close-achievements-btn'); // Captura o clique no botão "Voltar"
            
            // Se clicou em um card de conquista, mostra o detalhe.
            if (clickedCard) {
                const achievementId = clickedCard.dataset.achievementId;
                showAchievementDetailPopup(achievementId);
            } 
            // Se clicou no botão "Voltar à Página Inicial", chama a função para fechar a tela.
            else if (clickedCloseBtn) {
                closeAchievementsScreen();
            }
            // Se clicou em qualquer outra parte da overlay (exceto os cards que já foram tratados), fecha a tela.
            // Removemos a verificação específica de `event.target === elements.achievementsScreen`
            // porque o `event.target.closest()` já cobre o clique dentro da tela,
            // e o `stopPropagation` abaixo garante que não afete elementos fora da overlay.
            // Para fechar ao clicar no background:
            else if (event.target === elements.mainOverlay) { 
                closeAchievementsScreen();
            }

            event.stopPropagation(); // Sempre parar a propagação se a tela de conquistas está aberta
            return;
        }
        if (elements.rankingScreen.classList.contains('show')) {
            // Os botões de fechar (closeRankingBtn) já têm listeners atribuídos com `.onclick`.
            if (event.target === elements.rankingScreen || event.target.tagName === 'H2') {
                closeRankingScreen();
            }
            event.stopPropagation();
            return;
        }
        // ALTERADO: Tecla 'Escape' para fechar o detail popup
        if (elements.achievementDetailPopup.classList.contains('show')) {
            // Botão de fechar já tem listener direto.
            if (event.target === elements.achievementDetailPopup || event.target.tagName === 'H3') {
                closeAchievementDetailPopup();
            }
            event.stopPropagation(); // Sempre parar a propagação se o detail popup está ativo
            return;
        }
        if (elements.completionScreen.classList.contains('show')) {
            // Botões já têm listeners diretos, então não precisam ser checados aqui.
            if (event.target === elements.completionScreen || event.target.tagName === 'H2') {
                    // Se clicou na própria overlay da tela de conclusão ou no H2, não faz nada ou fecha?
                // Por agora, não faremos nada, já que tem botões específicos para ação.
            }
            event.stopPropagation();
            return;
        }
        // ALTERADO: Ações específicas para botões na level-up-message (frase do Chorão)
        if (elements.levelUpMessage.classList.contains('show')) {
            // Os botões já têm listeners diretos adicionados em `showIntroMessage` ou `showLevelUpMessage`
            if (event.target === elements.levelUpMessage || event.target.tagName === 'H3') {
                    // Não faz nada ou fecha, se houver um botão de fechar implícito
            }
            event.stopPropagation(); // Sempre para a propagação
            return;
        }
        // NOVO: Lidar com cliques na tela de boas-vindas simplificada
        if (elements.welcomeScreen.classList.contains('show')) {
            // Os botões já têm listeners diretos.
            // Se o clique não foi em um botão dentro da welcomeScreen, e foi na overlay principal,
            // podemos considerar fechar a welcomeScreen, ou deixá-la como está para forçar interação com botões.
            // Por enquanto, os cliques nos botões são tratados individualmente pelos seus 'onclick'.
            // Clicar na própria overlay principal enquanto a welcomeScreen está ativa:
            if (event.target === elements.mainOverlay) {
                // Não faz nada por enquanto, para forçar o uso dos botões.
                // Se quiser que clique no overlay feche a welcome, chame hideMainOverlay() e showIntroMessage()
            }
            event.stopPropagation(); // Sempre parar a propagação se a welcome screen está aberta
            return;
        }
        // NOVO: Lidar com cliques na tela do Bônus Fã
        if (elements.bonusMusicScreen.classList.contains('show')) {
            // Os botões já têm listeners diretos adicionados em `showBonusMusicScreen` ou `endBonusMusicGame`
            if (event.target === elements.bonusMusicScreen || event.target.tagName === 'H2') {
                // Não faz nada
            }
            event.stopPropagation();
            return;
        }
        // NOVO: Lidar com cliques na tela de Conquista do Bônus
        if (elements.bonusAchievementScreen.classList.contains('show')) {
            // O botão de fechar já tem listener direto.
            if (event.target === elements.bonusAchievementScreen || event.target.tagName === 'H2') {
                // Não faz nada
            }
            event.stopPropagation();
            return;
        }

        // Se chegamos aqui, nenhuma tela de overlay está consumindo o clique.
        // Agora, verificar os power-ups.
        const clickedPowerUp = event.target.closest('.power-up-btn');
        if (clickedPowerUp) {
            // A lógica para usar o power-up já está nos listeners diretos dos botões.
            // Apenas garantir que o clique não "caia" nos botões de resposta.
            event.stopPropagation();
            return;
        }
        
        // 3. Lógica para cliques nos botões de resposta do quiz
        // Sólo permitir clics en los botones de respuesta si el quiz NO está pausado Y NO está procesando una respuesta.
        if (quizState.quizPaused || quizState.isProcessingAnswer) {
            event.stopPropagation();
            return;
        }

        const clickedButton = event.target.closest('.answer-button');
        if (clickedButton) {
            // Bloqueia o quiz após o clique na resposta para processamento
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none'; // Desabilita o quiz

            const answer = clickedButton.dataset.answer;
            const correta = clickedButton.dataset.correct;
            checkAnswer(clickedButton, answer, correta);
        }
    }

    // NOVO: Handler para teclas do teclado
    function handleKeyboardInput(event) {
        // Lógica similar a handleQuizClick para prioridade de eventos de teclado
        if (elements.achievementsScreen.classList.contains('show')) {
            if (event.key === 'Escape') { closeAchievementsScreen(); } // Chama a função diretamente
            return;
        }
        if (elements.rankingScreen.classList.contains('show')) {
            if (event.key === 'Escape' || event.key === 'Enter') { elements.closeRankingBtn.click(); }
            return;
        }
        // ALTERADO: Tecla 'Escape' para fechar o detail popup
        if (elements.achievementDetailPopup.classList.contains('show')) {
            if (event.key === 'Escape' || event.key === 'Enter') { elements.closeAchievementDetailPopupBtn.click(); }
            return;
        }
        if (elements.completionScreen.classList.contains('show')) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Evita rolagem da página com Enter
                const secretLevelBtn = elements.startSecretLevelBtn;
                if (secretLevelBtn && !secretLevelBtn.disabled) secretLevelBtn.click();
                else {
                    const restartBtn = elements.restartFromCompletionBtn; // Corrigido ID do botão
                    if (restartBtn && !restartBtn.disabled) restartBtn.click();
                }
            }
            return;
        }

        // ALTERADO: Teclas na tela de level-up-message E welcome-screen
        if (elements.levelUpMessage.classList.contains('show') || elements.welcomeScreen.classList.contains('show')) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Evita rolagem da página com Enter
                const activeElement = document.activeElement;
                
                // Prioriza o botón focado
                if (activeElement && activeElement.tagName === 'BUTTON' && !activeElement.disabled) {
                    activeElement.click();
                } else {
                    // Se nenhum botão específico focado, tenta clicar no primeiro botão disponível
                    // (Ex: "Entrar no Quiz" na welcome-screen, ou "Começar Quiz" / "Avançar" na level-up-message)
                    let firstButton;
                    if (elements.welcomeScreen.classList.contains('show')) {
                        firstButton = document.getElementById('start-quiz-button-welcome');
                    } else if (elements.levelUpMessage.classList.contains('show')) {
                        firstButton = document.getElementById('start-quiz-button-final') || document.getElementById('continue-quiz-btn');
                    }
                    if (firstButton && !firstButton.disabled) {
                        firstButton.click();
                    }
                }
            }
            return;
        }

        // NOVO: Atalhos de teclado para a tela de bônus musical
        if (elements.bonusMusicScreen.classList.contains('show')) {
            // Verifica qual botão está focado ou se o input está focado
            if (document.activeElement === elements.bonusAnswerInput) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Impede o envío de formulário padrão
                    elements.bonusSubmitBtn.click();
                }
            } else if (event.key === 'Enter') {
                // Se nenhum input focado, e enter é pressionado, tenta acionar o submit (se não desabilitado)
                if (elements.bonusSubmitBtn && !elements.bonusSubmitBtn.disabled) {
                    elements.bonusSubmitBtn.click();
                }
            } else if (event.key === 'Escape') {
                if (elements.bonusExitBtn && !elements.bonusExitBtn.disabled) {
                    elements.bonusExitBtn.click();
                }
            }
            return;
        }
        // NOVO: Atalho de teclado para a tela de conquista do bônus
        if (elements.bonusAchievementScreen.classList.contains('show')) {
            if (event.key === 'Enter' || event.key === 'Escape') {
                elements.bonusAchievementCloseBtn.click();
            }
            return;
        }

        if (!quizState.isProcessingAnswer) {
            if (event.key === 'F1') {
                event.preventDefault();
                elements.fiftyFiftyBtn.click();
                return;
            }
            if (event.key === 'F2') {
                event.preventDefault();
                elements.skipQuestionBtn.click();
                return;
            }
        }

        if (quizState.quizPaused || quizState.isProcessingAnswer) return;

        const numberKey = parseInt(event.key);
        if (!isNaN(numberKey) && numberKey >= 1 && numberKey <= 4) {
            const answerButtons = elements.quiz.querySelectorAll('.answer-button');
            if (answerButtons[numberKey - 1] && !answerButtons[numberKey - 1].disabled) {
                answerButtons[numberKey - 1].click();
            }
            return;
        }

        switch (event.key.toLowerCase()) {
            case ' ': event.preventDefault(); togglePlayPause(); break;
            case 'arrowleft': playPrevSong(); break;
            case 'arrowright': playNextSong(); break;
            case 'r': elements.repeatBtn.click(); break;
            case 'f': elements.shuffleBtn.click(); break;
            case 'arrowup':
                elements.audio.volume = Math.min(1, elements.audio.volume + 0.1);
                elements.volumeSlider.value = elements.audio.volume;
                elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;
                elements.audio.muted = false; elements.volumeSvg.style.display = 'block'; elements.muteSvg.style.display = 'none';
                break;
            case 'arrowdown':
                elements.audio.volume = Math.max(0, elements.audio.volume - 0.1);
                elements.volumeSlider.value = elements.audio.volume;
                elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;
                if (elements.audio.volume === 0) { elements.audio.muted = true; elements.volumeSvg.style.display = 'none'; elements.muteSvg.style.display = 'block'; }
                break;
            case 'm': elements.muteBtn.click(); break;
        }
    }

    function checkAnswer(clickedButton, answer, correta) {
        console.log("checkAnswer: Verificando resposta...");
        clearInterval(timerInterval);

        const timeTaken = (Date.now() - questionStartTime) / 1000;

        const buttons = elements.quiz.querySelectorAll('.answer-button');
        buttons.forEach(button => {
            button.disabled = true;
        });

        const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
        let pointsEarned = 0;

        if (normalizeText(answer) === normalizeText(correta)) { // Usa normalizeText
            console.log("checkAnswer: Resposta CORRETA!");
            clickedButton.classList.add('correct', 'glow-correct');
            clickedButton.innerHTML += ' <span class="feedback-icon">✅</span>';

            pointsEarned = BASE_SCORE_PER_CORRECT;
            if (timeTaken <= BONUS_MAX_THRESHOLD) {
                pointsEarned += BONUS_MAX;
            } else if (timeTaken <= BONUS_MEDIUM_THRESHOLD) {
                pointsEarned += BONUS_MEDIUM;
            } else if (timeTaken <= TIME_PER_QUESTION) {
                pointsEarned += BONUS_MIN;
            }

            quizState.score += pointsEarned;
            quizState.consecutiveCorrectAnswers++;
            
            showComboMessage(quizState.consecutiveCorrectAnswers);
            
            updateQuizInfo();
            showCuriosity(questionData.curiosidade); // Chama showCuriosity AQUI

            setTimeout(() => {
                console.log("checkAnswer: Preparando para a próxima pergunta após acerto.");
                quizState.isProcessingAnswer = false;
                clickedButton.classList.remove('glow-correct');
                
                const isLastQuestionOfCurrentLevel = (quizState.currentQuestionIndexInLevel + 1) === quizState.currentLevelQuestions.length;
                
                if (isLastQuestionOfCurrentLevel) {
                    if (quizState.isSecretLevelActive) {
                        console.log("checkAnswer: Última pergunta do Nível Secreto acertada. Chamando endGame (vitória final).");
                        unlockAchievement("secret_level_completed");
                        endGame(true);
                    } else if (quizState.currentLevel === quizState.totalMainLevels - 1) {
                            // Se for o último nível principal (o Nível 7) e esta é a última pergunta desse nível
                            console.log("checkAnswer: Última pergunta do último nível principal acertada. Exibindo tela de conclusão dos níveis principais.");
                            unlockAchievement("all_main_levels_completed");
                            showCompletionScreen();
                    } else {
                            // Desbloqueia a conquista de nível para os níveis 1, 3 e 5.
                            // Nota: Os IDs das conquistas precisam estar configurados para cada nível específico.
                            if (quizState.currentLevel === 0) unlockAchievement("first_level_completed");
                            if (quizState.currentLevel === 2) unlockAchievement("level_3_completed");
                            if (quizState.currentLevel === 4) unlockAchievement("level_5_completed");

                        quizState.currentLevel++;
                        loadLevel();
                    }
                } else {
                    quizState.currentQuestionIndexInLevel++;
                    showQuestion();
                }

            }, 4000);
        } else {
            console.log("checkAnswer: Resposta INCORRETA!");
            clickedButton.classList.add('incorrect', 'glow-incorrect');
            clickedButton.innerHTML += ' <span class="feedback-icon">❌</span>';

            const questionTextElement = document.getElementById('current-question-text');
            if (questionTextElement) {
                questionTextElement.classList.add('shake');
                questionTextElement.addEventListener('animationend', () => {
                    questionTextElement.classList.remove('shake');
                }, { once: true });
            }

            quizState.lives--;
            quizState.errorsInCurrentLevel++;
            quizState.consecutiveCorrectAnswers = 0;
            updateLivesDisplay();

            updateQuizInfo();
            
            const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
            
            let lostLifeMsg = `Você não respondeu a tempo e perdeu 1 vida! Vidas restantes: ${quizState.lives}.`; // Mensagem ajustada para erro de resposta
            showCuriosity(`${lostLifeMsg} ${questionData.curiosidade}`); // Chama showCuriosity AQUI

            const buttons = elements.quiz.querySelectorAll('.answer-button');
            buttons.forEach(button => {
                button.disabled = true;
            });

            setTimeout(() => {
                console.log(`handleTimerEnd: Vidas restantes: ${quizState.lives}.`);
                quizState.isProcessingAnswer = false;
                if (quizState.lives <= 0) {
                    console.log("handleTimerEnd: Vidas esgotadas. Chamando endGame (derrota).");
                    endGame(false);
                } else {
                    quizState.currentQuestionIndexInLevel++;
                    showQuestion();
                }
            }, 4000);
        }
    }

    async function saveScore(playerName, score) {
        // As referências do Firebase agora estão diretamente disponíveis no escopo do módulo
        if (!db || !collection || !addDoc) {
            console.error("Firebase Firestore SDK não está disponível ou foi importado incorretamente.");
            return;
        }
        try {
            const rankingRef = collection(db, "ranking"); // Usar 'collection' diretamente

            await addDoc(rankingRef, { // Usar 'addDoc' diretamente
                name: playerName,
                score: score,
                timestamp: Date.now()
            });
            console.log(`Pontuação de ${playerName} (${score}) salva com sucesso no Firebase!`);
        } catch (e) {
            console.error("Erro ao tentar salvar pontuação no Firebase: ", e);
            alert("Erro ao salvar pontuação no ranking. Verifique o console para más detalhes ou as regras do Firebase Firestore.");
        }
    }

    async function loadRanking() {
        // As referências do Firebase agora estão diretamente disponíveis no escopo do módulo
        if (!db || !collection || !query || !orderBy || !limit || !getDocs) {
            console.error("Firebase Firestore SDK não está disponível ou foi importado incorretamente.");
            return [];
        }
        const rankingList = [];
        try {
            const rankingRef = collection(db, "ranking"); // Usar 'collection' diretamente
            const q = query(rankingRef, orderBy("score", "desc"), limit(10)); // Usar 'query', 'orderBy', 'limit' diretamente
            
            const querySnapshot = await getDocs(q); // Usar 'getDocs' diretamente
            querySnapshot.forEach((doc) => {
                rankingList.push(doc.data());
            });
            console.log("Ranking carregado do Firebase:", rankingList);
            return rankingList;
        } catch (e) {
            console.error("Erro ao tentar carregar ranking do Firebase: ", e);
            alert("Erro ao carregar ranking. Verifique o console para más detalhes ou as regras do Firebase Firestore.");
            return [];
        }
    }

    }
