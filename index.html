        elements.rankingScreen.classList.remove('show');
        elements.rankingScreen.style.display = 'none';
        elements.completionScreen.classList.remove('show', 'shake-animation');
        elements.completionScreen.style.display = 'none';
        elements.bonusMusicScreen.classList.remove('show');
        elements.bonusMusicScreen.style.display = 'none';
        // NOVO: Esconde a tela de conquista do bônus
        elements.bonusAchievementScreen.classList.remove('show');
        elements.bonusAchievementScreen.style.display = 'none';
        
        // >>> ALTERAÇÃO AQUI: SEMPRE PAUSA E OCULTA O PLAYER PRINCIPAL AO ENTRAR NO BÔNUS <<<
        elements.audio.pause(); // Pausa a música que estava tocando
        elements.audio.currentTime = 0; // Reseta o tempo
        elements.audioPlayerWrapper.classList.add('hidden-player'); // Adiciona classe para ocultar

        showMainOverlay(); // Mostra a overlay principal
        
        elements.bonusMusicScreen.style.display = 'flex';
        elements.bonusMusicScreen.classList.add('show');
        
        // Atribuição de listeners para os botões do Bônus Fã
        // Esses listeners devem ser atribuídos aqui para os elementos que já existem no HTML
        // quando a tela de bônus é exibida PELA PRIMEIRA VEZ ou quando o conteúdo é recriado.
        elements.bonusSubmitBtn.onclick = checkBonusAnswer;
        elements.bonusSkipBtn.onclick = () => {
            bonusGameState.currentBonusSongIndex++;
            loadBonusSongForBonus(true);
        };
        elements.bonusExitBtn.onclick = hideBonusMusicScreen; // Listener para o botão 'Sair do Bônus' no modo jogo

        // Adiciona o listener para o "Enter" no input
        elements.bonusAnswerInput.onkeydown = (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); // Impede o envío de formulário padrão
                elements.bonusSubmitBtn.click();
            }
        };

        bonusGameState.isBonusActive = true;
        startBonusMusicGame(); // Inicia o jogo bônus
        elements.bonusAnswerInput.focus(); // Foca no input para digitar
    }

    function hideBonusMusicScreen() {
        console.log("hideBonusMusicScreen: Escondendo tela de Bônus Fã e restaurando quiz.");
        elements.bonusMusicScreen.classList.remove('show');
        elements.bonusMusicScreen.addEventListener('transitionend', function handler() {
            elements.bonusMusicScreen.style.display = 'none';
            elements.bonusMusicScreen.removeEventListener('transitionend', handler);
            hideMainOverlay(); // Esconde a overlay principal
            
            // Restaura o estado anterior do quiz (se existia)
            if (bonusGameState.lastQuizState) {
                // Restaurar o quizState, mas manter o unlockedAchievements atualizado
                const currentUnlockedAchievements = { ...quizState.unlockedAchievements };
                Object.assign(quizState, bonusGameState.lastQuizState);
                quizState.unlockedAchievements = currentUnlockedAchievements; // Mantém o estado más recente de conquistas
                
                quizState.quizPaused = false; // Garante que o quiz não está pausado
                elements.quiz.style.display = 'flex'; // Mostra o quiz principal
                elements.livesDisplay.style.display = 'flex';
                elements.powerUpsContainer.style.display = 'flex';
                updateQuizInfo(); // Atualiza infos do quiz principal
                // Se o quiz estava em uma pergunta, reativa o timer e listeners
                const currentQuestionElement = elements.quiz.querySelector('.question');
                if (currentQuestionElement) {
                    currentQuestionElement.style.pointerEvents = 'all';
                    startTimer(); // Reinicia o timer para a pergunta atual
                }
            } else {
                // Se não havia estado anterior (ex: abriu da intro), volta para a tela inicial
                showIntroMessage();
            }
            elements.quiz.style.pointerEvents = 'all'; // Reabilita interações no quiz principal
            bonusGameState.isBonusActive = false; // Garante que o flag do bônus está desligado
            // >>> ALTERAÇÃO AQUI: SEMPRE TENTA RETOMAR A MÚSICA PRINCIPAL AO SAIR DO BÔNUS <<<
            elements.audioPlayerWrapper.classList.remove('hidden-player');
            if (playerState.playlist.length > 0) {
                loadSong(); // Reload the current song (or previously loaded one)
                playSong(); // Attempt to resume playback
            }
            
        }, { once: true });
    }

    function startBonusMusicGame() {
        console.log("startBonusMusicGame: Iniciando novo jogo de Bônus Fã.");
        bonusGameState.songsToGuess = [...playerState.originalPlaylist]; // Usa a playlist original
        shuffleArray(bonusGameState.songsToGuess);
        bonusGameState.currentBonusSongIndex = 0;
        bonusGameState.bonusCorrectCount = 0;
        bonusGameState.bonusErrorsCount = 0;
        bonusGameState.startTime = Date.now(); // NOVO: Registra o tempo de início aqui!
        
        // Garante que o conteúdo da tela de bônus é resetado para o formulário de adivinhação
        elements.bonusMusicScreen.innerHTML = `
            <h2>Bônus Fã: Adivinhe a Música!</h2>
            <p class="bonus-instruction">Ouça o trecho e digite o nome da música do Charlie Brown Jr.</p>

            <div class="bonus-player-area">
                <p id="bonus-current-song-title" style="display: none;"></p>
                <input type="text" id="bonus-answer-input" placeholder="Qual é a música?">
                <p id="bonus-feedback-message"></p>
                <p id="bonus-curiosity-message" style="display: none;"></p>
            </div>

            <div class="bonus-score-display">
                <div class="score-item correct-count"><i class="fas fa-check-circle"></i> Acertos: <span id="bonus-correct-count-display">0</span></div>
                <div class="score-item error-count"><i class="fas fa-times-circle"></i> Erros: <span id="bonus-errors-count-display">0</span>/<span id="bonus-max-errors-display">5</span></div>
                <div class="score-item music-progress"><i class="fas fa-music"></i> Música: <span id="bonus-current-song-number">1</span>/<span id="bonus-total-songs">75</span></div>
            </div>
            
            <div class="bonus-controls">
                <button id="bonus-submit-btn"><i class="fas fa-paper-plane"></i> Enviar Resposta</button>
                <button id="bonus-skip-btn"><i class="fas fa-forward-step"></i> Pular Música</button>
                <button id="bonus-exit-btn" class="exit-button"><i class="fas fa-door-open"></i> Sair do Bônus</button>
            </div>
            `;
        // Re-obter referências aos elementos recém-criados
        elements.bonusAnswerInput = document.getElementById('bonus-answer-input');
        elements.bonusSubmitBtn = document.getElementById('bonus-submit-btn');
        elements.bonusSkipBtn = document.getElementById('bonus-skip-btn');
        elements.bonusExitBtn = document.getElementById('bonus-exit-btn');
        elements.bonusFeedbackMessage = document.getElementById('bonus-feedback-message');
        // Re-obter referências para os novos elementos de placar
        elements.bonusCorrectCountDisplay = document.getElementById('bonus-correct-count-display');
        elements.bonusErrorsCountDisplay = document.getElementById('bonus-errors-count-display');
        elements.bonusMaxErrorsDisplay = document.getElementById('bonus-max-errors-display');
        elements.bonusCurrentSongNumber = document.getElementById('bonus-current-song-number');
        elements.bonusTotalSongs = document.getElementById('bonus-total-songs');

        elements.bonusCurrentSongTitle = document.getElementById('bonus-current-song-title');
        elements.bonusCuriosityMessage = document.getElementById('bonus-curiosity-message'); // **NOVO: RE-OBTÉM A REFERÊNCIA**
        
        // Re-atribuir listeners para os botões da tela de input do bônus
        elements.bonusSubmitBtn.onclick = checkBonusAnswer;
        elements.bonusSkipBtn.onclick = () => {
            bonusGameState.currentBonusSongIndex++;
            loadBonusSongForBonus(true);
        };
        elements.bonusExitBtn.onclick = hideBonusMusicScreen;

        // Adiciona o listener para o "Enter" no input
        elements.bonusAnswerInput.onkeydown = (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); // Impede o envío de formulário padrão
                elements.bonusSubmitBtn.click();
            }
        };
        
        // ATUALIZAÇÃO AQUI para incluir o total de músicas
        updateBonusScoreInfo();        
        loadBonusSongForBonus();
        elements.bonusAnswerInput.focus(); // Foca no input para digitar
    }

    function loadBonusSongForBonus(skipped = false) {
        // Remove quaisquer classes de feedback do input
        elements.bonusAnswerInput.classList.remove('correct-feedback', 'incorrect-feedback');
        elements.bonusFeedbackMessage.classList.remove('show'); // Esconde feedback anterior
        elements.bonusCuriosityMessage.style.opacity = '0'; // Garante que começa transparente
        elements.bonusCuriosityMessage.textContent = ''; // Limpa o conteúdo da curiosidade
        elements.bonusCuriosityMessage.style.display = 'none'; // **NOVO: Esconde a curiosidade ao carregar nova música**


        // Se todas as músicas já foram jogadas, encerra o bônus
        if (bonusGameState.currentBonusSongIndex >= bonusGameState.songsToGuess.length) {
            endBonusMusicGame(true); // Todas as músicas foram jogadas
            return;
        }

        elements.bonusAnswerInput.value = '';
        elements.bonusAnswerInput.disabled = false;
        elements.bonusSubmitBtn.disabled = false;
        elements.bonusSkipBtn.disabled = false;
        elements.bonusFeedbackMessage.textContent = skipped ? "Música pulada!" : "";
        elements.bonusFeedbackMessage.style.color = 'var(--cor-texto-claro)';
        elements.bonusCurrentSongTitle.style.display = 'none';

        bonusGameState.currentBonusSong = bonusGameState.songsToGuess[bonusGameState.currentBonusSongIndex];
        loadSong(bonusGameState.currentBonusSong); // Carrega a música no player principal
        elements.audio.currentTime = 0; // Começa do início
        playSong(); // Inicia a reprodução

        elements.bonusAnswerInput.focus();
        console.log(`Bônus Fã: Música carregada: ${bonusGameState.currentBonusSong.title}`);
    }

    function checkBonusAnswer() {
        const userAnswer = normalizeText(elements.bonusAnswerInput.value);
        const correctAnswer = normalizeText(bonusGameState.currentBonusSong.title);
        const musicCuriosity = bonusGameState.currentBonusSong.curiosidade; // Pega a curiosidade da música atual

        elements.bonusAnswerInput.disabled = true; // Desabilita input após enviar
        elements.bonusSubmitBtn.disabled = true;
        elements.bonusSkipBtn.disabled = true;
        elements.audio.pause(); // Pausa a música após a tentativa

        // Resetando a visibilidade da curiosidade antes do feedback
        elements.bonusCuriosityMessage.style.display = 'none';
        elements.bonusCuriosityMessage.textContent = '';
        elements.bonusCuriosityMessage.style.opacity = '0'; // Garante que começa transparente para a transição

        if (userAnswer === correctAnswer) {
            bonusGameState.bonusCorrectCount++;
            elements.bonusFeedbackMessage.textContent = "CORRETO! ✅";
            elements.bonusFeedbackMessage.style.color = 'var(--cor-verde-correto)';
            elements.bonusAnswerInput.classList.add('correct-feedback'); // Adiciona classe de feedback correto
            elements.bonusFeedbackMessage.classList.add('show'); // Mostra a mensagem de feedback
            
            // Exibe o título da música
            elements.bonusCurrentSongTitle.style.display = 'block';
            elements.bonusCurrentSongTitle.textContent = bonusGameState.currentBonusSong.title;

            // **AQUI: Exibir a curiosidade se a resposta estiver correta**
            if (musicCuriosity) {
                elements.bonusCuriosityMessage.innerHTML = `<strong>Você Sabia?</strong> ${musicCuriosity}`; // Adiciona o strong
                elements.bonusCuriosityMessage.style.display = 'block';
                elements.bonusCuriosityMessage.style.opacity = '1';
            }
            
            // Verifica a conquista do bônus musical: acerte TODAS
            if (bonusGameState.bonusCorrectCount === bonusGameState.songsToGuess.length) { // Condição para acertar todas
                // A conquista será desbloqueada em endBonusMusicGame(true)
            }
            console.log(`Bônus Fã: Acertou! Músicas corretas: ${bonusGameState.bonusCorrectCount}`);

        } else {
            bonusGameState.bonusErrorsCount++;
            elements.bonusFeedbackMessage.textContent = "INCORRETO! ❌";
            elements.bonusFeedbackMessage.style.color = 'var(--cor-vermelho-incorreto)';
            elements.bonusAnswerInput.classList.add('incorrect-feedback');
            elements.bonusFeedbackMessage.classList.add('show');
            elements.bonusCurrentSongTitle.style.display = 'block';
            elements.bonusCurrentSongTitle.textContent = `A música era: ${bonusGameState.currentBonusSong.title}`;
            
            // Exibe a curiosidade mesmo se errou, para aprendizado
            if (musicCuriosity) {
                elements.bonusCuriosityMessage.innerHTML = `<strong>Você Sabia?</strong> ${musicCuriosity}`; // Adiciona o strong
                elements.bonusCuriosityMessage.style.display = 'block';
                elements.bonusCuriosityMessage.style.opacity = '1';
            }
            console.log(`Bônus Fã: Errou! Erros: ${bonusGameState.bonusErrorsCount}`);
        }
        updateBonusScoreInfo();

        // AUMENTANDO O TEMPO DE EXIBIÇÃO DA MENSAGEM E CURIOSIDADE
        const displayDuration = 6000; // 6 segundos
        const fadeOutDuration = 500; // 0.5 segundos para o fade-out

        setTimeout(() => {
            elements.bonusFeedbackMessage.classList.remove('show');
            elements.bonusCuriosityMessage.style.opacity = '0'; // Inicia o fade out da curiosidade

            // Espera a transição de opacidade da curiosidade terminar para esconder o display e avançar
            elements.bonusCuriosityMessage.addEventListener('transitionend', function handler() {
                elements.bonusCuriosityMessage.style.display = 'none';
                elements.bonusCuriosityMessage.removeEventListener('transitionend', handler);
                
                if (bonusGameState.bonusErrorsCount >= bonusGameState.maxBonusErrors) {
                    endBonusMusicGame(false);
                } else {
                    bonusGameState.currentBonusSongIndex++;
                    loadBonusSongForBonus();
                }
            }, { once: true });

        }, displayDuration - fadeOutDuration); // Começa o fade-out antes do tempo total para ser suave
    }

    function updateBonusScoreInfo() {
        // Alterado para mostrar a progressão atual e o total de músicas
        const totalSongs = bonusGameState.songsToGuess.length;
        const currentSongNumber = bonusGameState.currentBonusSongIndex + 1; // +1 para ser 1-indexed

        elements.bonusCorrectCountDisplay.textContent = bonusGameState.bonusCorrectCount;
        elements.bonusErrorsCountDisplay.textContent = bonusGameState.bonusErrorsCount;
        elements.bonusMaxErrorsDisplay.textContent = bonusGameState.maxBonusErrors;
        elements.bonusCurrentSongNumber.textContent = currentSongNumber;
        elements.bonusTotalSongs.textContent = totalSongs;
        
        // Lógica para desabilitar o botão de pular se for a última música e não houver más músicas para pular
        if (bonusGameState.currentBonusSongIndex === totalSongs - 1) {
            elements.bonusSkipBtn.disabled = true;
        } else {
            elements.bonusSkipBtn.disabled = false;
        }
    }

    function endBonusMusicGame(completedAllSongs) {
        console.log("endBonusMusicGame: Finalizando jogo de Bônus Fã.");
        elements.audio.pause();
        
        bonusGameState.endTime = Date.now(); // NOVO: Registra o tempo de fim
        const durationMs = bonusGameState.endTime - bonusGameState.startTime;
        const durationSeconds = Math.floor(durationMs / 1000); // Converte para segundos

        // Formatar a duração para exibir (ex: 2:35 para 2 minutos e 35 segundos)
        const minutes = Math.floor(durationSeconds / 60);
        const seconds = durationSeconds % 60;
        const formattedDuration = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        
        // SE o jogador acertou TODAS as músicas, mostra a tela de conquista especial
        if (bonusGameState.bonusCorrectCount === bonusGameState.songsToGuess.length && bonusGameState.songsToGuess.length > 0) {
            unlockAchievement("bonus_music_master"); // Desbloqueia a conquista antes de exibir a tela
            showBonusAchievementScreen(formattedDuration, bonusGameState.songsToGuess.length);
            return; // Sai da função para não mostrar a tela genérica de fim de jogo
        }

        // Continuação da lógica para o fim de jogo do bônus (se não completou todas)
        let message = '';
        let title = '';
        let textColor = 'var(--cor-texto-claro)';

        if (bonusGameState.bonusCorrectCount > 0) {
            title = "Mandou Bem no Som!";
            message = `Você acertou ${bonusGameState.bonusCorrectCount} música(s)! Continue treinando o ouvido!`;
            textColor = 'var(--cor-amarelo-cbjr)';
        } else {
            title = "Tente Novamente!";
            message = `Você não acertou nenhuma música desta vez. Mas a próxima rodada pode ser a sua!`;
            textColor = 'var(--cor-vermelho-incorreto)';
        }

        elements.bonusMusicScreen.innerHTML = `
            <h2>${title}</h2>
            <p style="font-family: Arial, sans-serif;">${message}</p>
            <p style="font-family: Arial, sans-serif; font-weight: bold; margin-bottom: 20px;">Seus resultados:</p>
            <p style="font-family: Arial, sans-serif;">Acertos: <span style="color: var(--cor-verde-correto);">${bonusGameState.bonusCorrectCount}</span></p>
            <p style="font-family: Arial, sans-serif;">Erros: <span style="color: var(--cor-vermelho-incorreto);">${bonusGameState.bonusErrorsCount}</span></p>
            <p style="font-family: Arial, sans-serif;">Tempo Total: <span style="color: var(--cor-bonus-texto);">${formattedDuration}</span></p> <div class="bonus-controls" style="margin-top: 30px;">
                <button id="bonus-play-again-btn">Jogar Novamente</button>
                <button id="bonus-exit-game-btn">Voltar ao Menu Principal</button>
            </div>
            `;
        elements.bonusMusicScreen.style.backgroundColor = `rgba(0, 0, 0, 0.9)`; // Fundo ligeiramente diferente para o resultado
        elements.bonusMusicScreen.style.color = textColor; // Define a cor principal do texto da mensagem final

        // Re-adiciona os listeners aos botões recém-criados
        document.getElementById('bonus-play-again-btn').onclick = startBonusMusicGame;
        document.getElementById('bonus-exit-game-btn').onclick = hideBonusMusicScreen;
    }

    // NOVO: Função para exibir a tela de conquista específica do bônus
    function showBonusAchievementScreen(timeTaken, totalSongs) {
        console.log("showBonusAchievementScreen: Exibindo tela de conquista do Bônus Fã.");
        quizState.quizPaused = true;
        elements.bonusMusicScreen.classList.remove('show');
        elements.bonusMusicScreen.style.display = 'none';
        showMainOverlay(); // Garante que a overlay principal está ativa

        const bonusAchievement = achievements["bonus_music_master"];
        const coverUrl = `https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/${bonusAchievement.coverFile}`;

        elements.bonusAchievementTitle.textContent = "CONQUISTA DESBLOQUEADA!";
        elements.bonusAchievementMessage.innerHTML = `
            <span style="font-family: 'Elektrix', sans-serif; font-size: 1.5em; color: var(--cor-verde-vibrante);">${bonusAchievement.name}</span><br><br>
            <span style="font-family: Arial, sans-serif; font-size: 1em; line-height: 1.4;">
                Parabéns! Você é um verdadeiro **Mestre da Rádio**! Acertou TODAS as ${totalSongs} músicas em <br> <b>${timeTaken}</b>!
                Sua conexão com o som do Charlie Brown Jr. é surreal!
            </span>
        `;
        elements.bonusAchievementCover.src = coverUrl;
        elements.bonusAchievementCover.alt = `Capa do CD ${bonusAchievement.name}`;
        elements.bonusAchievementCover.style.display = 'block'; // Exibe a imagem

        elements.bonusAchievementScreen.style.display = 'flex';
        elements.bonusAchievementScreen.classList.add('show');

        // Toca a música de conquista
        elements.audio.src = achievementMusicUrl;
        elements.audio.loop = true; // Loop infinito para a música de conquista
        elements.audio.volume = 0.5; // Um pouco más baixo
        elements.audio.play().catch(e => console.warn('Erro ao tocar música de conquista:', e));

        elements.bonusAchievementCloseBtn.onclick = () => {
            elements.audio.pause();
            elements.audio.loop = false;
            elements.bonusAchievementScreen.classList.remove('show');
            elements.bonusAchievementScreen.addEventListener('transitionend', function handler() {
                elements.bonusAchievementScreen.style.display = 'none';
                elements.bonusAchievementScreen.removeEventListener('transitionend', handler);
                hideMainOverlay();
                showIntroMessage(); // Volta para a tela de introdução
            }, { once: true });
        };
    }

    // --- Inicialização ao Carregar a Página ---
    window.onload = () => {
        console.log("window.onload: Página carregada. Iniciando setup.");
        loadAchievements();
        quizState.highScore = parseInt(localStorage.getItem('cobjr_quiz_highscore') || '0');
        elements.highScoreText.textContent = `Recorde: ${quizState.highScore}`;

        quizState.totalMainLevels = questionsByLevel.length - 1;

        preloadImages(backgroundImages, () => {
            document.body.style.backgroundImage = `url("${backgroundImages[0]}")`;
            changeBackgroundImageInterval();
        });

        // Adiciona um listener global para cliques no body (delegação de eventos)
        document.body.addEventListener('click', handleQuizClick);
        
        // Adiciona listeners para os botões de power-up (já estão no HTML, só ligar)
        elements.fiftyFiftyBtn.addEventListener('click', useFiftyFifty);
        elements.skipQuestionBtn.addEventListener('click', skipQuestion);
        
        // Adiciona listener global para eventos de teclado
        document.addEventListener('keydown', handleKeyboardInput);
        
        // Configura os listeners do player de áudio
        setupPlayerEventListeners();

        // Referência para o wrapper do player de áudio (IMPORTANTE: agora obtido no onload)
        elements.audioPlayerWrapper = document.getElementById('audio-player-wrapper');

        // Configura o estado inicial do volume do player de áudio
        elements.audio.volume = playerState.previousVolume;
        elements.volumeSlider.value = playerState.previousVolume;
        elements.volumeValueSpan.textContent = `${Math.round(elements.audio.volume * 100)}%`;

        if (elements.audio.volume === 0 || elements.audio.muted) {
            elements.volumeSvg.style.display = 'none';
            elements.muteSvg.style.display = 'block';
            elements.audio.muted = true;
        } else {
            elements.volumeSvg.style.display = 'block';
            elements.muteSvg.style.display = 'none';
            elements.audio.muted = false;
        }

        // Carrega a playlist de músicas
        fetch('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/playlist.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                playerState.playlist = data;
                playerState.originalPlaylist = [...data];
                if (playerState.playlist.length > 0) {
                    playerState.currentIndex = Math.floor(Math.random() * playerState.playlist.length);
                    loadSong();
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
                } else {
                    console.warn('Playlist está vazia! Verifique o arquivo playlist.json.');
                    elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
                    elements.playPauseBtn.disabled = true;
                    elements.prevBtn.disabled = true;
                    elements.nextBtn.disabled = true;
                    elements.repeatBtn.disabled = true;
                    elements.shuffleBtn.disabled = true;
                    elements.muteBtn.disabled = true;
                    elements.volumeSlider.disabled = true;
                }
                // ATRIBUIÇÃO DOS LISTENERS DOS BOTÕES DA WELCOME-SCREEN AQUI!
                // Eles já estão no HTML, então só pegamos a referência e atribuímos o evento.
                elements.startQuizButtonWelcome.onclick = showQuizInstructions;
                elements.showAchievementsButton.onclick = showAchievementsScreen;
                elements.showRankingButtonIntro.onclick = showRankingScreen;
                elements.startBonusMusicBtn.onclick = showBonusMusicScreen;

                showIntroMessage(); // Mostra a tela de introdução após carregar a playlist
            })
            .catch(error => {
                console.error('Erro ao carregar playlist:', error);
                elements.currentSongText.textContent = `Erro ao carregar a playlist. Tente novamente más tarde.`;
                elements.playPauseBtn.disabled = true;
                elements.prevBtn.disabled = true;
                elements.nextBtn.disabled = true;
                elements.repeatBtn.disabled = true;
                elements.shuffleBtn.disabled = true;
                elements.muteBtn.disabled = true;
                elements.volumeSlider.disabled = true;
                showIntroMessage(); // Ainda mostra a intro mesmo com erro na playlist
            });

        // Adiciona listeners para botões que não são do quiz principal e que não estão na intro
        elements.restartBtn.onclick = restartQuiz; // Botão "Reiniciar Quiz"
        elements.closeAchievementDetailPopupBtn.onclick = closeAchievementDetailPopup; // Botão "Fechar" do detalhe da conquista
    };
</script>
</body>
</html>
