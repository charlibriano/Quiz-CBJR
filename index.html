<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Charlie Brown Jr</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1JCN94Y3P0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1JCN94Y3P0');
    </script>
    <style>
        /* Variáveis CSS para facilitar a manutenção */
        :root {
            --cor-amarelo-cbjr: #f1c40f;
            --cor-preto-principal: #343434;
            --cor-verde-correto: #2ecc71;
            --cor-vermelho-incorreto: #e74c3c;
            --cor-fundo-transparente: rgba(0, 0, 0, 0.4);
            --cor-texto-claro: white;
            --cor-texto-escuro: black;

            --cor-fundo-audio-player-com-cor: rgba(0, 0, 0, 0.3);
            --cor-verde-vibrante: #1ed760; /* Usado no Spotify, mais vibrante */
        }

        @font-face {
            font-family: 'Elektrix';
            src: url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/Elektrix-Bold.woff2') format('woff2'),
                url('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/Elektrix-Bold.woff') format('woff'),
                url('https://cdn.jsdelivr.net/gh/charlibriano/Quiz-CBJR/Elektrix%20Bold.ttf') format('truetype');
            font-weight: bold;
            font-display: swap;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 3px 3px 15px var(--cor-preto-principal);
            }
            50% {
                transform: scale(1.08);
                text-shadow: 3px 3px 25px var(--cor-amarelo-cbjr);
            }
            100% {
                transform: scale(1);
                text-shadow: 3px 3px 15px var(--cor-preto-principal);
            }
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--cor-preto-principal);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            background-attachment: scroll;
            color: var(--cor-texto-claro);
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-bottom: 180px; /* Ajustado para dar mais espaço ao player */
            transition: background-image 1s ease-in-out;
        }

        header h1 {
            font-family: 'Elektrix', sans-serif;
            font-size: 2.5em;
            color: var(--cor-amarelo-cbjr);
            text-shadow: 3px 3px 15px var(--cor-preto-principal);
            padding: 25px 40px;
            border-radius: 20px;
            display: inline-block;
            animation: pulse 2.5s infinite;
            line-height: 1.2;
            margin-top: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: var(--cor-fundo-transparente);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .quiz-info-bottom {
            display: flex;
            justify-content: center; /* Centraliza horizontalmente */
            flex-wrap: wrap; /* Permite que os itens quebrem linha */
            gap: 10px; /* Espaçamento entre os itens */
            font-size: 1.1em; /* Um pouco maior para destaque */
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-top: 20px; /* Ajustado para dar espaço entre o quiz e as info de baixo */
            padding-top: 10px; /* Padding interno */
            border-top: 1px solid rgba(255, 255, 255, 0.2); /* Linha divisória sutil */
            width: 100%; /* Ocupa a largura total */
        }
        .quiz-info-bottom p {
            margin: 0; /* Remove margens padrão dos parágrafos */
            padding: 0 5px; /* Pequeno padding para separar os textos */
        }
        @media (max-width: 480px) {
            .quiz-info-bottom {
                font-size: 0.9em;
                gap: 5px;
                margin-top: 15px;
            }
        }
        
        .question {
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            width: 100%;
        }

        .question.fade-out {
            opacity: 0;
        }

        .question h3 {
            font-size: 1.8em;
            font-family: 'Elektrix', sans-serif;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* NOVO: Container para respostas e curiosidade lado a lado */
        .question-content {
            display: flex; /* Ativa flexbox para colocar elementos lado a lado */
            flex-direction: column; /* Padrão para mobile: em coluna */
            gap: 20px; /* Espaçamento entre as respostas e a curiosidade */
            width: 100%;
            align-items: center; /* ALTERADO: Centraliza itens horizontalmente */
        }

        @media (min-width: 769px) { /* Em telas maiores, coloca lado a lado */
            .question-content {
                flex-direction: row;
                align-items: flex-start; /* Volta a alinhar ao topo para o layout lateral */
            }
        }

        /* Ajustes para o answers-container para nova estrutura */
        .answers-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-grow: 1; /* Permite que ocupe o espaço disponível */
            min-width: 50%; /* Garante que as respostas não encolham demais */
            width: auto; /* Deixa o flexbox controlar a largura */
        }

        .question button {
            padding: 15px 10px;
            font-size: 1.2em;
            border-radius: 10px;
            border: none;
            background-color: var(--cor-preto-principal);
            color: var(--cor-texto-claro);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            white-space: normal;
            word-wrap: break-word;
        }

        .question button:hover:not(:disabled) {
            transform: scale(1.05);
            background-color: rgba(255, 255, 255, 0.1); /* Um tom mais claro no hover */
        }

        .question button.correct {
            background-color: var(--cor-verde-correto);
        }

        .question button.incorrect {
            background-color: var(--cor-vermelho-incorreto);
        }
        .question button .feedback-icon { /* Estilo para o ícone de feedback */
            margin-left: 8px; /* Espaçamento do texto */
            color: white; 
            font-size: 1.2em;
        }

        /* Antiga curiosity-box - agora estará oculta, o conteúdo vai para curiosity-sidebar-box */
        .curiosity-box {
            display: none; 
        }

        /* NOVO: Estilo para a caixa de curiosidade ao lado */
        .curiosity-sidebar-box {
            background-color: rgba(0, 0, 0, 0.5); /* Um pouco mais escuro para contraste */
            color: var(--cor-texto-claro);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.5;
            text-align: center; /* ALTERADO: Centraliza o texto dentro da caixa por padrão (para mobile) */
            flex-basis: 35%;
            max-width: 40%;
            min-width: 250px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            align-self: center; /* ALTERADO: Centraliza a própria caixa de curiosidade no flex container (por padrão, mobile) */
            display: flex; /* Para o título da curiosidade dentro dela */
            flex-direction: column;
            justify-content: flex-start;
            
            /* Margens para espaçamento quando em coluna (mobile) */
            margin-top: 20px; 
            margin-bottom: 0; /* Não precisa de margin-bottom aqui se o pai já tem gap */
        }

        @media (min-width: 769px) {
            .curiosity-sidebar-box {
                margin-top: 0; /* Remove margem superior quando lado a lado */
                text-align: left; /* NOVO: Volta para texto à esquerda em desktop (layout em linha) */
                align-self: flex-start; /* Mantém alinhamento ao topo em desktop */
            }
        }

        .curiosity-sidebar-box.show {
            opacity: 1;
            pointer-events: all;
        }

        .curiosity-sidebar-box strong {
            color: var(--cor-amarelo-cbjr); /* Título da curiosidade ainda amarelo para destaque */
            font-family: 'Elektrix', sans-serif;
            font-size: 1.1em;
            display: block;
            margin-bottom: 8px; /* Mais espaço para o título */
        }


        #restart-btn, #start-btn {
            padding: 15px 30px;
            margin-top: 20px; /* Mantenha para espaçamento dentro do container */
            background-color: var(--cor-preto-principal);
            color: var(--cor-texto-claro);
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-size: 1.5em;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }

        #restart-btn:hover, #start-btn:hover {
            transform: scale(1.05);
            background-color: #4a4a4a; /* Um cinza um pouco mais claro no hover */
        }

        /* --- PLAYER ATUALIZADO E CORRIGIDO --- */
        #audio-player-wrapper {
            position: fixed;
            bottom: 20px; /* Elevado 20px do rodapé */
            left: 50%;
            transform: translateX(-50%);
            max-width: 500px;
            width: 95%;
            padding: 15px 20px;
            background: var(--cor-fundo-audio-player-com-cor);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.9);
            z-index: 999;
            display: flex;
            flex-direction: column; /* Organiza o conteúdo verticalmente */
            justify-content: center;
            align-items: center;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-left-radius: 15px; /* Contorno inferior */
            border-bottom-right-radius: 15px; /* Contorno inferior */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            min-height: 100px; /* Reduzida a altura mínima para caber melhor */
            flex-wrap: wrap;
        }

        .player-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        #current-song {
            color: var(--cor-verde-vibrante);
            font-size: 1em;
            font-weight: bold;
            text-shadow: none;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        #audio {
            display: none;
        }

        .progress-bar-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 3px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--cor-verde-vibrante);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .time-display {
            color: var(--cor-verde-vibrante);
            font-size: 0.85em;
            width: 100%;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
        }

        .audio-main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-top: 5px;
        }

        .audio-control-btn {
            background-color: transparent; /* Torna o fundo transparente para a maioria dos botões */
            border: none;
            border-radius: 0; /* Remove border-radius padrão. Será aplicado apenas ao large-button */
            
            display: flex; /* Mantém flexbox para centralização do SVG */
            align-items: center;
            justify-content: center;
            padding: 0;
            
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
            box-shadow: none;
            
            width: 35px; /* Diminuído para 35px */
            height: 35px; /* Diminuído para 35px */
            flex-shrink: 0;
        }

        /* Esconde o SVG não ativo dentro do botão de repeat e mute */
        /* Controlado via JS agora */
        #repeat-btn #repeat-all-svg { display: block; } /* Default */
        #repeat-btn #repeat-one-svg { display: none; } /* Default */
        #mute-btn #volume-svg { display: block; } /* Default */
        #mute-btn #mute-svg { display: none; } /* Default */


        .audio-control-btn svg {
            /* Estilo para os SVGs DENTRO dos botões */
            width: 100%; /* Faz o SVG preencher todo o espaço do botão transparente */
            height: 100%;
            fill: #b3b3b3;
            transition: fill 0.3s ease, transform 0.2s ease;
        }
        /* Cor padrão para os elementos internos dos SVGs complexos (repeat e shuffle) */
        /* Estes são os defaults baseados nos SVGs que você forneceu */
        #repeat-btn svg .repeat-outer-circle { fill: #344E5D; }
        #repeat-btn svg .repeat-arrow-1, #repeat-btn svg .repeat-arrow-2 { fill: white; }
        #repeat-btn #repeat-one-svg .repeat-one-circle { fill: #b3b3b3; }
        #repeat-btn #repeat-one-svg .repeat-one-number, #repeat-btn #repeat-one-svg .repeat-one-arrows { fill: white; }

        /* SHUFFLE: Cores quando INATIVO (o estado padrão) */
        #shuffle-btn svg .shuffle-main-circle { fill: #b3b3b3; }
        #shuffle-btn svg path:not(.shuffle-main-circle), #shuffle-btn svg polyline {
            stroke: #535353;
            fill: none;
        }


        .audio-control-btn:hover {
            background-color: transparent;
            transform: none;
        }

        .audio-control-btn:hover svg {
            fill: #ffffff;
            transform: scale(1.15);
        }
        #repeat-btn:not(.active):hover svg .repeat-outer-circle {
            fill: #ffffff;
        }
        #repeat-btn:not(.active):hover svg .repeat-arrow-1,
        #repeat-btn:not(.active):hover svg .repeat-arrow-2 {
            fill: black;
        }
        #shuffle-btn:not(.active):hover svg .shuffle-main-circle {
            fill: #ffffff;
        }
        #shuffle-btn:not(.active):hover svg path,
        #shuffle-btn:not(.active):hover svg polyline {
            stroke: black;
        }
        #repeat-btn:not(.active):hover #repeat-one-svg .repeat-one-circle { fill: #ffffff; }
        #repeat-btn:not(.active):hover #repeat-one-svg .repeat-one-number, #repeat-btn:not(.active):hover #repeat-one-svg .repeat-one-arrows { fill: black; }


        .audio-control-btn:active {
            transform: none;
        }
        .audio-control-btn:active svg {
            transform: scale(0.95);
        }

        .audio-control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .audio-control-btn:disabled svg {
            fill: #666666;
            transform: none;
        }

        /* Estilo EXCLUSIVO para o botão grande (Play/Pause) */
        .audio-control-btn.large-button {
            background-color: #ffffff;
            border-radius: 50%;
            
            width: 55px;
            height: 55px;
            
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .audio-control-btn.large-button svg {
            width: 50%;
            height: 50%;
            fill: var(--cor-preto-principal);
            transform: none;
        }

        .audio-control-btn.large-button:hover {
            transform: scale(1.05);
            background-color: #eeeeee;
        }
        .audio-control-btn.large-button:hover svg {
            fill: var(--cor-preto-principal);
            transform: none;
        }
        .audio-control-btn.large-button:active {
            transform: scale(0.97);
        }

        /* Cor verde para ícones ativos (repeat e shuffle) */
        #repeat-btn.active svg .repeat-outer-circle,
        #shuffle-btn.active svg .shuffle-main-circle {
            fill: var(--cor-verde-vibrante) !important;
        }
        #repeat-btn.active svg .repeat-arrow-1,
        #repeat-btn.active svg .repeat-arrow-2 {
            fill: white !important;
        }
        #shuffle-btn.active svg path, #shuffle-btn.active svg polyline {
            stroke: white !important;
            fill: none !important;
        }
        #repeat-btn.active #repeat-one-svg .repeat-one-circle { fill: var(--cor-verde-vibrante) !important; }
        #repeat-btn.active #repeat-one-svg .repeat-one-number, #repeat-btn.active #repeat-one-svg .repeat-one-arrows { fill: white !important; }

        /* Ícone de volume (normal ou mudo) sempre verde */
        #volume-svg path, #mute-svg path {
            fill: var(--cor-verde-vibrante) !important;
        }


        .audio-volume-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 80%;
            max-width: 350px;
            margin-top: 8px;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #535353;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--cor-verde-vibrante);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            margin-top: -6px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--cor-verde-vibrante);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #volume-slider:hover::-webkit-slider-thumb,
        #volume-slider:hover::-moz-range-thumb {
            background: var(--cor-verde-vibrante); /* Mantém verde no hover */
            transform: scale(1.1);
        }
        #volume-slider:active::-webkit-slider-thumb,
        #volume-slider:active::-moz-range-thumb {
            transform: scale(0.9);
        }

        #volume-value {
            color: var(--cor-verde-vibrante);
            font-size: 0.8em;
            width: 35px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Estilo para a mensagem de nível */
        #level-up-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--cor-preto-principal); 
            color: var(--cor-texto-claro);
            padding: 25px 40px;
            border-radius: 15px;
            font-family: 'Elektrix', sans-serif;
            font-size: 2em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: all;
        }
        #level-up-message.show {
            opacity: 1;
        }
        #level-up-message button {
            padding: 12px 25px;
            font-size: 1.2em;
            background-color: var(--cor-preto-principal); 
            color: var(--cor-texto-claro); 
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        #level-up-message button:hover {
            transform: scale(1.05);
            background-color: #4a4a4a; /* Um cinza um pouco mais claro no hover */
        }

        /* Estilo para cobrir o quiz e desabilitar cliques */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1500;
            display: none;
            pointer-events: all;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
                padding: 15px 20px;
            }

            .container {
                padding: 20px;
                margin: 0 10px 40px 10px;
            }

            .question h3 {
                font-size: 1.4em;
            }
            
            /* Mantém o grid 2x2 para telas menores, ajustando o tamanho da fonte dos botões */
            .question button {
                height: auto;
                padding: 12px 10px;
                font-size: 0.9em;
            }

            /* Ajustes responsiveis para o player */
            #audio-player-wrapper {
                /* Reduzir o padding vertical para compactar mais */
                padding: 8px 15px; /* Reduzido de 12px para 8px verticalmente */
                border-top-left-radius: 12px;
                border-top-right-radius: 12px;
                border-bottom-left-radius: 12px;
                border-bottom-right-radius: 12px;
                min-height: 75px; /* Reduzida a altura mínima para caber melhor */
                bottom: 15px; /* Elevado um pouco mais para mobile */
            }
            .player-content {
                /* Reduzir o gap para compactar mais os elementos internos */
                gap: 5px; /* Mantido em 5px */
            }
            #current-song {
                font-size: 0.9em;
            }
            .progress-container {
                height: 3px;
            }
            .time-display {
                font-size: 0.75em;
            }
            .audio-main-controls {
                gap: 15px;
            }
            .audio-control-btn {
                width: 35px;
                height: 35px;
            }
            .audio-control-btn svg {
                width: 100%;
                height: 100%;
            }
            .audio-control-btn.large-button {
                width: 50px;
                height: 50px;
            }
            .audio-control-btn.large-button svg {
                width: 50%;
                height: 50%;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5em;
                padding: 10px 15px;
            }

            .question button {
                font-size: 0.85em;
                padding: 10px 8px;
            }

            #start-btn, #restart-btn {
                font-size: 1.2em;
                padding: 10px 20px;
            }

            /* Ajustes responsiveis para o player */
            #audio-player-wrapper {
                /* Reduzir o padding vertical para compactar mais */
                padding: 6px 12px; /* Reduzido de 8px para 6px verticalmente */
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
                border-bottom-left-radius: 10px;
                border-bottom-right-radius: 10px;
                min-height: 65px; /* Reduzida a altura mínima para 65px */
                bottom: 10px; /* Elevado um pouco mais para mobile */
            }
            .player-content {
                /* Reduzir o gap para compactar mais os elementos internos */
                gap: 2px; /* Reduzido de 3px para 2px */
            }
            #current-song {
                font-size: 0.8em;
            }
            .progress-container {
                height: 3px;
            }
            .time-display {
                font-size: 0.7em;
            }
            .audio-main-controls {
                gap: 10px;
            }
            .audio-control-btn {
                width: 30px;
                height: 30px;
            }
            .audio-control-btn svg {
                width: 100%;
                height: 100%;
            }
            .audio-control-btn.large-button {
                width: 45px;
                height: 45px;
            }

            quiz: document.getElementById('quiz'),
            scoreText: document.getElementById('score-text'),
            progressText: document.getElementById('progress-text'),
            levelText: document.getElementById('level-text'),
            medalText: document.getElementById('medal'),
            restartBtn: document.getElementById('restart-btn'),
            startBtn: document.getElementById('start-btn'),
            audio: document.getElementById('audio'),
            currentSongText: document.getElementById('current-song'),
            levelUpMessage: document.getElementById('level-up-message'),
            mainOverlay: document.getElementById('overlay'),
            // A antiga curiosityBox agora é apenas um div temporário para manipulação, não será visível
            curiosityBox: document.createElement('div'), // Será o conteúdo antes de ser movido
            
            // Player Elements (mantidos)
            playPauseBtn: document.getElementById('play-pause-btn'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            progressBar: document.getElementById('progress-bar'),
            progressContainer: document.querySelector('.progress-container'),
            repeatBtn: document.getElementById('repeat-btn'),
            shuffleBtn: document.getElementById('shuffle-btn'),
            muteBtn: document.getElementById('mute-btn'),
            volumeSlider: document.getElementById('volume-slider'),
            volumeValueSpan: document.getElementById('volume-value'),
            currentTimeSpan: document.getElementById('current-time'),
            totalDurationSpan: document.getElementById('total-duration'),

            // SVG Elements for Repeat/Mute (mantidos)
            repeatAllSvg: document.getElementById('repeat-all-svg'),
            repeatOneSvg: document.getElementById('repeat-one-svg'),
            volumeSvg: document.getElementById('volume-svg'),
            muteSvg: document.getElementById('mute-svg')
        };

        // --- Estado do Quiz (Centralizado) ---
        const quizState = {
            currentLevel: 0,
            currentQuestionIndexInLevel: 0,
            score: 0,
            errorsInCurrentLevel: 0,
            quizPaused: false,
            isProcessingAnswer: false, // Impede cliques múltiplos enquanto a resposta está sendo processada
            currentLevelQuestions: [],
            totalQuestions: 0 // Será calculado na inicialização
        };

        // --- Estado do Player ---
        let playerState = {
            playlist: [],
            originalPlaylist: [],
            currentIndex: 0,
            isShuffling: false,
            repeatMode: 0, // 0 = off, 1 = repeat playlist, 2 = repeat one song
            previousVolume: 0.4 // Volume inicial agora é 40%
        };

        // --- Configurações e Funções Auxiliares ---
        const backgroundImages = [
            'https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/fundo-cbjr.jpg',
            'https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/fundo-cbjr2.jpg'
        ];
        let currentBackgroundIndex = 0;

        function preloadImages(urls, callback) {
            let loaded = 0;
            const images = [];
            urls.forEach((url, index) => {
                images[index] = new Image();
                images[index].src = url;
                images[index].onload = () => {
                    loaded++;
                    if (loaded === urls.length) {
                        callback();
                    }
                };
                images[index].onerror = () => {
                    console.warn(`Erro ao carregar imagem: ${url}. Verifique o caminho ou permissões.`);
                    loaded++;
                    if (loaded === urls.length) {
                        callback();
                    }
                };
            });
        }

        function changeBackgroundImageInterval() {
            setInterval(() => {
                currentBackgroundIndex = (currentBackgroundIndex + 1) % backgroundImages.length;
                document.body.style.backgroundImage = `url("${backgroundImages[currentBackgroundIndex]}")`;
            }, 10000);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Função auxiliar para formatar o tempo (segundos para MM:SS)
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // --- Funções do Player de Áudio ---
        function loadSong() {
            if (!playerState.playlist.length) {
                elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
                Object.values(elements).forEach(el => {
                    if (el && el.id && (el.id.includes('btn') || el.id.includes('slider'))) {
                        el.disabled = true;
                    }
                });
                return;
            }
            const song = playerState.playlist[playerState.currentIndex];
            elements.currentSongText.textContent = `${song.title}`;
            elements.audio.src = song.url;
            
            // Habilita os botões se houver playlist
            elements.playPauseBtn.disabled = false;
            elements.prevBtn.disabled = false;
            elements.nextBtn.disabled = false;
            elements.repeatBtn.disabled = false;
            elements.shuffleBtn.disabled = false;
            elements.muteBtn.disabled = false;
            elements.volumeSlider.disabled = false;

            // Garante que o volume inicial seja aplicado ao carregar a página
            elements.audio.volume = elements.volumeSlider.value;
            elements.volumeValueSpan.textContent = `${Math.round(elements.volumeSlider.value * 100)}%`;

            // Resetar o tempo e carregar a duração total
            elements.currentTimeSpan.textContent = '0:00';
            elements.totalDurationSpan.textContent = '0:00';    
            elements.audio.onloadedmetadata = () => {
                if (!isNaN(elements.audio.duration) && elements.audio.duration > 0) {
                    elements.totalDurationSpan.textContent = formatTime(elements.audio.duration);
                }
            };
            elements.audio.oncanplaythrough = () => {
                // Tenta tocar a música assim que estiver pronta, se não estiver pausada
                if (!elements.audio.paused) { // Se não estiver pausado (ou seja, deveria estar tocando)
                    playSong();
                } else {
                    // Se o áudio está pausado (ex: autoplay bloqueado, ou usuário pausou manualmente)
                    // Garante que o ícone de play esteja visível
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
                    elements.currentSongText.textContent = `${song.title}`;
                }
            };
            elements.audio.onerror = (e) => {
                console.error("Erro ao carregar áudio:", e);
                elements.currentSongText.textContent = `Erro ao carregar ${song.title}`;
                elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z');
            };
        }

        function playSong() {
            elements.audio.play()
                .then(() => {
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M6 18h4V6H6v12zm8 0h4V6h-4v12z'); // Ícone de pause
                })
                .catch(e => {
                    console.warn('Erro ao tentar tocar música:', e.name, e.message);
                    if (e.name === "NotAllowedError" && elements.audio.paused) {
                        elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
                        elements.currentSongText.textContent = `${playerState.playlist[playerState.currentIndex] ? playerState.playlist[playerState.currentIndex].title : 'N/A'} (Clique ▶️ para tocar)`;
                    } else {
                        console.error('Erro de reprodução inesperado:', e);
                        elements.currentSongText.textContent = `${playerState.playlist[playerState.currentIndex] ? playerState.playlist[playerState.currentIndex].title : 'Erro ao tocar'}`;
                        elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
                    }
                });
        }

        function pauseSong() {
            elements.audio.pause();
            elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
        }

        function togglePlayPause() {
            if (elements.audio.paused) {
                playSong();
            } else {
                pauseSong();
            }
        }

        function playNextSong() {
            if (playerState.playlist.length === 0) return;
            if (playerState.isShuffling) {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * playerState.playlist.length);
                } while (nextIndex === playerState.currentIndex && playerState.playlist.length > 1);
                playerState.currentIndex = nextIndex;
            } else {
                playerState.currentIndex = (playerState.currentIndex + 1) % playerState.playlist.length;
            }
            loadSong();
            playSong();
        }

        function playPrevSong() {
            if (playerState.playlist.length === 0) return;
            if (playerState.isShuffling) {
                let prevIndex;
                do {
                    prevIndex = Math.floor(Math.random() * playerState.playlist.length);
                } while (prevIndex === playerState.currentIndex && playerState.playlist.length > 1);
                playerState.currentIndex = prevIndex;
            } else {
                playerState.currentIndex = (playerState.currentIndex - 1 + playerState.playlist.length) % playerState.playlist.length;
            }
            loadSong();
            playSong();
        }

        function updateProgressBar() {
            const { duration, currentTime } = elements.audio;
            
            if (!isNaN(duration) && duration > 0) {
                const progressPercent = (currentTime / duration) * 100;
                elements.progressBar.style.width = `${progressPercent}%`;
                
                elements.currentTimeSpan.textContent = formatTime(currentTime);
                elements.totalDurationSpan.textContent = formatTime(duration);
            } else {
                elements.progressBar.style.width = '0%';
                elements.currentTimeSpan.textContent = '0:00';
                elements.totalDurationSpan.textContent = '0:00';
            }
        }

        function setProgressBar(e) {
            const width = elements.progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = elements.audio.duration;

            if (!isNaN(duration) && duration > 0) {
                elements.audio.currentTime = (clickX / width) * duration;
            }
        }

        function handleSongEnd() {
            if (playerState.playlist.length === 0) return;

            if (playerState.repeatMode === 2) { // Repeat one song
                playSong(); // Apenas reinicia a atual
            } else if (playerState.isShuffling) { // Shuffle (avançar para próxima aleatória)
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * playerState.playlist.length);
                } while (nextIndex === playerState.currentIndex && playerState.playlist.length > 1);
                playerState.currentIndex = nextIndex;
                loadSong();
                playSong();
            } else if (playerState.repeatMode === 1) { // Repeat playlist (linear, loop)
                playerState.currentIndex = (playerState.currentIndex + 1) % playerState.playlist.length;
                loadSong();
                playSong();
            } else { // No repeat, no shuffle (linear, para no final)
                playerState.currentIndex = (playerState.currentIndex + 1);
                if (playerState.currentIndex < playerState.playlist.length) {
                    loadSong();
                    playSong();
                } else {
                    elements.audio.pause();
                    elements.playPauseBtn.querySelector('svg path').setAttribute('d', 'M8 5v14l11-7z'); // Ícone de play
                    elements.currentSongText.textContent = 'Fim da playlist';
                    playerState.currentIndex = 0; // Reseta para o início da playlist
                    loadSong(); // Carrega a primeira música sem tocar
                }
            }
        }

        function setupPlayerEventListeners() {
            elements.playPauseBtn.addEventListener('click', togglePlayPause);
            elements.prevBtn.addEventListener('click', playPrevSong);
            elements.nextBtn.addEventListener('click', playNextSong);
            elements.audio.addEventListener('timeupdate', updateProgressBar);
            elements.progressContainer.addEventListener('click', setProgressBar);
            elements.audio.addEventListener('ended', handleSongEnd);

            elements.muteBtn.addEventListener('click', () => {
                if (elements.audio.muted) {
                    elements.audio.muted = false;
                    elements.volumeSvg.style.display = 'block';
                    elements.muteSvg.style.display = 'none';
                    elements.audio.volume = playerState.previousVolume;
                    elements.volumeSlider.value = playerState.previousVolume;
                    elements.volumeValueSpan.textContent = `${Math.round(playerState.previousVolume * 100)}%`;
                } else {
                    playerState.previousVolume = elements.audio.volume;
                    elements.audio.muted = true;
                    elements.volumeSvg.style.display = 'none';
                    elements.muteSvg.style.display = 'block';
                    elements.volumeSlider.value = 0;
                    elements.volumeValueSpan.textContent = '0%';
                }
            });

            elements.volumeSlider.addEventListener('input', () => {
                elements.audio.volume = elements.volumeSlider.value;
                elements.volumeValueSpan.textContent = `${Math.round(elements.volumeSlider.value * 100)}%`;

                if (elements.audio.volume === 0) {
                    elements.volumeSvg.style.display = 'none';
                    elements.muteSvg.style.display = 'block';
                    elements.audio.muted = true;
                } else {
                    elements.volumeSvg.style.display = 'block';
                    elements.muteSvg.style.display = 'none';
                    elements.audio.muted = false;
                    playerState.previousVolume = elements.audio.volume;
                }
            });

            elements.repeatBtn.addEventListener('click', () => {
                playerState.repeatMode = (playerState.repeatMode + 1) % 3;
                
                const repeatAllOuterCircle = elements.repeatAllSvg.querySelector('.repeat-outer-circle');
                const repeatAllArrow1 = elements.repeatAllSvg.querySelector('.repeat-arrow-1');
                const repeatAllArrow2 = elements.repeatAllSvg.querySelector('.repeat-arrow-2');

                const repeatOneCircle = elements.repeatOneSvg.querySelector('.repeat-one-circle');
                const repeatOneNumber = elements.repeatOneSvg.querySelector('.repeat-one-number');
                const repeatOneArrows = elements.repeatOneSvg.querySelector('.repeat-one-arrows');
                
                elements.repeatBtn.classList.remove('active'); // Remove antes de reavaliar
                elements.repeatAllSvg.style.display = 'none';
                elements.repeatOneSvg.style.display = 'none';

                if (playerState.repeatMode === 1) { // Repeat playlist
                    elements.repeatBtn.classList.add('active');
                    elements.repeatBtn.title = 'Repetir Playlist (ativo)';
                    elements.repeatAllSvg.style.display = 'block';
                    if(repeatAllOuterCircle) repeatAllOuterCircle.style.fill = 'var(--cor-verde-vibrante)';
                    if(repeatAllArrow1) repeatAllArrow1.style.fill = 'white';
                    if(repeatAllArrow2) repeatAllArrow2.style.fill = 'white';
                } else if (playerState.repeatMode === 2) { // Repeat one song
                    elements.repeatBtn.classList.add('active');
                    elements.repeatBtn.title = 'Repetir Música Atual (ativo)';
                    elements.repeatOneSvg.style.display = 'block';
                    if(repeatOneCircle) repeatOneCircle.style.fill = 'var(--cor-verde-vibrante)';
                    if(repeatOneNumber) repeatOneNumber.style.fill = 'white';
                    if(repeatOneArrows) repeatOneArrows.style.fill = 'white';
                } else { // Off
                    elements.repeatBtn.title = 'Repetir Playlist (desativado)';
                    elements.repeatAllSvg.style.display = 'block'; // Mostra o SVG de repeat all no estado inativo
                    if(repeatAllOuterCircle) repeatAllOuterCircle.style.fill = '#b3b3b3'; // Cor padrão inativa
                    if(repeatAllArrow1) repeatAllArrow1.style.fill = 'white';
                    if(repeatAllArrow2) repeatAllArrow2.style.fill = 'white';
                }
                console.log(`Modo de repetição: ${playerState.repeatMode}`);
            });

            elements.shuffleBtn.addEventListener('click', () => {
                playerState.isShuffling = !playerState.isShuffling;
                elements.shuffleBtn.classList.toggle('active', playerState.isShuffling);

                const shuffleSvg = elements.shuffleBtn.querySelector('svg');
                const shuffleOuterCircle = shuffleSvg.querySelector('.shuffle-main-circle');
                const shuffleLines = shuffleSvg.querySelectorAll('path:not(.shuffle-main-circle)');
                const shufflePolylines = shuffleSvg.querySelectorAll('polyline');

                if (playerState.isShuffling) {
                    elements.shuffleBtn.title = 'Ordem Aleatória (ativo)';
                    if (shuffleOuterCircle) shuffleOuterCircle.style.fill = 'var(--cor-verde-vibrante)';
                    shuffleLines.forEach(line => line.style.stroke = 'white');
                    shufflePolylines.forEach(line => line.style.stroke = 'white');
                    
                    playerState.playlist = [...playerState.originalPlaylist];
                    shuffleArray(playerState.playlist);
                } else {
                    elements.shuffleBtn.title = 'Ordem Aleatória (desativado)';
                    if (shuffleOuterCircle) shuffleOuterCircle.style.fill = '#b3b3b3';
                    shuffleLines.forEach(line => line.style.stroke = '#535353');
                    shufflePolylines.forEach(line => line.style.stroke = '#535353');

                    playerState.playlist = [...playerState.originalPlaylist];
                    const currentSongUrl = elements.audio.src;
                    const newIndex = playerState.playlist.findIndex(song => song.url === currentSongUrl);
                    if (newIndex !== -1) {
                        playerState.currentIndex = newIndex;
                    } else {
                        playerState.currentIndex = 0;
                    }
                }
                console.log(`Shuffle: ${playerState.isShuffling}`);
            });
        }

        // --- Funções do Quiz ---
        function startQuiz() {
            elements.startBtn.style.display = 'none';
            Object.assign(quizState, {
                currentLevel: 0,
                currentQuestionIndexInLevel: 0,
                score: 0,
                errorsInCurrentLevel: 0,
                quizPaused: false,
                isProcessingAnswer: false
            });
            elements.quiz.style.pointerEvents = 'all';

            // A antiga curiosityBox agora é apenas um div temporário, não precisa ser manipulada aqui
            // elements.curiosityBox.style.display = 'none'; 
            // elements.curiosityBox.classList.remove('show');

            if (playerState.playlist.length > 0) {
                if (!elements.audio.src || elements.audio.src === window.location.href || elements.currentSongText.textContent.includes('N/A') || elements.audio.readyState === 0) {
                    playerState.currentIndex = Math.floor(Math.random() * playerState.playlist.length);
                    loadSong();
                }
            } else {
                console.warn('Não foi possível iniciar a música: playlist vazia.');
                elements.currentSongText.textContent = `Não disponível (Erro na playlist)`;
            }
            loadLevel(true); // Adicione um parâmetro `isStartOfQuiz` para `loadLevel`
        }

        function loadLevel(isStartOfQuiz = false) {
            // A antiga curiosityBox agora é apenas um div temporário, não precisa ser manipulada aqui
            // elements.curiosityBox.style.display = 'none';
            // elements.curiosityBox.classList.remove('show');

            if (quizState.currentLevel >= questionsByLevel.length) {
                endGame(true); // Vencedor
                return;
            }

            quizState.errorsInCurrentLevel = 0;
            quizState.currentQuestionIndexInLevel = 0;
            // ATENÇÃO: Agora pegamos as perguntas de 'questionsByLevel[currentLevel].perguntas'
            quizState.currentLevelQuestions = [...questionsByLevel[quizState.currentLevel].perguntas];
            shuffleArray(quizState.currentLevelQuestions);
            
            if (!isStartOfQuiz && quizState.currentLevel > 0) {
                showLevelUpMessage();
            } else {
                showQuestion();
                updateQuizInfo();
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';
            }
        }

        // Função showLevelUpMessage (ALTERADA)
        function showLevelUpMessage() {
            quizState.quizPaused = true;
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';
            elements.mainOverlay.style.display = 'block';
            
            // Pega a frase do Chorão do nível recém-concluído (o nível anterior ao atual)
            const fraseChorao = questionsByLevel[quizState.currentLevel -1].fraseChorao;
            
            // ALTERADO: Adicionado a frase "No passo a passo eu chego lá!" e o nível dinâmico.
            elements.levelUpMessage.innerHTML = `
                <div>No passo a passo eu chego lá!</div>
                <div style="font-size: 0.7em; margin-top: 15px; font-family: Arial, sans-serif; opacity: 0.9;">Você avançou para o Nível ${quizState.currentLevel + 1}!</div>
                <div style="font-size: 0.7em; margin-top: 5px; font-family: Arial, sans-serif; opacity: 0.9;">"${fraseChorao}"</div>
                <button onclick="continueQuiz()">Próxima fase</button> `;
            // Background da mensagem de nível é o cinza principal
            elements.levelUpMessage.style.backgroundColor = 'var(--cor-preto-principal)'; 
            elements.levelUpMessage.style.display = 'flex';
            elements.levelUpMessage.classList.add('show');
        }

        function continueQuiz() {
            elements.levelUpMessage.classList.remove('show');
            setTimeout(() => {
                elements.levelUpMessage.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                quizState.quizPaused = false;
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';
                
                // Após o "Continuar", re-exibe a primeira pergunta do nível recém-carregado
                showQuestion();
                updateQuizInfo();
            }, 500); // tempo da transição de desaparecimento da mensagem
        }

        function updateQuizInfo() {
            elements.scoreText.textContent = `Acertos: ${quizState.score}`;
            elements.levelText.textContent = `Nível: ${quizState.currentLevel + 1}`;
            if (quizState.currentLevelQuestions.length > 0) {
                elements.progressText.textContent = `Pergunta: ${quizState.currentQuestionIndexInLevel + 1}/${quizState.currentLevelQuestions.length}`;
            } else {
                elements.progressText.textContent = `Pergunta: 0/0`;
            }
            // ADICIONA INFORMAÇÃO DE ERROS NO NÍVEL SE HOUVER
            if (quizState.errorsInCurrentLevel > 0) {
                elements.levelText.textContent += ` (Erros: ${quizState.errorsInCurrentLevel})`;
            }
        }

        // Função showQuestion (ALTERADA)
        function showQuestion() {
            if (quizState.quizPaused) return;

            // Limpa a curiosidade da caixa lateral se ela já existe na pergunta anterior
            const oldCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (oldCuriositySidebar) {
                oldCuriositySidebar.classList.remove('show');
                oldCuriositySidebar.innerHTML = ''; // Limpa o conteúdo
            }

            if (quizState.currentQuestionIndexInLevel >= quizState.currentLevelQuestions.length) {
                quizState.currentLevel++;
                loadLevel();
                return;
            }
            
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';

            const questionElement = document.createElement('div');
            questionElement.classList.add('question');
            
            const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];
            const shuffledAnswers = [...questionData.respostas];
            shuffleArray(shuffledAnswers);

            // NOVA ESTRUTURA PARA A PERGUNTA
            questionElement.innerHTML = `
                <h3>${questionData.pergunta}</h3>
                <div class="question-content">
                    <div class="answers-container">
                        ${shuffledAnswers.map(resposta => `
                            <button class="answer-button" data-answer="${resposta}" data-correct="${questionData.correta}">${resposta}</button>
                        `).join('')}
                    </div>
                    <div class="curiosity-sidebar-box">
                        </div>
                </div>
            `;

            const currentQuizContent = elements.quiz.querySelector('.question');
            if (currentQuizContent) {
                currentQuizContent.classList.add('fade-out');
                setTimeout(() => {
                    elements.quiz.innerHTML = '';
                    elements.quiz.appendChild(questionElement);
                    updateQuizInfo();
                    quizState.isProcessingAnswer = false;
                    elements.quiz.style.pointerEvents = 'all';
                }, 500);
            } else {
                elements.quiz.innerHTML = '';
                elements.quiz.appendChild(questionElement);
                updateQuizInfo();
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';
            }
        }

        function handleQuizClick(event) {
            if (quizState.quizPaused || quizState.isProcessingAnswer) {
                event.stopPropagation();
                return;
            }

            const clickedButton = event.target.closest('.answer-button');
            if (clickedButton) {
                const answer = clickedButton.dataset.answer;
                const correta = clickedButton.dataset.correct;
                checkAnswer(clickedButton, answer, correta);
            }
        }

        function checkAnswer(clickedButton, answer, correta) {
            if (quizState.quizPaused || quizState.isProcessingAnswer) return;

            quizState.isProcessingAnswer = true; // Bloqueia novos cliques
            elements.quiz.style.pointerEvents = 'none'; // Desabilita interação com o quiz

            const buttons = elements.quiz.querySelectorAll('.answer-button');
            buttons.forEach(button => {
                button.disabled = true; // Desabilita todos os botões para evitar múltiplos cliques
            });

            const questionData = quizState.currentLevelQuestions[quizState.currentQuestionIndexInLevel];

            if (answer === correta) {
                clickedButton.classList.add('correct');
                clickedButton.innerHTML += ' <span class="feedback-icon">✅</span>';
                quizState.score++;
                updateQuizInfo();
                showCuriosity(questionData.curiosidade, true);

                setTimeout(() => {
                    // Não remove a classe 'show' da curiosity-sidebar-box aqui
                    // Ela será limpa e escondida na próxima chamada de showQuestion()
                    quizState.currentQuestionIndexInLevel++;
                    showQuestion();
                }, 4000); // tempo para ler a curiosidade
            } else {
                clickedButton.classList.add('incorrect');
                clickedButton.innerHTML += ' <span class="feedback-icon">❌</span>';
                quizState.errorsInCurrentLevel++;
                updateQuizInfo();
                showCuriosity(questionData.curiosidade, false);

                if (quizState.errorsInCurrentLevel >= 2) {
                    setTimeout(() => {
                        // Não remove a classe 'show' da curiosity-sidebar-box aqui
                        // Ela será limpa e escondida na próxima chamada de showQuestion()
                        endGame(false, true); // Chama endGame indicando que falhou o nível
                    }, 4000); // tempo para ler a curiosidade
                } else {
                    setTimeout(() => {
                        // Não remove a classe 'show' da curiosity-sidebar-box aqui
                        // Ela será limpa e escondida na próxima chamada de showQuestion()
                        quizState.currentQuestionIndexInLevel++;
                        showQuestion();
                    }, 4000); // tempo para ler a curiosidade
                }
            }
        }

        // Função showCuriosity (ALTERADA)
        function showCuriosity(curiosity, isCorrect) {
            // Agora a curiosidade é inserida na nova caixa lateral dentro da pergunta
            const curiositySidebarBox = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (curiositySidebarBox) {
                curiositySidebarBox.innerHTML = `<strong>Curiosidade:</strong> ${curiosity}`;
                curiositySidebarBox.classList.add('show');
            } else {
                console.warn("Elemento .curiosity-sidebar-box não encontrado para exibir a curiosidade.");
                // Fallback para o comportamento antigo (apenas para debug, não deve acontecer)
                elements.curiosityBox.innerHTML = `<strong>Curiosidade:</strong> ${curiosity}`;
                elements.curiosityBox.style.display = 'block';
                setTimeout(() => {
                    elements.curiosityBox.classList.add('show');
                }, 10);
            }
        }

        function endGame(isWinner, failedLevel = false) {
            quizState.quizPaused = true;
            quizState.isProcessingAnswer = true;
            elements.quiz.style.pointerEvents = 'none';
            elements.mainOverlay.style.display = 'block';

            elements.quiz.innerHTML = ''; // Limpa o conteúdo do quiz
            
            // Esconde e limpa a curiosidade lateral se ela ainda estiver visível
            const currentCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
            if (currentCuriositySidebar) {
                currentCuriositySidebar.classList.remove('show');
                currentCuriositySidebar.innerHTML = '';
            }

            // ATENÇÃO: Recalcular total de perguntas baseado na nova estrutura
            quizState.totalQuestions = questionsByLevel.reduce((acc, levelData) => acc + levelData.perguntas.length, 0);

            if (isWinner) {
                let medalTitle = "";
                if (quizState.score === quizState.totalQuestions) {
                    medalTitle = "Mestre Chorão! 🎸🏆";
                } else if (quizState.score >= quizState.totalQuestions * 0.75) {
                    medalTitle = "Fã Conhecedor! 🧠✨";
                } else if (quizState.score >= quizState.totalQuestions * 0.5) {
                    medalTitle = "Fã Iniciado! 🤘";
                } else {
                    medalTitle = "Skate na Mão! 😉";
                }

                elements.levelUpMessage.innerHTML = `
                    <div>${medalTitle}</div>
                    <div style="font-size: 0.8em; margin-top: 10px;">Você acertou ${quizState.score} de ${quizState.totalQuestions} perguntas!</div>
                    <button onclick="restartQuiz()">Jogar Novamente</button>
                `;
                // Background da mensagem de nível é o cinza principal
                elements.levelUpMessage.style.backgroundColor = 'var(--cor-preto-principal)'; 
                elements.levelUpMessage.style.display = 'flex';
                elements.levelUpMessage.classList.add('show');
            } else { // CASO DE DERROTA
                if (failedLevel) { // Derrota por excesso de erros no nível
                    elements.levelUpMessage.innerHTML = `
                        <div>Você errou demais neste nível.</div>
                        <div style="font-size: 0.8em; margin-top: 10px;">Tente novamente para dominar o Nível ${quizState.currentLevel + 1}!</div>
                        <button onclick="retryLevel()">Tentar Nível Novamente</button>
                        <button onclick="restartQuiz()">Reiniciar Quiz (Do Início)</button>
                    `;
                    elements.levelUpMessage.style.backgroundColor = 'var(--cor-vermelho-incorreto)';
                    elements.levelUpMessage.style.display = 'flex';
                    elements.levelUpMessage.classList.add('show');
                } else { // Derrota por ter chegado ao fim sem vencer (caso original)
                    elements.levelUpMessage.innerHTML = `
                        <div>Oops! Quase lá!</div>
                        <div style="font-size: 0.8em; margin-top: 10px;">Você acertou ${quizState.score} de ${quizState.totalQuestions} perguntas.</div>
                        <button onclick="restartQuiz()">Reiniciar Quiz (Do Início)</button>
                    `;
                    elements.levelUpMessage.style.backgroundColor = 'var(--cor-vermelho-incorreto)';
                    elements.levelUpMessage.style.display = 'flex';
                    elements.levelUpMessage.classList.add('show');
                }
            }
        }

        function retryLevel() {
            elements.levelUpMessage.classList.remove('show');
            setTimeout(() => {
                elements.levelUpMessage.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                quizState.quizPaused = false;
                quizState.isProcessingAnswer = false;
                elements.quiz.style.pointerEvents = 'all';

                quizState.errorsInCurrentLevel = 0;
                quizState.currentQuestionIndexInLevel = 0;    
                // ATENÇÃO: Pega as perguntas do nível atual novamente
                quizState.currentLevelQuestions = [...questionsByLevel[quizState.currentLevel].perguntas];
                shuffleArray(quizState.currentLevelQuestions);
                showQuestion();
                updateQuizInfo();
            }, 500);
        }

        function restartQuiz() {
            elements.levelUpMessage.classList.remove('show');
            setTimeout(() => {
                Object.assign(quizState, {
                    currentLevel: 0,
                    currentQuestionIndexInLevel: 0,
                    score: 0,
                    errorsInCurrentLevel: 0,
                    quizPaused: false,
                    isProcessingAnswer: false
                });
                elements.scoreText.textContent = '';
                elements.progressText.textContent = '';
                elements.levelText.textContent = '';
                elements.medalText.textContent = '';
                elements.restartBtn.style.display = 'none';
                elements.levelUpMessage.style.display = 'none';
                elements.mainOverlay.style.display = 'none';
                elements.quiz.style.pointerEvents = 'all';

                elements.quiz.innerHTML = ''; // Limpa o conteúdo do quiz
                // Esconde e limpa a curiosidade lateral se ela ainda estiver visível
                const currentCuriositySidebar = elements.quiz.querySelector('.curiosity-sidebar-box');
                if (currentCuriositySidebar) {
                    currentCuriositySidebar.classList.remove('show');
                    currentCuriositySidebar.innerHTML = '';
                }
                elements.startBtn.style.display = 'block'; // Mostra o botão de iniciar novamente
                
            }, 500);
        }

        // --- Inicialização ao Carregar a Página ---
        window.onload = () => {
            preloadImages(backgroundImages, () => {
                document.body.style.backgroundImage = `url("${backgroundImages[0]}")`;
                changeBackgroundImageInterval();
            });

            // ATENÇÃO: Esta linha foi removida pois a curiosity-sidebar-box agora é criada dentro da pergunta
            // const container = document.querySelector('.container');
            // container.insertBefore(elements.curiosityBox, document.getElementById('medal'));
            
            elements.quiz.addEventListener('click', handleQuizClick);
            setupPlayerEventListeners(); // Configura os listeners do player

            // Inicializar o ícone de volume corretamente ao carregar
            // O volume inicial já foi definido em playerState.previousVolume
            elements.audio.volume = playerState.previousVolume;
            elements.volumeSlider.value = playerState.previousVolume;
            elements.volumeValueSpan.textContent = `${Math.round(playerState.previousVolume * 100)}%`;

            if (elements.audio.volume === 0 || elements.audio.muted) {    
                elements.volumeSvg.style.display = 'none';
                elements.muteSvg.style.display = 'block';
                elements.audio.muted = true;    
            } else {    
                elements.volumeSvg.style.display = 'block';
                elements.muteSvg.style.display = 'none';
                elements.audio.muted = false;    
            }

            // Calcular total de perguntas uma vez, adaptado à nova estrutura
            quizState.totalQuestions = questionsByLevel.reduce((acc, levelData) => acc + levelData.perguntas.length, 0);

            // Carregar playlist
            fetch('https://raw.githubusercontent.com/charlibriano/Quiz-CBJR/main/playlist.json')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    playerState.playlist = data;
                    playerState.originalPlaylist = [...data]; // Guarda uma cópia da playlist original
                    if (playerState.playlist.length > 0) {
                        playerState.currentIndex = Math.floor(Math.random() * playerState.playlist.length);
                        loadSong();
                    } else {
                        console.warn('Playlist está vazia! Verifique o arquivo playlist.json.');
                        elements.currentSongText.textContent = `N/A (Playlist vazia ou erro)`;
                        // Desabilita os botões se a playlist estiver vazia
                        elements.playPauseBtn.disabled = true;
                        elements.prevBtn.disabled = true;
                        elements.nextBtn.disabled = true;
                        elements.repeatBtn.disabled = true;
                        elements.shuffleBtn.disabled = true;
                        elements.muteBtn.disabled = true;
                        elements.volumeSlider.disabled = true;
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar playlist:', error);
                    elements.currentSongText.textContent = `Erro ao carregar a playlist. Tente novamente mais tarde.`;
                    // Desabilita os botões em caso de erro no carregamento
                    elements.playPauseBtn.disabled = true;
                    elements.prevBtn.disabled = true;
                    elements.nextBtn.disabled = true;
                    elements.repeatBtn.disabled = true;
                    elements.shuffleBtn.disabled = true;
                    elements.muteBtn.disabled = true;
                    elements.volumeSlider.disabled = true;
                });
        };
    </script>
</body>
</html>
