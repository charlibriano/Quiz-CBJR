name: Android Capacitor Build (Corrigido)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar pacotes SDK
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Preparar App Capacitor
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp && cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli@latest >/dev/null
          npm i @capacitor/core@latest @capacitor/android@latest >/dev/null
          
          # --- Adicionado: Criar um index.html básico para o Capacitor --- 
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>Quiz CBJR</title></head><body><h1>Hello Capacitor!</h1></body></html>' > www/index.html
          
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "compileSdkVersion": 34,
              "targetSdkVersion": 34,
              "minSdkVersion": 22
            }
          }
          JSON

      - name: Copiar Web Assets
        run: |
          set -e
          # --- Removido: A lógica de cópia de assets foi simplificada --- 
          # O Capacitor espera que os assets estejam em 'www' antes de adicionar a plataforma
          # Se você tiver um projeto web real, os arquivos devem estar na raiz do seu repositório
          # e serão copiados para capapp/www neste passo.
          
          # Para este exemplo, estamos apenas garantindo que o index.html básico exista.
          test -f capapp/www/index.html

      - name: Capacitor Add & Sync Android
        working-directory: capapp
        run: |
          set -e
          npx cap add android
          npx cap sync android

      - name: Configurar Memória do Gradle
        working-directory: capapp/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties

      - name: Set Gradle Version to 8.9
        working-directory: capapp/android
        run: ./gradlew wrapper --gradle-version 8.9 --distribution-type all

      - name: Build APK (debug)
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:clean :app:assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-debug-apk
          path: capapp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
