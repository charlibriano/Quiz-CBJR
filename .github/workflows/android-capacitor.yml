name: Android (Capacitor) Build — minimal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # ==== Capacitor + copiar web ====
      - name: Preparar capapp
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp
          cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli >/dev/null
          npm i @capacitor/core @capacitor/android >/dev/null
          # capacitor.config.json
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

      - name: Copiando web do repo para capapp/www
        run: |
          set -e
          mkdir -p capapp/www
          # Se o repo tem /www usa-a; senão copia a raiz (index.html na raiz)
          if [ -f ./www/index.html ]; then
            cp -a ./www/. capapp/www/
          else
            cp -a ./*.html capapp/www/ 2>/dev/null || true
            cp -a ./*.htm  capapp/www/ 2>/dev/null || true
            cp -a ./assets capapp/www/ 2>/dev/null || true
            cp -a ./img capapp/www/     2>/dev/null || true
            cp -a ./css capapp/www/     2>/dev/null || true
            cp -a ./js capapp/www/      2>/dev/null || true
          fi
          test -f capapp/www/index.html || { echo "index.html nao encontrado em capapp/www"; exit 2; }
          echo "OK index.html -> capapp/www"

      - name: Capacitor init + Android
        working-directory: capapp
        run: |
          set -e
          # cap init sem flags inválidas, 100% não-interativo
          npx cap init "Quiz CBJR" br.com.quizcbjr --web-dir=www --npm-client=npm --yes
          npx cap add android
          npx cap sync android

      # ==== Ajustes Gradle/Settings básicos ====
      - name: Ajustes Gradle/Settings
        working-directory: capapp/android
        run: |
          set -e
          # wrapper -> Gradle 8.6
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all
          # settings.gradle (AGP 8.x exige estes blocos)
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF
          # build.gradle raiz - garantir AGP 8.6.0 se houver bloco buildscript
          if grep -q "com.android.tools.build:gradle" build.gradle; then
            sed -i 's/com\.android\.tools\.build:gradle:[0-9.]\+/com.android.tools.build:gradle:8.6.0/g' build.gradle
          fi
          # gradle.properties & variables.gradle coerentes com SDK 35
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PROPS
          echo "ext { minSdkVersion = 22; compileSdkVersion = 35; targetSdkVersion = 35 }" > variables.gradle

      # ==== Build AAB (release) com fallback p/ APK (debug) ====
      - name: Build AAB (release)
        id: aab
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:clean :app:bundleRelease --stacktrace --info | tee ../../gradle_build.log

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-release-aab
          path: |
            capapp/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Fallback APK (debug) + logs
        if: failure()
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:assembleDebug --stacktrace --info | tee ../../gradle_build_debug.log

      - name: Upload APK/Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-and-logs
          path: |
            capapp/android/app/build/outputs/apk/debug/*.apk
            capapp/gradle_build.log
            capapp/gradle_build_debug.log
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
          include-hidden-files: false
