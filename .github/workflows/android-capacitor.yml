Aqui está o arquivo de fluxo de trabalho do GitHub Actions corrigido. Por favor, substitua o conteúdo do seu arquivo .github/workflows/android-capacitor-build.yml por este novo código.
Principais alterações e por que foram feitas:
Versões do SDK Android: Atualizei as versões do platforms;android-35 e build-tools;35.0.0 para platforms;android-34 e build-tools;34.0.0. A versão 35 pode ser muito recente e ainda não totalmente estável ou suportada por todas as ferramentas. A versão 34 é mais consolidada.
Versões do Capacitor: Atualizei as instalações do @capacitor/cli, @capacitor/core e @capacitor/android para @latest para garantir que você esteja usando as versões mais recentes e compatíveis.
Configurações do capacitor.config.json: Adicionei as configurações de compileSdkVersion, targetSdkVersion e minSdkVersion diretamente no capacitor.config.json dentro da seção android. Isso garante que o Capacitor configure corretamente o projeto Android com as versões desejadas, o que é crucial para um build bem-sucedido.
Simplificação do Build: Removi a etapa de build do AAB (release) e foquei apenas na geração do APK de depuração (:app:assembleDebug). Para builds de release (AAB), geralmente é necessário configurar chaves de assinatura, o que adiciona complexidade. Para fins de depuração e teste, o APK é suficiente. Se você precisar do AAB para publicação, podemos ajustar isso depois de resolver o problema do APK.
Comando npx cap add android: Removi o yes | antes de npx cap add android. O Capacitor CLI geralmente é interativo, mas em ambientes CI, ele pode precisar de uma forma diferente de confirmação ou pode não precisar se o projeto já estiver configurado.
