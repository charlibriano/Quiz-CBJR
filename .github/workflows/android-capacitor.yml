name: Android Capacitor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Preparar capapp
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp && cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli >/dev/null
          npm i @capacitor/core @capacitor/android >/dev/null
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

      - name: Copiar web
        run: |
          set -e
          mkdir -p capapp/www
          if [ -f ./www/index.html ]; then
            cp -a ./www/. capapp/www/
          else
            cp -a ./*.html capapp/www/ 2>/dev/null || true
            cp -a ./*.htm  capapp/www/ 2>/dev/null || true
            for d in assets img css js; do [ -d "$d" ] && cp -a "$d" capapp/www/ || true; done
          fi
          test -f capapp/www/index.html

      - name: Capacitor add/sync Android
        working-directory: capapp
        run: |
          set -e
          yes | npx cap add android
          npx cap sync android

      - name: Ajustes Gradle/Settings
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PROPS
          echo "ext { minSdkVersion = 22; compileSdkVersion = 35; targetSdkVersion = 35 }" > variables.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.6.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF

      - name: Build AAB (release)
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:clean :app:bundleRelease --stacktrace --info | tee ../../gradle_build_release.log

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-aab
          path: 'capapp/android/app/build/outputs/bundle/release/*.aab'
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Build APK (debug) se AAB falhar
        if: failure()
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:assembleDebug --stacktrace --info | tee ../../gradle_build_debug.log

      - name: Upload APK (debug) + logs
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-apk-e-logs
          path: |
            capapp/android/app/build/outputs/apk/**/*.apk
            capapp/gradle_build_release.log
            capapp/gradle_build_debug.log
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
          include-hidden-files: false
