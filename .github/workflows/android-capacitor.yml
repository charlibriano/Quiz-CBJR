name: Android (Capacitor) Build — minimal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      # 1) Código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Toolchain
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # 3) Projeto Capacitor recém criado
      - name: Preparar capapp
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp
          cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli >/dev/null
          npm i @capacitor/core @capacitor/android >/dev/null
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

      # 4) Copia do site para capapp/www
      - name: Copiando web do repo para capapp/www
        run: |
          set -e
          mkdir -p capapp/www
          if [ -f ./www/index.html ]; then
            cp -a ./www/. capapp/www/
          else
            cp -a ./*.html capapp/www/ 2>/dev/null || true
            cp -a ./*.htm  capapp/www/ 2>/dev/null || true
            for d in assets img css js; do
              [ -d "$d" ] && cp -a "$d" capapp/www/ || true
            done
          fi
          test -f capapp/www/index.html || { echo "index.html nao encontrado em capapp/www"; exit 2; }
          echo "OK index.html -> capapp/www"

      # 5) Capacitor add/sync Android
      - name: Capacitor add/sync Android
        working-directory: capapp
        run: |
          set -e
          yes | npx cap add android
          npx cap sync android

      # 6) Ajustes de Gradle/Settings p/ AGP 8 e SDK 35
      - name: Ajustes Gradle/Settings
        working-directory: capapp/android
        run: |
          set -e
          # wrapper (mantém gradle recente e compatível)
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all

          # settings.gradle (garante repositórios adequados)
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF

          # Propriedades e versões de SDK
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PROPS

          echo "ext { minSdkVersion = 22; compileSdkVersion = 35; targetSdkVersion = 35 }" > variables.gradle

      # 6.1) **Correção**: recria build.gradle raiz válido (o anterior estava quebrando o parser)
      - name: Recriar build.gradle raiz (válido p/ AGP 8)
        working-directory: capapp/android
        run: |
          set -e
          cat > build.gradle <<'EOF'
// Top-level build file for the Android project (Capacitor)
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin (compatível com Gradle 8.6+)
        classpath 'com.android.tools.build:gradle:8.6.0'
        // Se usar Firebase/Google Services, descomente a linha abaixo:
        // classpath 'com.google.gms:google-services:4.4.2'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
EOF

      # 7) Build AAB (release)
      - name: Build AAB (release)
        id: aab
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:clean :app:bundleRelease --stacktrace --info | tee ../../gradle_build_release.log

      # 8) Listar artefatos gerados (ajuda a depurar paths)
      - name: Listar artefatos gerados
        run: |
          echo "== .aab =="
          find capapp/android/app/build/outputs -name "*.aab" -type f || true
          echo "== .apk =="
          find capapp/android/app/build/outputs -name "*.apk" -type f || true

      # 9) Upload AAB
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-aab
          path: capapp/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      # 10) Fallback: gera APK (debug) se AAB falhar
      - name: Build APK (debug) se AAB falhar
        if: failure()
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:assembleDebug --stacktrace --info | tee ../../gradle_build_debug.log

      # 11) Upload APK + logs (se existir)
      - name: Upload APK (debug) + logs
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-apk-e-logs
          path: |
            capapp/android/app/build/outputs/apk/**/**/*.apk
            capapp/gradle_build_release.log
            capapp/gradle_build_debug.log
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
          include-hidden-files: false
