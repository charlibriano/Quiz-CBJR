name: Android (Capacitor) Build — v-final-dbg

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Diagnóstico do repo (árvore e onde está index.html)
        run: |
          echo "::group::Árvore do repo (topo)"; ls -la; echo "::endgroup::"
          if [ -f "./index.html" ]; then
            echo "index.html ENCONTRADO na raiz."
          elif [ -f "./www/index.html" ]; then
            echo "index.html ENCONTRADO em ./www."
          else
            echo "index.html NÃO encontrado na raiz nem em ./www."
          fi

      - name: Capacitor + copiar web
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp/www
          if [ -f "./index.html" ]; then
            cp -R ./* capapp/www/ || true
          elif [ -f "./www/index.html" ]; then
            cp -R ./www/* capapp/www/ || true
          else
            echo "index.html nao encontrado (raiz ou ./www)"; exit 1
          fi
          echo "::group::Árvore de capapp/www"; ls -la capapp/www | sed -e 's/^/  /'; echo "::endgroup::"

          cd capapp
          npm init -y
          npm i @capacitor/cli @capacitor/core @capacitor/android

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "bundledWebRuntime": false,
            "npmClient": "npm",
            "webDir": "www",
            "server": { "cleartext": true, "allowNavigation": ["*"] }
          }
          EOF

          npx cap add android

      - name: Ajustes Gradle/Settings (seguros)
        working-directory: ./capapp/android
        run: |
          set -e
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > variables.gradle <<'EOF'
          ext {
              minSdkVersion = 22
              compileSdkVersion = 35
              targetSdkVersion = 35
          }
          EOF

          # Namespace e Java 17
          if ! grep -q 'namespace ' app/build.gradle; then
            awk '{print} /android[[:space:]]*\{/ && !seen++ {print "    namespace \"br.com.quizcbjr\""}' app/build.gradle > t && mv t app/build.gradle
          fi
          if ! grep -q 'compileOptions' app/build.gradle; then
            cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

      - name: Build AAB (AGP padrão gerado pelo Capacitor)
        id: build_aab
        working-directory: ./capapp/android
        run: |
          set -e
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties || true
          ./gradlew --version || true
          ./gradlew --no-daemon clean bundleRelease --stacktrace --info | tee ../../aab_build.log

      - name: Upload log (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-aab
          path: capapp/aab_build.log
          if-no-files-found: warn

      - name: Se AAB falhar, tentar AGP 8.6
        if: failure()
        working-directory: ./capapp/android
        run: |
          set -e
          sed -i 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.6-all.zip#' gradle/wrapper/gradle-wrapper.properties
          if grep -q "com.android.tools.build:gradle" build.gradle; then
            sed -i 's/com\.android\.tools\.build:gradle:[0-9\.]\+/com.android.tools.build:gradle:8.6.0/g' build.gradle
          else
            cat > z_inject_build.gradle <<'EOF'
buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.6.0' } }
allprojects { repositories { google(); mavenCentral() } }
EOF
            cat z_inject_build.gradle build.gradle > build.gradle.new && mv build.gradle.new build.gradle && rm -f z_inject_build.gradle
          fi
          ./gradlew --no-daemon clean bundleRelease --stacktrace --info | tee ../../aab_build_agp86.log

      - name: Upload log (AGP 8.6)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-aab-agp86
          path: capapp/aab_build_agp86.log
          if-no-files-found: warn

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-release-aab
          path: capapp/android/app/build/outputs/bundle/release/*.aab

      - name: Fallback APK (debug)
        if: failure()
        working-directory: ./capapp/android
        run: ./gradlew --no-daemon assembleDebug --stacktrace --info | tee ../../apk_debug.log

      - name: Upload APK e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-and-logs
          path: |
            capapp/android/app/build/outputs/apk/debug/*.apk
            capapp/apk_debug.log
          if-no-files-found: warn
