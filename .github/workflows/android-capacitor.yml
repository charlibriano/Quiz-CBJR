name: Android (Capacitor) Build — minimal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -e
          echo "SDK em: $ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Capacitor + copiar web
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp
          cd capapp

          # pacotes base
          npm init -y >/dev/null
          npm i -D @capacitor/cli >/dev/null
          npm i @capacitor/core >/dev/null
          npm i -D @capacitor/android >/dev/null

          # criar config básico
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

          # detectar origem web (www/ ou raiz do repo)
          cd ..
          if [ -f "www/index.html" ]; then
            WEB_SRC="www"
          elif [ -f "index.html" ]; then
            WEB_SRC="."
          else
            echo "::error ::index.html não encontrado (nem na raiz nem em www/)."
            exit 1
          fi

          # copiar web para capapp/www
          rm -rf capapp/www
          mkdir -p capapp/www
          rsync -a --delete "${WEB_SRC}/" capapp/www/

          # inicializar/add android
          cd capapp
          npx cap init QuizCBJR br.com.quizcbjr --web-dir=www --no-interactive
          npx cap add android

      - name: Ajustes Gradle/Settings básicos
        working-directory: capapp/android
        run: |
          set -e
          # gradle.properties
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PROPS

          # variables.gradle (valores seguros p/ AGP 8.x + SDK 35)
          cat > variables.gradle <<'GRAD'
          ext {
            minSdkVersion = 22
            compileSdkVersion = 35
            targetSdkVersion = 35
            androidxAppCompatVersion = '1.6.1'
            androidxCoordinatorLayoutVersion = '1.2.0'
            coreSplashScreenVersion = '1.0.1'
            junitVersion = '4.13.2'
            androidxJunitVersion = '1.1.5'
            androidxEspressoCoreVersion = '3.5.1'
          }
          GRAD

          # settings.gradle moderno (evita problemas de encoding)
          cat > settings.gradle <<'SETG'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "capapp"
          include(":app")
          SETG

      - name: Wrapper Gradle 8.6
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all

      - name: Build AAB (release)
        id: build_aab
        working-directory: capapp/android
        run: |
          set -e
          # Sync web -> android/app/src/main/assets/public
          npx cap sync android

          # tentar bundleRelease; se falhar, não quebrar o job (vamos tentar APK depois)
          set +e
          ./gradlew --no-daemon clean bundleRelease --stacktrace --info | tee ../../aab_build.log
          RC=$?
          echo "aab_rc=$RC" >> $GITHUB_OUTPUT
          exit 0

      - name: Fallback APK (debug)
        if: steps.build_aab.outputs.aab_rc != '0'
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew --no-daemon assembleDebug --stacktrace --info | tee ../../apk_build_debug.log

      - name: Localizar e listar APK/AAB gerados
        run: |
          echo "Listando .apk/.aab gerados em capapp/android ..."
          find capapp/android -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: Upload artefatos (APK/AAB + logs)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            capapp/android/**/*.apk
            capapp/android/**/*.aab
            capapp/aab_build.log
            capapp/apk_build_debug.log
          if-no-files-found: warn
