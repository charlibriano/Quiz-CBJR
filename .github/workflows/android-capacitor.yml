name: Android (Capacitor) Build — minimal

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Capacitor + copiar web
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp/www
          if [ -f "./index.html" ]; then
            cp -R ./* capapp/www/ || true
          elif [ -f "./www/index.html" ]; then
            cp -R ./www/* capapp/www/ || true
          else
            echo "index.html nao encontrado (raiz ou ./www)"; exit 1
          fi
          cd capapp
          npm init -y
          npm i @capacitor/cli @capacitor/core @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "bundledWebRuntime": false,
            "npmClient": "npm",
            "webDir": "www",
            "server": { "cleartext": true, "allowNavigation": ["*"] }
          }
          EOF
          npx cap add android

      - name: Ajustes Gradle/Settings básicos
        working-directory: ./capapp/android
        run: |
          set -e
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF
          printf '%s\n' "android.useAndroidX=true" "android.enableJetifier=true" "org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" > gradle.properties
          printf '%s\n' "ext { minSdkVersion = 22; compileSdkVersion = 35; targetSdkVersion = 35 }" > variables.gradle
          if ! grep -q 'namespace ' app/build.gradle; then
            awk '{print} /android[[:space:]]*\{/ && !seen++ {print "    namespace \"br.com.quizcbjr\""}' app/build.gradle > t && mv t app/build.gradle
          fi
          if ! grep -q 'compileOptions' app/build.gradle; then
            cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

      - name: Build AAB (release)
        working-directory: ./capapp/android
        run: ./gradlew --no-daemon clean bundleRelease --stacktrace --info | tee ../../gradle_build.log

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-release-aab
          path: capapp/android/app/build/outputs/bundle/release/*.aab

      - name: Fallback APK (debug) + logs
        if: failure()
        working-directory: ./capapp/android
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace --info | tee ../../gradle_build_debug.log

      - name: Upload APK/Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-and-logs
          path: |
            capapp/android/app/build/outputs/apk/debug/*.apk
            capapp/gradle_build.log
            capapp/gradle_build_debug.log
          if-no-files-found: ignore
