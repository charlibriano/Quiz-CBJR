name: Android (Capacitor) Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bootstrap Capacitor project
        run: |
          rm -rf capapp
          mkdir -p capapp/www

          # Detecta onde esta seu index.html
          if [ -f "./index.html" ]; then
            cp -R ./* capapp/www/ || true
          elif [ -f "./www/index.html" ]; then
            cp -R ./www/* capapp/www/ || true
          else
            echo "index.html nao encontrado na raiz nem em ./www" && exit 1
          fi

          cd capapp
          npm init -y
          npm i @capacitor/cli @capacitor/core @capacitor/android

          cat > capacitor.config.json <<EOF
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "bundledWebRuntime": false,
            "npmClient": "npm",
            "webDir": "www",
            "server": { "cleartext": true, "allowNavigation": ["*"] }
          }
          EOF

          npx cap add android

      - name: Patch Gradle/AGP/Settings/Java17
        working-directory: ./capapp/android
        run: |
          # Gradle wrapper 8.6
          sed -i 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.6-all.zip#' gradle/wrapper/gradle-wrapper.properties

          # AGP 8.6.0 no build.gradle raiz
          if grep -q "com.android.tools.build:gradle" build.gradle; then
            sed -i 's/com\.android\.tools\.build:gradle:[0-9\.]\+/com.android.tools.build:gradle:8.6.0/g' build.gradle
          else
            cat > z_inject_build.gradle <<'EOF'
            buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.6.0' }
            }
            allprojects {
              repositories { google(); mavenCentral() }
            }
            EOF
            cat z_inject_build.gradle build.gradle > build.gradle.new && mv build.gradle.new build.gradle
            rm -f z_inject_build.gradle
          fi

          # settings.gradle moderno
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF

          # gradle.properties
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          # variables.gradle base
          cat > variables.gradle <<'EOF'
          ext {
              minSdkVersion = 22
              compileSdkVersion = 35
              targetSdkVersion = 35
          }
          EOF

          # Garantir namespace e Java 17
          if ! grep -q 'namespace ' app/build.gradle; then
            awk '{
              print;
              if ($0 ~ /android[[:space:]]*\{/) { print "    namespace \"br.com.quizcbjr\""; }
            }' app/build.gradle > app/build.gradle.new && mv app/build.gradle.new app/build.gradle
          fi

          if ! grep -q 'compileOptions' app/build.gradle; then
            cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

      - name: Build AAB (release)
        working-directory: ./capapp/android
        run: ./gradlew --no-daemon clean bundleRelease --stacktrace --info

      - name: Upload AAB artifact (release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-release-aab
          path: capapp/android/app/build/outputs/bundle/release/*.aab

      - name: Build APK (debug) fallback
        if: failure()
        working-directory: ./capapp/android
        run: ./gradlew --no-daemon assembleDebug --stacktrace --info

      - name: Upload APK artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-debug-apk
          path: capapp/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
