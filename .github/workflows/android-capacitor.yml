name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar pacotes do Android SDK
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Instalar Dependências Node.js
        run: |
          npm install
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: Inicializar Capacitor e Adicionar Plataforma Android
        run: |
          npx cap init "Quiz CBJR" "br.com.quizcbjr" --web-dir "www"
          npx cap add android

      - name: Copiar Arquivos Web para o Diretório www
        run: |
          mkdir -p www
          # Copia todos os arquivos e diretórios da raiz do seu projeto para www
          # Ajuste este comando se seus arquivos web estiverem em um subdiretório específico
          cp -r ./* www/ 2>/dev/null || true
          # Garante que um index.html exista, mesmo que seja um placeholder
          test -f www/index.html || echo "<!DOCTYPE html><html><head><title>Capacitor App</title></head><body><h1>Hello Capacitor!</h1></body></html>" > www/index.html

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Conceder Permissão de Execução ao Gradlew
        run: chmod +x android/gradlew

      - name: Limpar e Construir o APK de Debug
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace

      - name: Fazer Upload do Artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
