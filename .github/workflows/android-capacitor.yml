build-corrigido.yml
name: Android Capacitor Build (Corrigido)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar pacotes SDK
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Preparar App Capacitor
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp && cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli@latest >/dev/null
          npm i @capacitor/core@latest @capacitor/android@latest >/dev/null
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "compileSdkVersion": 34,
              "targetSdkVersion": 34,
              "minSdkVersion": 22
            }
          }
          JSON

      - name: Copiar Web Assets
        run: |
          set -e
          mkdir -p capapp/www
          if [ -f ./www/index.html ]; then
            cp -a ./www/. capapp/www/
          else
            cp -a ./*.html capapp/www/ 2>/dev/null || true
            cp -a ./*.htm  capapp/www/ 2>/dev/null || true
            for d in assets img css js; do [ -d "$d" ] && cp -a "$d" capapp/www/ || true; done
          fi
          test -f capapp/www/index.html

      - name: Capacitor Add & Sync Android
        working-directory: capapp
        run: |
          set -e
          npx cap add android
          npx cap sync android

      - name: Build APK (debug)
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:clean :app:assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-debug-apk
          path: capapp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
