name: Android (Capacitor) Build — minimal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      # 1) Código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Toolchain
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # 3) Projeto Capacitor “limpo”
      - name: Preparar capapp
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp
          cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli >/dev/null
          npm i @capacitor/core @capacitor/android >/dev/null
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

      # 4) Copiar seu site para capapp/www
      - name: Copiando web do repo para capapp/www
        run: |
          set -e
          mkdir -p capapp/www
          if [ -f ./www/index.html ]; then
            cp -a ./www/. capapp/www/
          else
            cp -a ./*.html capapp/www/ 2>/dev/null || true
            cp -a ./*.htm  capapp/www/ 2>/dev/null || true
            for d in assets img css js; do
              [ -d "$d" ] && cp -a "$d" capapp/www/ || true
            done
          fi
          test -f capapp/www/index.html || { echo "index.html nao encontrado em capapp/www"; exit 2; }
          echo "OK index.html -> capapp/www"

      # 5) Capacitor add/sync
      - name: Capacitor add/sync Android
        working-directory: capapp
        run: |
          set -e
          yes | npx cap add android
          npx cap sync android

      # 6) Ajustes Gradle/Settings (AGP 8 / SDK 35)
      - name: Ajustes Gradle/Settings
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all

          # settings.gradle moderno
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF

          # gradle.properties e versions
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PROPS
          echo "ext { minSdkVersion = 22; compileSdkVersion = 35; targetSdkVersion = 35 }" > variables.gradle

      # 6.1) >>> CORREÇÃO CRÍTICA <<<
      # Zera o build.gradle raiz para remover blocos 'buildscript' e evitar o erro de Groovy.
      - name: Limpar build.gradle raiz (AGP 8+)
        working-directory: capapp/android
        run: |
          printf "// intentionally left blank for AGP 8+\n" > build.gradle
          echo "Root build.gradle limpo."

      # 7) Build APK (debug) – garantimos artefato
      - name: Build APK (debug)
        id: apk
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:assembleDebug --stacktrace --info | tee ../../gradle_build_debug.log

      # 8) Listar o que foi gerado (stdout útil p/ diagnóstico se faltar arquivo)
      - name: Listar artefatos gerados
        run: |
          echo "== .apk =="
          find capapp/android/app/build/outputs -name "*.apk" -maxdepth 4 -type f || true

      # 9) Upload APK e logs
      - name: Upload APK (debug) + logs
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-debug-apk
          path: |
            capapp/android/app/build/outputs/apk/debug/*.apk
            capapp/gradle_build_debug.log
          if-no-files-found: error
          compression-level: 6
