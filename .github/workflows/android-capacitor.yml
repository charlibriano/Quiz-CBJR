name: Android (Capacitor) Build — minimal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CAPACITOR_DISABLE_TELEMETRY: "1"

    steps:
      # 1) Código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Toolchain
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # 3) Projeto Capacitor
      - name: Preparar capapp
        run: |
          set -e
          rm -rf capapp
          mkdir -p capapp
          cd capapp
          npm init -y >/dev/null
          npm i -D @capacitor/cli >/dev/null
          npm i @capacitor/core @capacitor/android >/dev/null
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.quizcbjr",
            "appName": "Quiz CBJR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

      - name: Copiando web do repo para capapp/www
        run: |
          set -e
          mkdir -p capapp/www
          if [ -f ./www/index.html ]; then
            cp -a ./www/. capapp/www/
          else
            cp -a ./*.html capapp/www/ 2>/dev/null || true
            cp -a ./*.htm  capapp/www/ 2>/dev/null || true
            for d in assets img css js; do
              [ -d "$d" ] && cp -a "$d" capapp/www/ || true
            done
          fi
          test -f capapp/www/index.html || { echo "index.html nao encontrado em capapp/www"; exit 2; }
          echo "OK index.html -> capapp/www"

      - name: Capacitor add/sync Android
        working-directory: capapp
        run: |
          set -e
          yes | npx cap add android
          npx cap sync android

      # 4) Ajustes Gradle/Settings para AGP 8 e SDK 35
      - name: Ajustes Gradle/Settings
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew wrapper --gradle-version 8.6 --distribution-type all
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "capapp"
          include(":app")
          EOF
          # Se build.gradle raiz tiver plugin AGP antigo, força 8.6.0
          if grep -q "com.android.tools.build:gradle" build.gradle; then
            sed -i 's/com\.android\.tools\.build:gradle:[0-9.]\+/com.android.tools.build:gradle:8.6.0/g' build.gradle
          fi
          # Remove blocos herdados que quebram o build (buildscript/allprojects)
          sed -i '/buildscript {/,/}/d' build.gradle
          sed -i '/allprojects {/,/}/d' build.gradle
          # Propriedades
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          PROPS
          echo "ext { minSdkVersion = 22; compileSdkVersion = 35; targetSdkVersion = 35 }" > variables.gradle

      # 5) Build AAB (release)
      - name: Build AAB (release)
        id: aab
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:clean :app:bundleRelease --stacktrace --info | tee ../../gradle_build_release.log

      # 6) Se AAB falhar, build APK (debug)
      - name: Build APK (debug) se AAB falhar
        if: failure()
        id: apk
        working-directory: capapp/android
        run: |
          set -e
          ./gradlew :app:assembleDebug --stacktrace --info | tee ../../gradle_build_debug.log

      # 7) Mostrar o que foi gerado (sempre)
      - name: Listar artefatos gerados
        if: always()
        working-directory: capapp/android
        run: |
          echo "== conteúdo de app/build/outputs =="
          find app/build/outputs -maxdepth 4 -type f -printf "%p\n" || true

      # 8) Upload do AAB (não falha se não encontrar)
      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-aab
          path: capapp/android/app/build/outputs/**/*.aab
          if-no-files-found: ignore
          compression-level: 6

      # 9) Upload APK e logs (não falha se não encontrar)
      - name: Upload APK (debug) + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuizCBJR-apk-e-logs
          path: |
            capapp/android/app/build/outputs/**/*.apk
            capapp/gradle_build_release.log
            capapp/gradle_build_debug.log
          if-no-files-found: ignore
          compression-level: 6
